<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能考试系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8ecf1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(74,144,217,0.10), 0 1px 4px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.7);
            padding: 48px 40px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #1a2332;
            font-size: 2.2em;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
            font-weight: 700;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.9em;
            margin-bottom: 36px;
        }
        .entry-buttons {
            display: flex;
            gap: 24px;
            justify-content: center;
        }
        @media (max-width: 480px) {
            .entry-buttons { flex-direction: column; gap: 16px; }
        }
        .entry-btn {
            flex: 1;
            padding: 36px 24px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1.5px solid rgba(255,255,255,0.8);
            color: #1e293b;
        }
        .entry-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(74,144,217,0.12);
        }
        .entry-btn:active {
            transform: translateY(0) scale(0.97);
        }
        .entry-btn .icon {
            font-size: 2.8em;
        }
        .entry-btn.teacher-btn:hover {
            border-color: #f093fb;
            background: rgba(240,147,251,0.06);
        }
        .entry-btn.student-btn:hover {
            border-color: #4A90D9;
            background: rgba(74,144,217,0.06);
        }
        .entry-btn .desc {
            font-size: 0.78em;
            color: #94a3b8;
            font-weight: 400;
        }
        .register-link {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }
        .register-link a {
            color: #4A90D9;
            text-decoration: none;
            font-size: 0.92em;
            font-weight: 500;
            transition: color 0.2s;
        }
        .register-link a:hover {
            color: #357ABD;
        }
        .version {
            color: #94a3b8;
            font-size: 0.78em;
            margin-top: 24px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 AI智能考试系统</h1>
        <div class="subtitle">请选择身份进入系统</div>

        <div class="entry-buttons">
            <button class="entry-btn teacher-btn" onclick="window.location.href='teacher-login.html'">
                <span class="icon">👨‍🏫</span>
                <span>教师入口</span>
                <span class="desc">上传试卷、阅卷评分</span>
            </button>
            <button class="entry-btn student-btn" onclick="window.location.href='student-login.html'">
                <span class="icon">🎒</span>
                <span>学生入口</span>
                <span class="desc">参加考试、查看成绩</span>
            </button>
        </div>

        <div class="register-link">
            <a href="register.html">📝 教师注册 — 还没有账号？立即注册</a>
        </div>

        <div class="version">v4.0 · 多Stata支持 · 自动阅卷 · 附件管理</div>
    </div>
</body>
</html>
