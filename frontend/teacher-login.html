<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师登录 - AI智能考试系统</title>
    <style>
        :root {
            --bg-root: #faf9f7;
            --bg-card: #ffffff;
            --bg-hover: #f5f3f0;
            --bg-input: #ffffff;
            --border-default: #e8e5e0;
            --border-hover: #d4cfc8;
            --text-primary: #1a1816;
            --text-secondary: #6b6560;
            --text-tertiary: #9e9892;
            --accent: #1a1816;
            --accent-dim: rgba(26,24,22,0.06);
            --success: #4a8c5c;
            --success-dim: rgba(74,140,92,0.08);
            --warning: #c4904a;
            --warning-dim: rgba(196,144,74,0.08);
            --error: #c45a5a;
            --error-dim: rgba(196,90,90,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-root);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-default);
            padding: 48px 40px 40px;
            max-width: 420px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: var(--text-primary);
            font-size: 1.5em;
            margin-bottom: 4px;
            font-weight: 700;
        }
        .back-link {
            text-align: center;
            margin-bottom: 28px;
        }
        .back-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85em;
        }
        .back-link a:hover { color: var(--text-primary); }
        .login-box {
            background: var(--bg-hover);
            border-radius: var(--radius-md);
            padding: 32px 28px;
            border: 1px solid var(--border-default);
        }
        .login-box h2 {
            color: var(--text-primary);
            margin-bottom: 24px;
            text-align: center;
            font-size: 1.1em;
            font-weight: 600;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; margin-bottom: 6px;
            color: var(--text-secondary); font-weight: 500; font-size: 0.88em;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 0.95em;
            transition: border-color 0.2s;
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--border-hover);
        }
        .form-group input::placeholder { color: var(--text-tertiary); }
        .btn {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            background: var(--bg-card);
            color: var(--text-primary);
            margin-top: 8px;
        }
        .btn:hover:not(:disabled) {
            background: var(--bg-hover);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-message {
            color: var(--error); text-align: center; margin-top: 12px;
            font-size: 0.85em; display: none;
        }
        .register-link {
            text-align: center; margin-top: 16px; padding-top: 14px;
            border-top: 1px solid var(--border-default);
        }
        .register-link a {
            color: var(--text-primary); text-decoration: none; font-size: 0.9em;
            font-weight: 500;
        }
        .register-link a:hover { color: var(--text-secondary); }
        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 14px 24px; border-radius: var(--radius-sm); color: white;
            font-size: 0.95em; z-index: 9999;
            opacity: 0; transition: opacity 0.3s, transform 0.3s;
            transform: translateY(-8px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-error { background: var(--error); }
        .toast-success { background: var(--success); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }
    </style>
</head>
<body>
    <div class="container">
        <h1>教师登录</h1>
        <div class="back-link"><a href="login.html">← 返回首页</a></div>
        <div class="login-box">
            <h2>教师身份验证</h2>
            <form id="teacherLoginForm">
                <div class="form-group">
                    <label>教师ID / 用户名</label>
                    <input type="text" id="teacherId" placeholder="请输入教师ID或用户名" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="teacherPassword" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn">进入教师系统</button>
                <div class="error-message" id="teacherError"></div>
            </form>
            <div class="register-link">
                <a href="register.html">还没有账号？立即注册</a>
            </div>
        </div>
        
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        document.getElementById('teacherLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const teacherId = document.getElementById('teacherId').value;
            const teacherPassword = document.getElementById('teacherPassword').value;
            const errorDiv = document.getElementById('teacherError');
            errorDiv.style.display = 'none';
            try {
                const response = await fetch(`${API}/teacher/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: teacherId, password: teacherPassword })
                });
                const data = await response.json();
                if (response.ok) {
                    showToast('登录成功，正在跳转...', 'success');
                    setTimeout(() => { window.location.href = 'teacher.html'; }, 500);
                } else {
                    errorDiv.textContent = data.error || '登录失败';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = '网络错误，请检查后端是否运行';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
