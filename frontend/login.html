<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能考试系统</title>
    <style>
        :root {
            --bg-root: #faf9f7;
            --bg-card: #ffffff;
            --bg-hover: #f5f3f0;
            --border-default: #e8e5e0;
            --border-hover: #d4cfc8;
            --text-primary: #1a1816;
            --text-secondary: #6b6560;
            --text-tertiary: #9e9892;
            --accent: #1a1816;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-root);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .container {
            max-width: 440px;
            width: 100%;
            text-align: center;
            padding: 0 8px;
        }
        h1 {
            color: var(--text-primary);
            font-size: 1.6em;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
            line-height: 1.35;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95em;
            margin-bottom: 44px;
            line-height: 1.5;
        }
        .entry-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .entry-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 18px 22px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            background: var(--bg-card);
            color: var(--text-primary);
            transition: border-color 0.15s ease, background 0.15s ease;
            text-align: left;
            font-family: inherit;
        }
        .entry-btn:hover {
            border-color: var(--border-hover);
            background: var(--bg-hover);
        }
        .entry-btn:active {
            background: var(--bg-hover);
        }
        .entry-btn .arrow {
            font-size: 0.85em;
            color: var(--text-tertiary);
            transition: color 0.15s ease, transform 0.15s ease;
        }
        .entry-btn:hover .arrow {
            color: var(--text-secondary);
            transform: translateX(2px);
        }
        .entry-btn .label {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .entry-btn .label .name {
            font-size: 0.98em;
            font-weight: 500;
        }
        .entry-btn .label .hint {
            font-size: 0.82em;
            color: var(--text-tertiary);
            font-weight: 400;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0;
            color: var(--text-tertiary);
            font-size: 0.82em;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-default);
        }
        .register-link {
            text-align: center;
        }
        .register-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.88em;
            transition: color 0.15s ease;
        }
        .register-link a:hover {
            color: var(--text-primary);
        }
        .version {
            color: var(--text-tertiary);
            font-size: 0.75em;
            margin-top: 44px;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI 智能考试系统</h1>
        <div class="subtitle">选择身份进入</div>

        <div class="entry-buttons">
            <button class="entry-btn" onclick="window.location.href='teacher-login.html'">
                <span class="label">
                    <span class="name">教师入口</span>
                    <span class="hint">管理考试、阅卷与监考</span>
                </span>
                <span class="arrow">→</span>
            </button>
            <button class="entry-btn" onclick="window.location.href='student-login.html'">
                <span class="label">
                    <span class="name">学生入口</span>
                    <span class="hint">参加在线考试</span>
                </span>
                <span class="arrow">→</span>
            </button>
        </div>

        <div class="divider">或</div>

        <div class="register-link">
            <a href="register.html">还没有账号？注册教师账号</a>
        </div>

        <div class="version">v5.0</div>
    </div>
</body>
</html>
