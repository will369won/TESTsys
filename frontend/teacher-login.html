<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师登录 - AI智能考试系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8ecf1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(74,144,217,0.10), 0 1px 4px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.7);
            padding: 48px 40px 40px;
            max-width: 420px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #1a2332;
            font-size: 1.6em;
            margin-bottom: 4px;
            font-weight: 700;
        }
        .back-link {
            text-align: center;
            margin-bottom: 28px;
        }
        .back-link a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85em;
            transition: color 0.2s;
        }
        .back-link a:hover { color: #4A90D9; }
        .login-box {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 32px 28px;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .login-box h2 {
            color: #1e293b;
            margin-bottom: 24px;
            text-align: center;
            font-size: 1.15em;
            font-weight: 600;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; margin-bottom: 6px;
            color: #475569; font-weight: 500; font-size: 0.88em;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95em;
            transition: all 0.25s;
            background: white;
            color: #1e293b;
        }
        .form-group input:focus {
            outline: none;
            border-color: #f093fb;
            box-shadow: 0 0 0 3px rgba(240,147,251,0.12);
        }
        .form-group input::placeholder { color: #94a3b8; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            margin-top: 8px;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(245,87,108,0.3);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
        .error-message {
            color: #ff4d4f; text-align: center; margin-top: 12px;
            font-size: 0.85em; display: none;
        }
        .register-link {
            text-align: center; margin-top: 16px; padding-top: 14px;
            border-top: 1px solid #e9ecef;
        }
        .register-link a {
            color: #4A90D9; text-decoration: none; font-size: 0.9em;
            font-weight: 500; transition: color 0.2s;
        }
        .register-link a:hover { color: #357ABD; }
        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 14px 24px; border-radius: 12px; color: white;
            font-size: 0.95em; z-index: 9999;
            opacity: 0; transition: opacity 0.3s, transform 0.3s;
            transform: translateY(-8px);
            backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-error { background: rgba(255,77,79,0.9); }
        .toast-success { background: rgba(82,196,26,0.9); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍🏫 教师登录</h1>
        <div class="back-link"><a href="login.html">← 返回首页</a></div>
        <div class="login-box">
            <h2>教师身份验证</h2>
            <form id="teacherLoginForm">
                <div class="form-group">
                    <label>教师ID / 用户名</label>
                    <input type="text" id="teacherId" placeholder="请输入教师ID或用户名" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="teacherPassword" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn">进入教师系统</button>
                <div class="error-message" id="teacherError"></div>
            </form>
            <div class="register-link">
                <a href="register.html">📝 还没有账号？立即注册</a>
            </div>
        </div>
        <div style="text-align:center;margin-top:16px;font-size:0.82em;color:#94a3b8;">
            ⚡ 测试账号: 001 / 123
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = 'http://localhost:5000/api';
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        document.getElementById('teacherLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const teacherId = document.getElementById('teacherId').value;
            const teacherPassword = document.getElementById('teacherPassword').value;
            const errorDiv = document.getElementById('teacherError');
            errorDiv.style.display = 'none';
            try {
                const response = await fetch(`${API}/teacher/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: teacherId, password: teacherPassword })
                });
                const data = await response.json();
                if (response.ok) {
                    showToast('登录成功，正在跳转...', 'success');
                    setTimeout(() => { window.location.href = 'teacher.html'; }, 500);
                } else {
                    errorDiv.textContent = data.error || '登录失败';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = '网络错误，请检查后端是否运行';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
