<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理 - AI智能考试系统</title>
    <style>
        :root {
            --bg-root: #faf9f7;
            --bg-card: #ffffff;
            --bg-hover: #f5f3f0;
            --bg-input: #ffffff;
            --border-default: #e8e5e0;
            --border-hover: #d4cfc8;
            --text-primary: #1a1816;
            --text-secondary: #6b6560;
            --text-tertiary: #9e9892;
            --accent: #1a1816;
            --accent-dim: rgba(26,24,22,0.06);
            --success: #4a8c5c;
            --success-dim: rgba(74,140,92,0.08);
            --warning: #c4904a;
            --warning-dim: rgba(196,144,74,0.08);
            --error: #c45a5a;
            --error-dim: rgba(196,90,90,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-root);
            min-height: 100vh;
        }

        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-default);
            color: var(--text-primary);
            padding: 16px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 1.2em; font-weight: 600; letter-spacing: -0.2px; }
        .header .user-info { font-size: 0.88em; color: var(--text-secondary); margin-right: 14px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .header button {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            color: var(--text-primary);
            padding: 7px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.88em;
            transition: all 0.15s;
        }
        .header button:hover { border-color: var(--border-hover); color: var(--text-primary); }

        .container { max-width: 1160px; margin: 24px auto; padding: 0 18px; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 18px;
            border: 1px solid var(--border-default);
        }
        .card h2 {
            color: var(--text-primary);
            margin-bottom: 16px;
            font-size: 1.1em;
            font-weight: 600;
            border-bottom: 1px solid var(--border-default);
            padding-bottom: 10px;
        }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.88em;
            font-weight: 500;
            transition: all 0.15s;
        }
        .btn-primary { background: var(--accent-dim); color: var(--text-primary); border: 1px solid var(--border-default); }
        .btn-success { background: var(--success-dim); color: var(--success); border: 1px solid var(--border-default); }
        .btn-danger { background: var(--error-dim); color: var(--error); border: 1px solid var(--border-default); }
        .btn:hover:not(:disabled) { opacity: 0.85; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

        .file-upload { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .file-upload label { font-size: 0.88em; color: var(--text-secondary); font-weight: 500; }
        .file-upload input[type="file"] {
            padding: 7px 10px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 0.88em;
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .file-upload input[type="file"]::file-selector-button {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            background: var(--accent-dim);
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .file-upload input[type="file"]::file-selector-button:hover {
            background: var(--bg-hover);
        }

        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
        td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        th { background: var(--bg-hover); font-weight: 600; color: var(--text-secondary); font-size: 0.84em; }
        td { font-size: 0.88em; color: var(--text-primary); }
        tr:hover td { background: var(--bg-hover); }

        .toast { position: fixed; top: 20px; right: 20px; padding: 14px 24px; border-radius: var(--radius-sm); color: white; font-size: 0.95em; z-index: 9999; opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(-8px); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--error); }

        .pagination { display: flex; justify-content: center; gap: 4px; margin-top: 16px; flex-wrap: wrap; }
        .pagination button { padding: 5px 12px; border: 1px solid var(--border-default); border-radius: 4px; background: var(--bg-card); color: var(--text-secondary); cursor: pointer; font-size: 0.85em; transition: all 0.1s; }
        .pagination button:hover { background: var(--bg-hover); }
        .pagination button.active { background: var(--accent); color: var(--bg-card); border-color: var(--accent); }
        .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }

        .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
        .toolbar input[type="text"] {
            padding: 8px 14px;
            border: 1.5px solid var(--border-default);
            border-radius: 8px;
            font-size: 0.9em;
            flex: 1;
            min-width: 180px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: inherit;
        }
        .toolbar input[type="text"]:focus { outline: none; border-color: var(--accent); }
        .toolbar select {
            padding: 7px 8px;
            border: 1px solid var(--border-default);
            border-radius: 6px;
            font-size: 0.85em;
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .inline-form {
            display: none;
            background: var(--bg-hover);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 14px;
        }
        .inline-form.show { display: block; }
        .inline-form .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .inline-form .form-row input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border-default);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9em;
            background: var(--bg-input);
            color: var(--text-primary);
            min-width: 120px;
        }
        .inline-form .form-row input:focus { outline: none; border-color: var(--accent); }
        .inline-form .form-actions { display: flex; gap: 10px; justify-content: flex-end; }

        .import-section {
            display: none;
            background: var(--bg-hover);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            margin-bottom: 14px;
        }
        .import-section.show { display: block; }

        @media (max-width: 640px) {
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar input[type="text"] { min-width: auto; }
            .inline-form .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>学生管理</h1>
        <div class="header-right">
            <span class="user-info" id="teacherInfo">教师</span>
            <button onclick="window.location.href='teacher.html'">返回教师管理</button>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>学生列表</h2>

            <!-- Toolbar -->
            <div class="toolbar">
                <input type="text" id="studentSearch" placeholder="搜索学号/姓名/班级..." oninput="filterStudents()">
                <button class="btn btn-success" onclick="toggleAddStudentForm()">添加学生</button>
                <button class="btn btn-primary" onclick="toggleImportForm()">批量导入</button>
                <button class="btn btn-primary" onclick="window.open('/api/template/student/download')">下载模板</button>
                <select id="perPageSelect" onchange="loadStudents()">
                    <option value="25">25条/页</option>
                    <option value="50">50条/页</option>
                </select>
            </div>

            <!-- Inline Add Student Form -->
            <div class="inline-form" id="addStudentForm">
                <div class="form-row">
                    <input type="text" id="addSid" placeholder="学号 *">
                    <input type="text" id="addSname" placeholder="姓名 *">
                    <input type="text" id="addSclass" placeholder="班级">
                </div>
                <div class="form-row">
                    <input type="text" id="addSmajor" placeholder="专业">
                    <input type="text" id="addSgrade" placeholder="年级">
                    <input type="text" id="addSschool" placeholder="学校">
                </div>
                <div class="form-actions">
                    <button class="btn" onclick="toggleAddStudentForm()" style="padding:8px 20px;border:1px solid var(--border-default);border-radius:6px;background:var(--bg-card);color:var(--text-secondary);cursor:pointer;font-size:0.9em;">取消</button>
                    <button class="btn" onclick="doAddStudent()" style="padding:8px 24px;border:none;border-radius:6px;background:var(--text-primary);color:var(--bg-card);cursor:pointer;font-size:0.9em;font-weight:500;">确认添加</button>
                </div>
            </div>

            <!-- Import Section -->
            <div class="import-section" id="importSection">
                <div class="file-upload">
                    <label>选择学生信息Excel文件：</label>
                    <input type="file" id="studentImportFile" accept=".xlsx">
                    <button class="btn btn-success" onclick="uploadStudentTemplate()">上传导入</button>
                </div>
                <div style="margin-top:8px;font-size:0.82em;color:var(--text-tertiary);">
                    文件格式：第一行表头（学号、姓名、班级、专业、年级、学校），从第二行开始数据。
                </div>
            </div>

            <!-- Student Table -->
            <table>
                <thead>
                    <tr>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>班级</th>
                        <th>专业</th>
                        <th>年级</th>
                        <th>学校</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <tr><td colspan="7" style="text-align:center;color:var(--text-secondary);">加载中...</td></tr>
                </tbody>
            </table>

            <!-- Pagination -->
            <div class="pagination" id="pagination"></div>
            <div style="margin-top:10px;font-size:0.82em;color:var(--text-tertiary);text-align:center;" id="pageInfo"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API = '/api';
        let currentPage = 1;
        let perPage = 25;
        let totalStudents = 0;
        let searchTerm = '';

        // ─── Toast ───
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + (type === 'error' ? 'toast-error' : 'toast-success');
            setTimeout(() => t.classList.remove('show'), 2800);
        }

        // ─── Auth Check ───
        async function checkLogin() {
            try {
                const res = await fetch(`${API}/teacher/profile`);
                if (!res.ok) { window.location.href = 'teacher-login.html'; return; }
                const data = await res.json();
                document.getElementById('teacherInfo').textContent = data.username || data.id || '教师';
            } catch (e) { window.location.href = 'teacher-login.html'; }
        }

        // ─── Load Students ───
        async function loadStudents() {
            perPage = parseInt(document.getElementById('perPageSelect').value) || 25;
            const params = new URLSearchParams({ page: currentPage, per_page: perPage });
            if (searchTerm) params.set('search', searchTerm);

            try {
                const res = await fetch(`${API}/teacher/students/paged?${params}`);
                const data = await res.json();
                totalStudents = data.total;
                renderStudentTable(data.items);
                renderPagination();
                document.getElementById('pageInfo').textContent = `共 ${totalStudents} 名学生，第 ${data.page}/${Math.ceil(totalStudents / perPage) || 1} 页`;
            } catch (e) {
                document.getElementById('studentTableBody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--error);">加载失败</td></tr>';
            }
        }

        function renderStudentTable(list) {
            const tbody = document.getElementById('studentTableBody');
            if (!list.length) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-secondary);">暂无学生，请上传学生信息或手动添加</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(s => `
                <tr>
                    <td>${s.student_id}</td>
                    <td>${s.name}</td>
                    <td>${s.class_name || '-'}</td>
                    <td>${s.major || '-'}</td>
                    <td>${s.grade || '-'}</td>
                    <td>${s.school || '-'}</td>
                    <td><button class="btn btn-danger" style="padding:4px 10px;font-size:0.8em;" onclick="deleteStudent('${s.student_id}', '${s.name.replace(/'/g, "\\'")}')">删除</button></td>
                </tr>
            `).join('');
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            const totalPages = Math.ceil(totalStudents / perPage);
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = `<button ${currentPage <= 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">‹</button>`;
            for (let p = 1; p <= totalPages; p++) {
                if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 2) {
                    html += `<button class="${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`;
                } else if (Math.abs(p - currentPage) === 3) {
                    html += '<button disabled>...</button>';
                }
            }
            html += `<button ${currentPage >= totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">›</button>`;
            container.innerHTML = html;
        }

        function goPage(page) {
            currentPage = page;
            loadStudents();
        }

        function filterStudents() {
            searchTerm = document.getElementById('studentSearch').value.trim();
            currentPage = 1;
            loadStudents();
        }

        // ─── Add Student Form ───
        function toggleAddStudentForm() {
            const form = document.getElementById('addStudentForm');
            form.classList.toggle('show');
            if (form.classList.contains('show')) {
                document.getElementById('addSid').value = '';
                document.getElementById('addSname').value = '';
                document.getElementById('addSclass').value = '';
                document.getElementById('addSmajor').value = '';
                document.getElementById('addSgrade').value = '';
                document.getElementById('addSschool').value = '';
                document.getElementById('addSid').focus();
            }
        }

        async function doAddStudent() {
            const sid = document.getElementById('addSid').value.trim();
            const name = document.getElementById('addSname').value.trim();
            if (!sid || !name) { showToast('学号和姓名为必填项', 'error'); return; }
            try {
                const res = await fetch(`${API}/teacher/student`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: sid, name: name,
                        class_name: document.getElementById('addSclass').value.trim(),
                        major: document.getElementById('addSmajor').value.trim(),
                        grade: document.getElementById('addSgrade').value.trim(),
                        school: document.getElementById('addSschool').value.trim()
                    })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast('学生添加成功');
                    toggleAddStudentForm();
                    loadStudents();
                } else {
                    showToast(data.error || '添加失败', 'error');
                }
            } catch (e) { showToast('网络错误', 'error'); }
        }

        // ─── Delete Student ───
        async function deleteStudent(sid, name) {
            if (!confirm(`确定要删除学生 "${name}" (${sid}) 吗？\n注意：历史考试记录将保留。`)) return;
            try {
                const res = await fetch(`${API}/teacher/student/${encodeURIComponent(sid)}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.ok) {
                    showToast('学生已删除');
                    loadStudents();
                } else {
                    showToast(data.error || '删除失败', 'error');
                }
            } catch (e) { showToast('网络错误', 'error'); }
        }

        // ─── Import ───
        function toggleImportForm() {
            const section = document.getElementById('importSection');
            section.classList.toggle('show');
        }

        async function uploadStudentTemplate() {
            const file = document.getElementById('studentImportFile').files[0];
            if (!file) { showToast('请选择文件', 'error'); return; }
            const fd = new FormData();
            fd.append('file', file);
            try {
                const res = await fetch(`${API}/template/student/upload`, { method: 'POST', body: fd });
                const data = await res.json();
                if (data.ok) {
                    showToast(`成功导入 ${data.count} 名学生`);
                    document.getElementById('studentImportFile').value = '';
                    toggleImportForm();
                    loadStudents();
                } else {
                    showToast(data.error || '上传失败', 'error');
                }
            } catch (e) { showToast('网络错误', 'error'); }
        }

        // ─── Init ───
        checkLogin();
        loadStudents();
    </script>
</body>
</html>
