<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅卷 - AI智能考试系统</title>
    <style>
        :root {
            --bg-root: #faf9f7;
            --bg-card: #ffffff;
            --bg-hover: #f5f3f0;
            --bg-input: #ffffff;
            --border-default: #e8e5e0;
            --border-hover: #d4cfc8;
            --text-primary: #1a1816;
            --text-secondary: #6b6560;
            --text-tertiary: #9e9892;
            --accent: #1a1816;
            --accent-dim: rgba(26,24,22,0.06);
            --success: #4a8c5c;
            --success-dim: rgba(74,140,92,0.08);
            --warning: #c4904a;
            --warning-dim: rgba(196,144,74,0.08);
            --error: #c45a5a;
            --error-dim: rgba(196,90,90,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-root);
            min-height: 100vh;
        }
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-default);
            color: var(--text-primary);
            padding: 16px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .header h1 { font-size: 1.2em; font-weight: 600; }
        .header button {
            background: var(--bg-card); border: 1px solid var(--border-default);
            color: var(--text-primary); padding: 7px 16px; border-radius: var(--radius-sm); cursor: pointer;
            font-size: 0.88em; transition: all 0.15s;
        }
        .header button:hover { background: var(--bg-hover); border-color: var(--border-hover); color: var(--accent); }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 18px; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 18px;
            border: 1px solid var(--border-default);
        }
        .card h2 {
            color: var(--text-primary); margin-bottom: 16px; font-size: 1.1em; font-weight: 600;
            border-bottom: 1px solid var(--border-default); padding-bottom: 10px;
        }

        .btn {
            padding: 9px 18px; border: none; border-radius: var(--radius-sm); cursor: pointer;
            font-size: 0.88em; font-weight: 500;
            transition: all 0.15s;
        }
        .btn-primary { background: var(--accent); color: var(--bg-card); }
        .btn-success { background: var(--success); color: var(--bg-card); }
        .btn-info { background: var(--accent); color: var(--bg-card); }
        .btn-warning { background: var(--warning); color: var(--bg-card); }
        .btn:hover:not(:disabled) { opacity: 0.9; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border-default); }
        th { background: var(--bg-hover); font-weight: 600; color: var(--text-secondary); font-size: 0.84em; }
        td { font-size: 0.88em; color: var(--text-primary); }
        tr:hover td { background: var(--bg-hover); cursor: pointer; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.78em; font-weight: 500; }
        .badge-done { background: var(--success-dim); color: var(--success); }
        .badge-progress { background: var(--warning-dim); color: var(--warning); }

        .grading-layout {
            display: none;
            gap: 20px;
        }
        .grading-layout.show { display: flex; }
        .grading-left { flex: 1; min-width: 0; }
        .grading-right {
            width: 280px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 20px;
            border: 1px solid var(--border-default);
            position: sticky;
            top: 90px;
            align-self: flex-start;
        }
        .grading-right h3 {
            color: var(--text-primary); font-size: 1em; font-weight: 600;
            padding-bottom: 10px; border-bottom: 1px solid var(--border-default);
            margin-bottom: 12px;
        }
        .score-summary { margin-bottom: 12px; }
        .score-summary .total {
            font-size: 1.3em; font-weight: 700; color: var(--accent);
            text-align: center; padding: 10px; margin-bottom: 10px;
        }
        .score-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid var(--border-default);
            font-size: 0.85em;
        }
        .score-item .q-label { color: var(--text-secondary); }
        .score-item .q-score { font-weight: 600; color: var(--text-primary); }
        .score-item .q-score input {
            width: 60px; padding: 4px 6px; border: 1px solid var(--border-default);
            border-radius: var(--radius-sm); font-size: 0.9em; text-align: right;
            background: var(--bg-input); color: var(--text-primary);
        }
        .score-item .q-score input:focus { outline: none; border-color: var(--accent); }
        .score-item .q-max { color: var(--text-tertiary); font-size: 0.85em; }
        .student-save-row { display: flex; gap: 8px; margin-top: 14px; justify-content: center; }

        .q-block {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border-default);
        }
        .q-block h4 { color: var(--text-primary); margin-bottom: 6px; font-size: 0.95em; }
        .q-block .q-type-label { font-size: 0.78em; color: var(--accent); font-weight: 500; }
        .q-block .q-content { font-size: 0.92em; line-height: 1.7; color: var(--text-primary); margin: 8px 0; }
        .q-block .q-meta { font-size: 0.84em; color: var(--text-secondary); }
        .q-block .q-meta .correct { color: var(--success); font-weight: 500; }
        .q-block .q-meta .wrong { color: var(--error); font-weight: 500; }
        .q-block .q-meta .pending { color: var(--warning); font-weight: 500; }

        .cover-page { display: block; }
        .cover-page.hidden { display: none; }

        .action-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0;
        }

        .toast { position: fixed; top: 20px; right: 20px; padding: 14px 24px; border-radius: var(--radius-sm); color: var(--bg-card); font-size: 0.95em; z-index: 9999; opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(-8px); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--error); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

        @media (max-width: 768px) {
            .grading-layout { flex-direction: column; }
            .grading-right { width: 100%; position: static; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>阅卷系统</h1>
        <div>
            <span id="examTitle" style="font-size:0.9em;opacity:0.9;margin-right:14px;"></span>
            <button onclick="window.location.href='teacher.html'">返回教师管理</button>
        </div>
    </div>

    <div class="container">
        <!-- Cover page: student list -->
        <div class="card cover-page" id="coverPage">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                <h2>学生列表</h2>
                <span id="studentCount" style="font-size:0.88em;color:var(--text-tertiary);"></span>
            </div>

            <div class="action-bar">
                <button class="btn btn-warning" onclick="openAutoGradeSetting()" id="autoGradeBtn">客观题自动阅卷: 已开启</button>
                <span style="flex:1;"></span>
                <button class="btn btn-info" onclick="exportStats()">统计所有学生得分</button>
                <button class="btn btn-primary" onclick="downloadAllPapers()">下载所有学生试卷</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>状态</th>
                        <th>总得分</th>
                        <th>已批改</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="studentList"></tbody>
            </table>
        </div>

        <!-- Grading layout: left questions + right scores -->
        <div class="grading-layout" id="gradingLayout">
            <div class="grading-left">
                <div id="gradingQuestions"></div>
            </div>
            <div class="grading-right" id="gradingRight">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <h3 style="border:none;padding:0;margin:0;">评分面板</h3>
                    <button class="btn btn-primary" style="padding:5px 10px;font-size:0.82em;" onclick="downloadStudentPaper()">下载</button>
                </div>
                <div id="studentInfo" style="font-size:0.85em;color:var(--text-secondary);margin-bottom:10px;"></div>
                <div class="score-summary">
                    <div class="total" id="totalScoreDisplay">-- / --</div>
                </div>
                <div id="scoreItems"></div>
                <div class="student-save-row">
                    <button class="btn btn-success" onclick="saveStudentGrades()" style="flex:1;">保存得分</button>
                    <button class="btn btn-warning" onclick="backToCover()">返回列表</button>
                </div>
            </div>
        </div>

        <!-- Auto-grade setting modal -->
        <div class="modal-overlay" id="autoGradeModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.35);z-index:1000;justify-content:center;align-items:center;">
            <div class="modal-box" style="background:var(--bg-card);border-radius:8px;padding:28px;max-width:380px;width:92%;border:1px solid var(--border-default);">
                <h2 style="margin-bottom:16px;color:var(--text-primary);font-size:1.1em;">客观题自动阅卷</h2>
                <p style="color:var(--text-secondary);font-size:0.9em;margin-bottom:16px;">开启后，选择题/判断题自动评分，教师可手动修改。</p>
                <div class="checkbox-group" style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
                    <input type="checkbox" id="autoGradeCheck" style="width:16px;height:16px;accent-color:var(--accent);">
                    <label for="autoGradeCheck" style="font-size:0.95em;cursor:pointer;color:var(--text-primary);">开启客观题自动阅卷</label>
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end;">
                    <button class="btn" style="background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border-default);" onclick="closeAutoGradeModal()">取消</button>
                    <button class="btn btn-primary" onclick="saveAutoGradeSetting()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';
        const EXAM_ID = new URLSearchParams(window.location.search).get('exam_id');
        let examData = null;  // full grading data {exam, sessions[]}
        let currentStudent = null;  // {session_id, student_id, student_name, ...}
        let autoGrade = true;  // default

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function checkLogin() {
            try {
                const res = await fetch(`${API}/teacher/check`);
                const data = await res.json();
                if (!data.logged_in) window.location.href = 'login.html';
            } catch (e) { window.location.href = 'login.html'; }
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function loadData() {
            try {
                const res = await fetch(`${API}/teacher/exam/${EXAM_ID}/grading-sessions`);
                examData = await res.json();

                // Get exam title
                document.getElementById('examTitle').textContent = examData.exam ? examData.exam.title : '';
                document.getElementById('studentCount').textContent = `共 ${examData.sessions.length} 名学生`;

                // Get auto_grade setting
                try {
                    const ag = await fetch(`${API}/teacher/exam/${EXAM_ID}/auto-grade`);
                    const agData = await ag.json();
                    autoGrade = agData.auto_grade;
                } catch(e) {}
                updateAutoGradeButton();

                // Check auto_grade from submissions themselves
                // If auto_grade is on, we auto-grade objective questions that are not yet graded
                if (autoGrade) {
                    await autoGradeObjectiveQuestions();
                }

                renderStudentList();
                backToCover();
            } catch (e) {
                showToast('加载失败', 'error');
            }
        }

        function updateAutoGradeButton() {
            const btn = document.getElementById('autoGradeBtn');
            btn.textContent = autoGrade ? '客观题自动阅卷: 已开启' : '客观题自动阅卷: 已关闭';
        }

        function openAutoGradeSetting() {
            document.getElementById('autoGradeCheck').checked = autoGrade;
            document.getElementById('autoGradeModal').style.display = 'flex';
        }

        function closeAutoGradeModal() {
            document.getElementById('autoGradeModal').style.display = 'none';
        }

        async function saveAutoGradeSetting() {
            const val = document.getElementById('autoGradeCheck').checked ? 1 : 0;
            try {
                await fetch(`${API}/teacher/exam/${EXAM_ID}/auto-grade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ auto_grade: val })
                });
                autoGrade = !!val;
                updateAutoGradeButton();
                closeAutoGradeModal();
                showToast('自动阅卷设置已更新');
            } catch (e) {
                showToast('保存失败', 'error');
            }
        }

        async function autoGradeObjectiveQuestions() {
            // For each session, update objective question scores
            for (const s of examData.sessions) {
                for (const q of s.questions) {
                    const isObjective = ['单选题', '选择题', '判断题'].includes(q.q_type);
                    if (!isObjective) continue;
                    if (q.actual_score != null && q.actual_score > 0) continue;  // already graded

                    // v4.5: Parse answer_text to extract real answer (ignore stata fields)
                    const parsed = parseAnswerText(q.answer_text);
                    const ans = (parsed.text || '').trim().toUpperCase();
                    const correct = (q.correct_answer || '').trim().toUpperCase();
                    let score = 0;
                    if (q.q_type === '多选题') {
                        const ansSet = new Set(ans.split('').filter(c => c >= 'A' && c <= 'D'));
                        const correctSet = new Set(correct.split('').filter(c => c >= 'A' && c <= 'D'));
                        if (ansSet.size === correctSet.size && [...ansSet].every(c => correctSet.has(c))) {
                            score = q.score;
                        }
                    } else {
                        if (ans === correct) score = q.score;
                    }
                    q.actual_score = score;
                }
            }
        }

        function renderStudentList() {
            const tbody = document.getElementById('studentList');
            tbody.innerHTML = examData.sessions.map(s => {
                const gradedTotal = s.questions.reduce((sum, q) => sum + (q.actual_score || 0), 0);
                const status = s.status === 'submitted' ? '<span class="badge badge-done">已交卷</span>' : '<span class="badge badge-progress">考试中</span>';
                const graded = s.questions.some(q => q.actual_score != null && q.actual_score > 0) ? '<span class="badge badge-done">已批改</span>' : '<span class="badge badge-progress">待批改</span>';
                return `<tr onclick="openStudent(${s.session_id})">
                    <td style="font-weight:600;color:var(--accent);">${s.student_id}</td>
                    <td>${s.student_name}</td>
                    <td>${status}</td>
                    <td style="font-weight:600;">${gradedTotal}</td>
                    <td>${graded}</td>
                    <td><button class="btn btn-primary" style="padding:5px 10px;font-size:0.82em;" onclick="event.stopPropagation();openStudent(${s.session_id})">阅卷</button></td>
                </tr>`;
            }).join('');
            if (!examData.sessions.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-tertiary);">暂无学生提交试卷</td></tr>';
            }
        }

        function openStudent(sessionId) {
            const session = examData.sessions.find(s => s.session_id === sessionId);
            if (!session) { showToast('未找到该学生', 'error'); return; }
            currentStudent = session;

            // Show grading layout, hide cover
            document.getElementById('coverPage').classList.add('hidden');
            document.getElementById('gradingLayout').classList.add('show');

            // Student info
            document.getElementById('studentInfo').textContent = `${session.student_name} (${session.student_id})`;

            // Render questions
            renderQuestions(session);
            renderScoreItems(session);
            updateTotalScore(session);
        }

        // Helper: parse answer_text JSON to extract fields
        function parseAnswerText(raw) {
            if (!raw) return { text: '', stata_code: '', stata_output: '', python_code: '', python_output: '' };
            try {
                const parsed = JSON.parse(raw);
                if (typeof parsed === 'object' && parsed !== null) {
                    return {
                        text: parsed.choice || parsed.text || '',
                        stata_code: parsed.stata_code || '',
                        stata_output: parsed.stata_output || '',
                        python_code: parsed.python_code || '',
                        python_output: parsed.python_output || ''
                    };
                }
            } catch(e) {}
            return { text: raw, stata_code: '', stata_output: '', python_code: '', python_output: '' };
        }

        function renderQuestions(session) {
            const container = document.getElementById('gradingQuestions');

            // v4.5: Build per-type question numbering (same as exam.html nav logic)
            const types = ['单选题', '多选题', '判断题', '简答题', '综合题'];
            const typeCounters = {};
            types.forEach(t => typeCounters[t] = 0);
            const typeHeadings = {};
            const questionNumbers = [];
            session.questions.forEach(q => {
                typeCounters[q.q_type] = (typeCounters[q.q_type] || 0) + 1;
                questionNumbers.push(typeCounters[q.q_type]);
            });

            container.innerHTML = session.questions.map((q, i) => {
                const qNum = questionNumbers[i];
                const isObjective = ['单选题', '选择题', '判断题'].includes(q.q_type);
                const statusClass = q.actual_score > 0 ? 'correct' : (q.is_correct === 0 ? 'wrong' : 'pending');
                const statusText = q.actual_score > 0 ? '正确' : (q.is_correct === 0 ? '错误' : '待批改');

                // v4.2: Parse answer JSON for stata fields
                const parsedAns = parseAnswerText(q.answer_text);
                const displayAnswer = parsedAns.text || '(未作答)';

                let html = `<div class="q-block">
                    <h4>${q.q_type}第 ${qNum} 题 <span class="q-type-label">(${q.score} 分)</span></h4>
                    <div class="q-content">${q.content}</div>`;

                if (q.option_a) {
                    html += `<div class="q-meta">A: ${q.option_a} &nbsp; B: ${q.option_b} &nbsp; C: ${q.option_c} &nbsp; D: ${q.option_d}</div>`;
                }

                html += `<div class="q-meta">正确答案: <b class="correct">${q.correct_answer || '无'}</b></div>`;
                html += `<div class="q-meta">学生答案: <b class="${statusClass}">${escapeHtml(displayAnswer)}</b> &nbsp; ${isObjective ? statusText : '主观题(需手动评分)'}</div>`;

                // v4.2: Show Stata results if present
                if (parsedAns.stata_code) {
                    html += `<div style="margin-top:8px;padding:10px;background:var(--bg-hover);border-radius:8px;border:1px solid var(--border-default);">
                        <div style="font-weight:600;color:var(--text-primary);font-size:0.85em;margin-bottom:4px;">Stata 代码:</div>
                        <pre style="font-family:Consolas,monospace;font-size:0.82em;color:var(--text-primary);margin:0;white-space:pre-wrap;background:var(--bg-hover);padding:8px;border-radius:6px;">${escapeHtml(parsedAns.stata_code)}</pre>`;
                    if (parsedAns.stata_output) {
                        html += `<div style="font-weight:600;color:var(--text-primary);font-size:0.85em;margin:6px 0 4px;">Stata 输出:</div>
                        <pre style="font-family:Consolas,monospace;font-size:0.82em;color:var(--text-primary);margin:0;white-space:pre-wrap;background:var(--bg-hover);padding:8px;border-radius:6px;border:1px solid var(--border-default);">${escapeHtml(parsedAns.stata_output)}</pre>`;
                    }
                    html += `</div>`;
                }

                // v5.2: Show Python results if present
                if (parsedAns.python_code) {
                    html += `<div style="margin-top:8px;padding:10px;background:var(--bg-hover);border-radius:8px;border:1px solid var(--border-default);">
                        <div style="font-weight:600;color:var(--text-primary);font-size:0.85em;margin-bottom:4px;">Python 代码:</div>
                        <pre style="font-family:Consolas,monospace;font-size:0.82em;color:var(--text-primary);margin:0;white-space:pre-wrap;background:var(--bg-hover);padding:8px;border-radius:6px;">${escapeHtml(parsedAns.python_code)}</pre>`;
                    if (parsedAns.python_output) {
                        html += `<div style="font-weight:600;color:var(--text-primary);font-size:0.85em;margin:6px 0 4px;">Python 输出:</div>
                        <pre style="font-family:Consolas,monospace;font-size:0.82em;color:var(--text-primary);margin:0;white-space:pre-wrap;background:var(--bg-hover);padding:8px;border-radius:6px;border:1px solid var(--border-default);">${escapeHtml(parsedAns.python_output)}</pre>`;
                    }
                    html += `</div>`;
                }

                // For non-objective questions, show input inline
                if (!isObjective) {
                    html += `<div class="q-meta" style="margin-top:6px;">
                        得分: <input type="number" class="score-input-${q.q_id}" value="${q.actual_score || 0}" min="0" max="${q.score}" step="0.5" style="width:60px;padding:3px 6px;border:1px solid var(--border-default);border-radius:6px;" onchange="updateScore(${q.q_id}, this.value)">
                        / ${q.score} 分
                    </div>`;
                }

                html += '</div>';
                return html;
            }).join('');
        }

        function renderScoreItems(session) {
            const container = document.getElementById('scoreItems');
            let total = 0;
            let maxTotal = 0;

            // v4.5: Build per-type numbering
            const typeCounters = {};
            const questionNumbers = [];
            session.questions.forEach(q => {
                typeCounters[q.q_type] = (typeCounters[q.q_type] || 0) + 1;
                questionNumbers.push(typeCounters[q.q_type]);
            });

            container.innerHTML = session.questions.map((q, i) => {
                const qNum = questionNumbers[i];
                const isObjective = ['单选题', '选择题', '判断题'].includes(q.q_type);
                const score = q.actual_score || 0;
                total += score;
                maxTotal += q.score;

                if (isObjective) {
                    // v5.0: Editable score for objective questions (teacher override)
                    return `<div class="score-item">
                        <span class="q-label">${q.q_type}第${qNum}题</span>
                        <span class="q-score">
                            <input type="number" id="right_score_${q.q_id}" value="${score}" min="0" max="${q.score}" step="0.5" onchange="updateScore(${q.q_id}, this.value)"><span class="q-max">/${q.score}</span>
                        </span>
                    </div>`;
                } else {
                    // Editable for subjective
                    return `<div class="score-item">
                        <span class="q-label">${q.q_type}第${qNum}题</span>
                        <span class="q-score">
                            <input type="number" id="right_score_${q.q_id}" value="${q.actual_score || 0}" min="0" max="${q.score}" step="0.5" onchange="updateScore(${q.q_id}, this.value)"><span class="q-max">/${q.score}</span>
                        </span>
                    </div>`;
                }
            }).join('');

            document.getElementById('totalScoreDisplay').textContent = `${total} / ${maxTotal}`;
        }

        function updateScore(qId, value) {
            if (!currentStudent) return;
            const q = currentStudent.questions.find(q => q.q_id === qId);
            if (q) {
                q.actual_score = parseFloat(value) || 0;
                renderScoreItems(currentStudent);
                updateTotalScore(currentStudent);
            }
        }

        function updateTotalScore(session) {
            const total = session.questions.reduce((sum, q) => sum + (q.actual_score || 0), 0);
            const maxTotal = session.questions.reduce((sum, q) => sum + (q.score || 0), 0);
            document.getElementById('totalScoreDisplay').textContent = `${total} / ${maxTotal}`;
        }

        async function saveStudentGrades() {
            if (!currentStudent) return;

            const grades = {};
            currentStudent.questions.forEach(q => {
                const val = q.actual_score;
                if (val != null) grades[q.q_id] = val;
            });

            try {
                const res = await fetch(`${API}/teacher/session/${currentStudent.session_id}/grade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ grades })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast(`评分已保存，总分: ${data.total_score}`);
                    // Update the session total_score in data
                    currentStudent.total_score = data.total_score;
                    renderStudentList();
                } else {
                    showToast('保存失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        async function downloadStudentPaper() {
            if (!currentStudent) return;
            window.open(`${API}/teacher/session/${currentStudent.session_id}/download/xlsx`, '_blank');
        }

        function backToCover() {
            currentStudent = null;
            document.getElementById('coverPage').classList.remove('hidden');
            document.getElementById('gradingLayout').classList.remove('show');
        }

        function exportStats() {
            window.open(`${API}/teacher/exam/${EXAM_ID}/stats/xlsx`, '_blank');
        }

        async function downloadAllPapers() {
            try {
                const res = await fetch(`${API}/teacher/exam/${EXAM_ID}/download-all`);
                if (!res.ok) {
                    const err = await res.json();
                    showToast(err.error || '下载失败', 'error');
                    return;
                }
                // Trigger download
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `试卷_${EXAM_ID}_所有学生试卷.zip`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('下载已开始');
            } catch (e) {
                showToast('下载失败', 'error');
            }
        }

        checkLogin();
        loadData();
    </script>
</body>
</html>
