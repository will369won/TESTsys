<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试监视 - AI智能考试系统</title>
    <style>
        :root {
            --bg-root: #faf9f7;
            --bg-card: #ffffff;
            --bg-hover: #f5f3f0;
            --bg-input: #ffffff;
            --border-default: #e8e5e0;
            --border-hover: #d4cfc8;
            --text-primary: #1a1816;
            --text-secondary: #6b6560;
            --text-tertiary: #9e9892;
            --accent: #1a1816;
            --accent-dim: rgba(26,24,22,0.06);
            --success: #4a8c5c;
            --success-dim: rgba(74,140,92,0.08);
            --warning: #c4904a;
            --warning-dim: rgba(196,144,74,0.08);
            --error: #c45a5a;
            --error-dim: rgba(196,90,90,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--bg-root); min-height: 100vh; }
        .header { background: var(--bg-card); border-bottom: 1px solid var(--border-default); color: var(--text-primary); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 1.2em; font-weight: 600; }
        .header .nav-btns { display: flex; gap: 10px; }
        .header .nav-btns button { background: var(--bg-card); border: 1px solid var(--border-default); color: var(--text-primary); padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.9em; transition: all 0.15s; }
        .header .nav-btns button:hover { border-color: var(--border-hover); color: var(--text-primary); }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 16px 24px; border: 1px solid var(--border-default); flex: 1; min-width: 150px; text-align: center; }
        .stat-card .num { font-size: 1.8em; font-weight: bold; }
        .stat-card .label { font-size: 0.85em; color: var(--text-secondary); margin-top: 4px; font-weight: 500; }
        .stat-total .num { color: var(--text-primary); }
        .stat-progress .num { color: var(--success); }
        .stat-terminated .num { color: var(--error); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
        .student-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 20px; border: 1px solid var(--border-default); cursor: pointer; transition: all 0.15s; position: relative; }
        .student-card:hover { border-color: var(--border-hover); }
        .student-card.status-progress { border-color: var(--success-dim); }
        .student-card.status-terminated, .student-card.status-submitted { border-color: var(--error-dim); }
        .student-card.status-banned { border-color: var(--warning-dim); }
        .student-card .student-id { font-size: 1.05em; font-weight: bold; color: var(--text-primary); margin-bottom: 6px; }
        .student-card .student-name { font-size: 0.88em; color: var(--text-secondary); margin-bottom: 8px; }
        .student-card .exam-title { font-size: 0.78em; color: var(--text-tertiary); margin-bottom: 4px; }
        .student-card .start-time { font-size: 0.78em; color: var(--text-tertiary); }
        .student-card .status-badge { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 12px; font-size: 0.75em; font-weight: 600; }
        .student-card.status-progress .status-badge { background: var(--success-dim); color: var(--success); }
        .student-card.status-terminated .status-badge, .student-card.status-submitted .status-badge { background: var(--error-dim); color: var(--error); }
        .status-badge.banned { background: var(--warning-dim); color: var(--warning); }
        .status-badge.pending { background: var(--accent-dim); color: var(--text-secondary); }
        .student-card.status-banned .status-badge { background: var(--warning-dim); color: var(--warning); }
        .student-card.status-pending .status-badge { background: var(--accent-dim); color: var(--text-tertiary); }
        .empty-msg { text-align: center; color: var(--text-secondary); padding: 60px 20px; font-size: 1.05em; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: var(--bg-card); border-radius: var(--radius-md); padding: 30px; max-width: 400px; width: 90%; text-align: center; border: 1px solid var(--border-default); }
        .modal-box h2 { margin-bottom: 16px; color: var(--text-primary); }
        .modal-box p { color: var(--text-secondary); margin-bottom: 24px; }
        .modal-btns { display: flex; gap: 12px; justify-content: center; }
        .modal-btn { padding: 10px 24px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.95em; font-weight: 500; transition: all 0.15s; }
        .modal-btn:hover { opacity: 0.85; }
        .modal-cancel { background: var(--bg-hover); color: var(--text-primary); }
        .modal-danger { background: var(--error-dim); color: var(--error); border: 1px solid var(--border-default); }
        .modal-success { background: var(--success-dim); color: var(--success); border: 1px solid var(--border-default); }
        .modal-warning { background: var(--warning-dim); color: var(--warning); border: 1px solid var(--border-default); }
        .toast { position: fixed; top: 20px; right: 20px; padding: 14px 24px; border-radius: var(--radius-sm); color: white; font-size: 0.95em; z-index: 9999; opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(-8px); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--error); }
        .refresh-btn { background: var(--accent-dim); color: var(--text-primary); border: 1px solid var(--border-default); padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.9em; transition: all 0.15s; }
        .refresh-btn:hover { opacity: 0.85; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .toolbar span { color: var(--text-secondary); font-size: 0.9em; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="examTitle">考试监视面板</h1>
        <div class="nav-btns">
            <button onclick="window.location.href='teacher.html'">返回教师管理</button>
        </div>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat-card stat-total">
                <div class="num" id="totalCount">0</div>
                <div class="label">考生总数</div>
            </div>
            <div class="stat-card">
                <div class="num" id="pendingCount">0</div>
                <div class="label" style="color:var(--text-tertiary);">待进入</div>
            </div>
            <div class="stat-card stat-progress">
                <div class="num" id="progressCount">0</div>
                <div class="label">考试中</div>
            </div>
            <div class="stat-card stat-terminated">
                <div class="num" id="submittedCount">0</div>
                <div class="label">已提交</div>
            </div>
            <div class="stat-card">
                <div class="num" id="bannedCount" style="color:var(--warning);">0</div>
                <div class="label" style="color:var(--warning);">已禁止</div>
            </div>
        </div>

        <div class="toolbar">
            <span style="color: var(--text-secondary); font-size: 0.9em;">点击学生卡片可操作</span>
            <button class="refresh-btn" onclick="loadMonitor()">刷新</button>
        </div>

        <div class="grid" id="studentGrid">
            <div class="empty-msg">加载中...</div>
        </div>
    </div>

    <!-- 操作确认弹窗 -->
    <div class="modal-overlay" id="actionModal">
        <div class="modal-box">
            <h2 id="actionTitle">确认操作</h2>
            <p id="actionMsg"></p>
            <div class="modal-btns">
                <button class="modal-btn modal-cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn modal-danger" id="actionConfirm">确认</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';
        let currentSessionId = null;
        let currentAction = null;
        let currentStudentId = null;
        let currentExamId = null;

        async function checkLogin() {
            try {
                const res = await fetch(`${API}/teacher/check`);
                const data = await res.json();
                if (!data.logged_in) window.location.href = 'login.html';
            } catch (e) { window.location.href = 'login.html'; }
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function loadMonitor() {
            const params = new URLSearchParams(window.location.search);
            const examId = params.get('exam_id');
            if (!examId) {
                document.getElementById('examTitle').textContent = '考试监视面板 — 请指定考试';
                document.getElementById('studentGrid').innerHTML = '<div class="empty-msg">请在URL中指定考试ID（?exam_id=xxx）</div>';
                return;
            }
            currentExamId = examId;

            try {
                const res = await fetch(`${API}/teacher/exam/${examId}/monitor`);
                if (!res.ok) {
                    throw new Error('请求失败');
                }
                const students = await res.json();

                // Update header
                if (students.length > 0) {
                    const examInfo = students[0];
                    document.getElementById('examTitle').textContent =
                        `考试监视 — ${examInfo.exam_title}（${examInfo.exam_number || '无编号'}）`;
                } else {
                    document.getElementById('examTitle').textContent = `考试监视（ID: ${examId}）`;
                }

                // Count stats
                const total = students.length;
                const pending = students.filter(s => s.status === 'pending').length;
                const progress = students.filter(s => s.status === 'in_progress').length;
                const submitted = students.filter(s => s.status === 'submitted').length;
                const banned = students.filter(s => s.status === 'banned').length;

                document.getElementById('totalCount').textContent = total;
                document.getElementById('pendingCount').textContent = pending;
                document.getElementById('progressCount').textContent = progress;
                document.getElementById('submittedCount').textContent = submitted;
                document.getElementById('bannedCount').textContent = banned;

                const grid = document.getElementById('studentGrid');
                if (students.length === 0) {
                    grid.innerHTML = '<div class="empty-msg">该场考试暂无考生名单</div>';
                    return;
                }

                grid.innerHTML = students.map(s => {
                    let cardClass = '';
                    let badgeText = '';
                    switch (s.status) {
                        case 'pending':
                            cardClass = 'status-pending';
                            badgeText = '待进入';
                            break;
                        case 'banned':
                            cardClass = 'status-banned';
                            badgeText = '已禁止';
                            break;
                        case 'in_progress':
                            cardClass = 'status-progress';
                            badgeText = '考试中';
                            break;
                        case 'submitted':
                            cardClass = 'status-submitted';
                            badgeText = '已提交';
                            break;
                        case 'terminated':
                            cardClass = 'status-terminated';
                            badgeText = '已终止';
                            break;
                        default:
                            cardClass = 'status-pending';
                            badgeText = s.status;
                    }
                    const timeInfo = s.start_time ? `开始: ${s.start_time}` : '';
                    const sid = String(s.student_id).replace(/'/g, "\\'");
                    const sname = String(s.student_name).replace(/'/g, "\\'");
                    return `<div class="student-card ${cardClass}"
                         onclick="showAction(${s.session_id || 'null'}, '${sid}', '${sname}', '${s.status}', ${examId})">
                        <span class="status-badge ${s.status}">${badgeText}</span>
                        <div class="student-id">${s.student_id}</div>
                        <div class="student-name">${s.student_name || '(未填写)'}</div>
                        <div class="exam-title">${s.exam_title}</div>
                        <div class="start-time">${timeInfo}</div>
                    </div>`;
                }).join('');
            } catch (e) {
                document.getElementById('studentGrid').innerHTML = '<div class="empty-msg">加载失败</div>';
            }
        }

        function showAction(sessionId, studentId, studentName, status, examId) {
            currentSessionId = sessionId;
            currentStudentId = studentId;
            currentExamId = examId;
            currentAction = status;

            const title = document.getElementById('actionTitle');
            const msg = document.getElementById('actionMsg');
            const confirm = document.getElementById('actionConfirm');

            if (status === 'banned') {
                title.textContent = '允许进入考试？';
                msg.textContent = `是否允许学生 ${studentName}（${studentId}）进入考试？该生因迟到限时被禁止。`;
                confirm.textContent = '允许进入';
                confirm.className = 'modal-btn modal-success';
                confirm.onclick = () => doAllowEntry();
            } else if (status === 'submitted' || status === 'terminated') {
                title.textContent = status === 'submitted' ? '重置考试？' : '恢复考试？';
                msg.textContent = status === 'submitted'
                    ? `是否重置学生 ${studentName}（${studentId}）的考试？重置后可重新进入，已填答案保留。`
                    : `是否同意学生 ${studentName}（${studentId}）继续考试？`;
                confirm.textContent = status === 'submitted' ? '重置考试' : '同意继续';
                confirm.className = status === 'submitted' ? 'modal-btn modal-warning' : 'modal-btn modal-success';
                confirm.onclick = () => doResetExam();
            } else if (status === 'in_progress') {
                title.textContent = '终止考试？';
                msg.textContent = `是否终止学生 ${studentName}（${studentId}）的考试？`;
                confirm.textContent = '终止考试';
                confirm.className = 'modal-btn modal-danger';
                confirm.onclick = () => doTerminate();
            } else {
                // pending — not clickable, but guard anyway
                return;
            }

            document.getElementById('actionModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('actionModal').classList.remove('show');
        }

        async function doAllowEntry() {
            closeModal();
            try {
                const res = await fetch(`${API}/teacher/exam/${currentExamId}/student/${encodeURIComponent(currentStudentId)}/allow-entry`, { method: 'POST' });
                const data = await res.json();
                if (data.ok) {
                    showToast(data.message);
                    loadMonitor();
                } else {
                    showToast(data.error || '操作失败', 'error');
                }
            } catch (e) { showToast('网络错误', 'error'); }
        }

        async function doResetExam() {
            closeModal();
            try {
                let url;
                if (currentAction === 'terminated') {
                    url = `${API}/teacher/session/${currentSessionId}/resume`;
                } else {
                    url = `${API}/teacher/exam/${currentExamId}/student/${encodeURIComponent(currentStudentId)}/reset`;
                }
                const res = await fetch(url, { method: 'POST' });
                const data = await res.json();
                if (data.ok) {
                    showToast(data.message);
                    loadMonitor();
                } else {
                    showToast(data.error || '操作失败', 'error');
                }
            } catch (e) { showToast('网络错误', 'error'); }
        }

        async function doTerminate() {
            closeModal();
            try {
                const res = await fetch(`${API}/teacher/session/${currentSessionId}/terminate`, { method: 'POST' });
                const data = await res.json();
                if (data.ok) {
                    showToast(data.message);
                    loadMonitor();
                } else {
                    showToast(data.error || '操作失败', 'error');
                }
            } catch (e) { showToast('网络错误', 'error'); }
        }

        // 自动刷新（每5秒）
        setInterval(loadMonitor, 5000);

        checkLogin();
        loadMonitor();
    </script>
</body>
</html>
