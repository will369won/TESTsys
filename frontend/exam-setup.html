<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试设置 - AI智能考试系统</title>
    <style>
        :root {
            --bg-root: #faf9f7;
            --bg-card: #ffffff;
            --bg-hover: #f5f3f0;
            --bg-input: #ffffff;
            --border-default: #e8e5e0;
            --border-hover: #d4cfc8;
            --text-primary: #1a1816;
            --text-secondary: #6b6560;
            --text-tertiary: #9e9892;
            --accent: #1a1816;
            --accent-dim: rgba(26,24,22,0.06);
            --success: #4a8c5c;
            --success-dim: rgba(74,140,92,0.08);
            --warning: #c4904a;
            --warning-dim: rgba(196,144,74,0.08);
            --error: #c45a5a;
            --error-dim: rgba(196,90,90,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-root);
            min-height: 100vh;
        }

        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-default);
            color: var(--text-primary);
            padding: 16px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 1.2em; font-weight: 600; }
        .header button {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            color: var(--text-primary);
            padding: 7px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.88em;
            transition: all 0.15s;
        }
        .header button:hover { border-color: var(--border-hover); color: var(--text-primary); }

        .container { max-width: 960px; margin: 24px auto; padding: 0 18px; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 18px;
            border: 1px solid var(--border-default);
        }
        .card h2 {
            color: var(--text-primary);
            margin-bottom: 16px;
            font-size: 1.1em;
            font-weight: 600;
            border-bottom: 1px solid var(--border-default);
            padding-bottom: 10px;
        }
        .card h3 {
            color: var(--text-secondary);
            margin: 20px 0 12px;
            font-size: 1em;
            font-weight: 600;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9em;
        }
        .form-group label .required { color: var(--error); }
        .form-group input[type="number"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 0.95em;
            transition: border-color 0.2s;
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .form-group input:focus { outline: none; border-color: var(--border-hover); }
        .form-group input::placeholder { color: var(--text-tertiary); }
        .form-group textarea {
            width: 100%;
            min-height: 120px;
            padding: 10px 14px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 0.95em;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s;
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .form-group textarea:focus { outline: none; border-color: var(--border-hover); }
        .form-group .hint { font-size: 0.82em; color: var(--text-tertiary); margin-top: 4px; }

        .inline-group { display: flex; align-items: center; gap: 8px; }
        .inline-group input[type="number"] { width: 100px; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
        .checkbox-group label { font-size: 0.92em; color: var(--text-secondary); cursor: pointer; }

        .q-table { width: 100%; border-collapse: collapse; }
        .q-table th, .q-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-default); font-size: 0.88em; }
        .q-table th { background: var(--bg-hover); font-weight: 600; color: var(--text-secondary); }
        .q-table td { color: var(--text-primary); }
        .q-table tr:hover td { background: var(--bg-hover); }
        .q-table .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .q-table .switch input { opacity: 0; width: 0; height: 0; }
        .q-table .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: var(--border-default); border-radius: 22px; transition: 0.2s; }
        .q-table .slider:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s; }
        .q-table .switch input:checked + .slider { background: var(--accent); }
        .q-table .switch input:checked + .slider:before { transform: translateX(18px); }

        .btn { padding: 9px 22px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.92em; font-weight: 500; transition: all 0.15s; }
        .btn-primary { background: var(--accent); color: var(--bg-root); }
        .btn-primary:hover:not(:disabled) { opacity: 0.85; }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-default); }
        .btn-secondary:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--border-hover); }
        .btn-success { background: var(--accent); color: var(--bg-root); }
        .btn-warning { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-default); }
        .btn-warning:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--border-hover); }
        .btn:hover:not(:disabled) { opacity: 0.85; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-group { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: var(--bg-card); border-radius: var(--radius-md); padding: 28px; max-width: 400px; width: 92%; border: 1px solid var(--border-default); }
        .modal-box h2 { margin-bottom: 18px; color: var(--text-primary); font-size: 1.1em; }
        .modal-box select, .modal-box input { width: 100%; padding: 9px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); font-size: 0.95em; margin-bottom: 8px; background: var(--bg-input); color: var(--text-primary); }
        .modal-box select:focus { outline: none; border-color: var(--accent); }
        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }

        .toast { position: fixed; top: 20px; right: 20px; padding: 14px 24px; border-radius: var(--radius-sm); color: white; font-size: 0.95em; z-index: 9999; opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(-8px); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--error); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

        @media (max-width: 640px) {
            .container { padding: 0 10px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>考试设置</h1>
        <button onclick="window.location.href='teacher.html'">← 返回教师管理</button>
    </div>

    <div class="container">
        <!-- Exam Info -->
        <div class="card">
            <h2>考试信息</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group">
                    <label>考试标题 <span class="required">*</span></label>
                    <input type="text" id="examTitleField" placeholder="输入考试标题" required>
                </div>
                <div class="form-group">
                    <label>学校 <span class="required">*</span></label>
                    <input type="text" id="examSchool" placeholder="输入学校名称" required>
                </div>
                <div class="form-group">
                    <label>学院 <span class="required">*</span></label>
                    <input type="text" id="examCollege" placeholder="输入学院名称" required>
                </div>
                <div class="form-group">
                    <label>班级 <span class="required">*</span></label>
                    <input type="text" id="examClass" placeholder="输入班级" required>
                </div>
                <div class="form-group">
                    <label>年级 <span class="required">*</span></label>
                    <input type="text" id="examGrade" placeholder="输入年级" required>
                </div>
                <div class="form-group">
                    <label>专业</label>
                    <input type="text" id="examMajor" placeholder="输入专业（选填）">
                </div>
            </div>
        </div>



        <!-- Exam Settings -->
        <div class="card">
            <h2>考试设置</h2>

            <div class="form-group">
                <label>考试时长（分钟） <span class="required">*</span></label>
                <input type="number" id="examDuration" min="1" max="480" value="60" placeholder="请输入考试时长">
            </div>

            <div class="form-group">
                <label>开考时间 <span class="required">*</span></label>
                <div style="display:flex;gap:10px;">
                    <input type="text" id="examStartTimeDisplay" readonly style="flex:1;background:var(--bg-hover);" placeholder="点击选择开考时间">
                    <button class="btn btn-secondary" onclick="openTimePicker()">选择时间</button>
                </div>
            </div>

            <div class="form-group">
                <label>考试须知</label>
                <textarea id="examNotice" placeholder="请输入考试须知">1、离开或退出考试界面，计时不停止，请不要中途离开考试界面。
2、保持座位干净，请勿携带与考试无关的事物。
3、考试时间截止或答题时间结束，如果处于答题页面，将自动提交试卷。
4、考试过程中如果出现页面卡死、题目空白情况，请尝试切换网络或退出重新进入考试。
5、提交试卷后，请自行迅速离开考场</textarea>
            </div>

            <h3>可选设置</h3>
            <div class="form-group">
                <label>开考限时功能</label>
                <div class="inline-group">
                    <input type="number" id="lateStartLimit" min="0" value="0">
                    <span style="color:var(--text-tertiary);font-size:0.88em;">分钟以后不允许参加考试（0 = 不限制）</span>
                </div>
            </div>

            <div class="form-group">
                <label>交卷限时功能</label>
                <div class="inline-group">
                    <input type="number" id="lateSubmitLimit" min="0" value="0">
                    <span style="color:var(--text-tertiary);font-size:0.88em;">开考后 X 分钟内不允许提前交卷（0 = 不限制）</span>
                </div>
            </div>

        </div>

        <!-- Anti-cheat Settings -->
        <div class="card">
            <h2>防作弊设置</h2>
            <div class="checkbox-group">
                <input type="checkbox" id="screenSwitch" checked>
                <label for="screenSwitch">切屏控制 — 学生切换页面/窗口时记录警告，超过3次自动交卷</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="banScreenshot">
                <label for="banScreenshot">禁止截屏 — 阻止学生截取屏幕内容</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="banCopy">
                <label for="banCopy">禁止复制 — 阻止学生复制考试内容</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="shuffleQuestions">
                <label for="shuffleQuestions">题目乱序 — 学生接收到的题目显示顺序不同</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="shuffleOptions">
                <label for="shuffleOptions">选项乱序 — 学生接收到的题目选项顺序不同</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="autoGrade" checked>
                <label for="autoGrade">自动阅卷 — 客观题自动评分</label>
            </div>
        </div>

        <!-- Actions -->
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="window.location.href='teacher.html'">取消</button>
            <button class="btn" id="saveBtn" onclick="saveSettings()" style="background:var(--accent);color:var(--bg-root);">保存考试设置</button>
        </div>
    </div>

    <!-- Time Picker Modal -->
    <div class="modal-overlay" id="timePickerModal">
        <div class="modal-box">
            <h2>选择开考时间</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <div>
                    <label style="font-size:0.82em;color:var(--text-tertiary);">年</label>
                    <select id="tpYear"></select>
                </div>
                <div>
                    <label style="font-size:0.82em;color:var(--text-tertiary);">月</label>
                    <select id="tpMonth"></select>
                </div>
                <div>
                    <label style="font-size:0.82em;color:var(--text-tertiary);">日</label>
                    <select id="tpDay"></select>
                </div>
                <div>
                    <label style="font-size:0.82em;color:var(--text-tertiary);">时</label>
                    <select id="tpHour"></select>
                </div>
                <div>
                    <label style="font-size:0.82em;color:var(--text-tertiary);">分钟</label>
                    <select id="tpMinute"></select>
                </div>
            </div>
            <div class="modal-btns">
                <button class="btn btn-secondary" onclick="closeTimePicker()">取消</button>
                <button class="btn" onclick="confirmTimePicker()" style="background:var(--accent);color:var(--bg-root);">确定</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';
        const EXAM_ID = new URLSearchParams(window.location.search).get('exam_id');
        const DEFAULT_NOTICE = `1、离开或退出考试界面，计时不停止，请不要中途离开考试界面。\n2、保持座位干净，请勿携带与考试无关的事物。\n3、考试时间截止或答题时间结束，如果处于答题页面，将自动提交试卷。\n4、考试过程中如果出现页面卡死、题目空白情况，请尝试切换网络或退出重新进入考试。\n5、提交试卷后，请自行迅速离开考场。`;

        let questionsData = [];

        async function checkLogin() {
            try {
                const res = await fetch(`${API}/teacher/check`);
                const data = await res.json();
                if (!data.logged_in) window.location.href = 'login.html';
            } catch (e) { window.location.href = 'login.html'; }
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function loadExamSettings() {
            try {
                const res = await fetch(`${API}/exam/${EXAM_ID}`);
                const data = await res.json();

                        if (data.exam_title) document.getElementById('examTitleField').value = data.exam_title;
                if (data.school) document.getElementById('examSchool').value = data.school;
                if (data.college) document.getElementById('examCollege').value = data.college;
                if (data.class_name) document.getElementById('examClass').value = data.class_name;
                if (data.grade) document.getElementById('examGrade').value = data.grade;

                document.getElementById('examDuration').value = data.exam_duration || 60;
                if (data.exam_start_time) {
                    document.getElementById('examStartTimeDisplay').value = data.exam_start_time;
                }
                // Fallback: empty or old test data 'Test notice' -> use default
                var notice = data.exam_notice;
                if (!notice || notice === 'Test notice') {
                    notice = DEFAULT_NOTICE;
                }
                document.getElementById('examNotice').value = notice;
                document.getElementById('lateStartLimit').value = data.exam_late_start_limit || 0;
                document.getElementById('lateSubmitLimit').value = data.exam_late_submit_limit || 0;
                // anti_xxx=1 means 'enable anti-shuffle/screen-switch'
                // checked means the feature is ON (enforcing restriction)
                document.getElementById('shuffleQuestions').checked = data.anti_shuffle_questions ? true : false;
                document.getElementById('shuffleOptions').checked = data.anti_shuffle_options ? true : false;
                document.getElementById('screenSwitch').checked = data.anti_screen_switch ? true : false;
                document.getElementById('banCopy').checked = data.ban_copy ? true : false;
                document.getElementById('banScreenshot').checked = data.ban_screenshot ? true : false;

                // v4.0: Load auto_grade setting
                try {
                    const ag = await fetch(`${API}/teacher/exam/${EXAM_ID}/auto-grade`);
                    const agData = await ag.json();
                    document.getElementById('autoGrade').checked = agData.auto_grade;
                } catch(e) {}

                const qres = await fetch(`${API}/exam/${EXAM_ID}/questions`);
                questionsData = await qres.json();
                renderQuestions();
            } catch (e) {
                document.getElementById('examInfo').textContent = '加载失败';
            }
        }

        function renderQuestions() {
            const tbody = document.getElementById('questionTable');
            tbody.innerHTML = questionsData.map((q, i) => `
                <tr>
                    <td style="white-space:nowrap;">${i+1}</td>
                    <td>${q.q_type}</td>
                    <td>${q.score}</td>
                    <td><label class="switch"><input type="checkbox" ${q.enable_stata ? 'checked' : ''} onchange="questionsData[${i}].enable_stata=this.checked?1:0"><span class="slider"></span></label></td>
                    <td><label class="switch"><input type="checkbox" ${q.enable_ai ? 'checked' : ''} onchange="questionsData[${i}].enable_ai=this.checked?1:0"><span class="slider"></span></label></td>
                    <td><label class="switch"><input type="checkbox" ${q.enable_python ? 'checked' : ''} onchange="questionsData[${i}].enable_python=this.checked?1:0"><span class="slider"></span></label></td>
                    <td><label class="switch"><input type="checkbox" ${q.has_attachment ? 'checked' : ''} onchange="questionsData[${i}].has_attachment=this.checked?1:0"><span class="slider"></span></label></td>
                </tr>
            `).join('');
        }

        // ─── Time Picker ───
        function openTimePicker() {
            const now = new Date();
            const yearSel = document.getElementById('tpYear');
            yearSel.innerHTML = '';
            for (let y = now.getFullYear(); y <= now.getFullYear() + 2; y++) {
                yearSel.innerHTML += `<option value="${y}" ${y === now.getFullYear() ? 'selected' : ''}>${y}</option>`;
            }
            const monthSel = document.getElementById('tpMonth');
            monthSel.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                monthSel.innerHTML += `<option value="${m}" ${m === now.getMonth() + 1 ? 'selected' : ''}>${m}月</option>`;
            }
            populateDays();
            const hourSel = document.getElementById('tpHour');
            hourSel.innerHTML = '';
            for (let h = 0; h < 24; h++) {
                hourSel.innerHTML += `<option value="${h}">${h}时</option>`;
            }
            const minSel = document.getElementById('tpMinute');
            minSel.innerHTML = '';
            for (let m = 0; m < 60; m += 5) {
                minSel.innerHTML += `<option value="${m}">${m}分</option>`;
            }
            document.getElementById('timePickerModal').classList.add('show');
        }

        function populateDays() {
            const year = parseInt(document.getElementById('tpYear').value);
            const month = parseInt(document.getElementById('tpMonth').value);
            const daySel = document.getElementById('tpDay');
            const now = new Date();
            const daysInMonth = new Date(year, month, 0).getDate();
            daySel.innerHTML = '';
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = (d === now.getDate() && month === now.getMonth() + 1 && year === now.getFullYear());
                daySel.innerHTML += `<option value="${d}" ${isToday ? 'selected' : ''}>${d}日</option>`;
            }
        }

        function closeTimePicker() { document.getElementById('timePickerModal').classList.remove('show'); }

        function confirmTimePicker() {
            const y = document.getElementById('tpYear').value;
            const m = document.getElementById('tpMonth').value.padStart(2, '0');
            const d = document.getElementById('tpDay').value.padStart(2, '0');
            const h = document.getElementById('tpHour').value.padStart(2, '0');
            const min = document.getElementById('tpMinute').value.padStart(2, '0');
            document.getElementById('examStartTimeDisplay').value = `${y}-${m}-${d} ${h}:${min}`;
            closeTimePicker();
        }

        document.getElementById('tpYear').addEventListener('change', populateDays);
        document.getElementById('tpMonth').addEventListener('change', populateDays);

        document.getElementById('examNotice').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '\n' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 1;
                e.preventDefault();
            }
        });

        async function saveSettings() {
            const examDuration = parseInt(document.getElementById('examDuration').value);
            const examStartTime = document.getElementById('examStartTimeDisplay').value;
            if (!examDuration || examDuration < 1) { showToast('请设置考试时长', 'error'); return; }
            if (!examStartTime) { showToast('请选择开考时间', 'error'); return; }

            // v4.0.5: Validate required fields
            const examTitle = document.getElementById('examTitleField').value.trim();
            const schoolVal = document.getElementById('examSchool').value.trim();
            const collegeVal = document.getElementById('examCollege').value.trim();
            const classVal = document.getElementById('examClass').value.trim();
            const gradeVal = document.getElementById('examGrade').value.trim();
            if (!examTitle) { showToast('请填写考试标题', 'error'); document.getElementById('saveBtn').disabled = false; document.getElementById('saveBtn').textContent = '保存考试设置'; return; }
            if (!schoolVal) { showToast('请填写学校', 'error'); document.getElementById('saveBtn').disabled = false; document.getElementById('saveBtn').textContent = '保存考试设置'; return; }
            if (!collegeVal) { showToast('请填写学院', 'error'); document.getElementById('saveBtn').disabled = false; document.getElementById('saveBtn').textContent = '保存考试设置'; return; }
            if (!classVal) { showToast('请填写班级', 'error'); document.getElementById('saveBtn').disabled = false; document.getElementById('saveBtn').textContent = '保存考试设置'; return; }
            if (!gradeVal) { showToast('请填写年级', 'error'); document.getElementById('saveBtn').disabled = false; document.getElementById('saveBtn').textContent = '保存考试设置'; return; }

            // These are already validated above; reuse
            const school = schoolVal;
            const college = collegeVal;
            const className = classVal;
            const grade = gradeVal;
            const examNotice = document.getElementById('examNotice').value;
            const lateStartLimit = parseInt(document.getElementById('lateStartLimit').value) || 0;
            const lateSubmitLimit = parseInt(document.getElementById('lateSubmitLimit').value) || 0;

            document.getElementById('saveBtn').disabled = true;
            document.getElementById('saveBtn').textContent = '保存中...';

            try {
                await fetch(`${API}/exam/${EXAM_ID}/settings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        exam_title: examTitle,
                        school: school,
                        college: college,
                        class_name: className,
                        grade: grade,
                        major: document.getElementById('examMajor').value.trim(),
                        exam_duration: examDuration,
                        exam_start_time: examStartTime,
                        exam_notice: examNotice,
                        exam_late_start_limit: lateStartLimit,
                        exam_late_submit_limit: lateSubmitLimit,
                        anti_shuffle_questions: document.getElementById('shuffleQuestions').checked ? 1 : 0,
                        anti_shuffle_options: document.getElementById('shuffleOptions').checked ? 1 : 0,
                        anti_screen_switch: document.getElementById('screenSwitch').checked ? 1 : 0,
                        ban_copy: document.getElementById('banCopy').checked ? 1 : 0,
                        ban_screenshot: document.getElementById('banScreenshot').checked ? 1 : 0
                    })
                });

                // v4.0: Save auto_grade setting
                await fetch(`${API}/teacher/exam/${EXAM_ID}/auto-grade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ auto_grade: document.getElementById('autoGrade').checked ? 1 : 0 })
                });

                const qSettings = questionsData.map(q => ({
                    q_id: q.q_id,
                    enable_stata: q.enable_stata,
                    enable_ai: q.enable_ai,
                    enable_python: q.enable_python,
                    has_attachment: q.has_attachment
                }));
                await fetch(`${API}/exam/${EXAM_ID}/questions-settings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ settings: qSettings })
                });

                showToast('考试设置已保存！');
                setTimeout(() => window.location.href = 'teacher.html', 1500);
            } catch (e) {
                showToast('网络错误', 'error');
                document.getElementById('saveBtn').disabled = false;
                document.getElementById('saveBtn').textContent = '保存考试设置';
            }
        }

        checkLogin();
        loadExamSettings();
    </script>
</body>
</html>
