<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线考试 - AI智能考试系统 v3.0</title>
    <style>
        :root {
            --bg-root: #faf9f7;
            --bg-card: #ffffff;
            --bg-hover: #f5f3f0;
            --bg-input: #ffffff;
            --border-default: #e8e5e0;
            --border-hover: #d4cfc8;
            --text-primary: #1a1816;
            --text-secondary: #6b6560;
            --text-tertiary: #9e9892;
            --accent: #1a1816;
            --accent-dim: rgba(26,24,22,0.06);
            --success: #4a8c5c;
            --success-dim: rgba(74,140,92,0.08);
            --warning: #c4904a;
            --warning-dim: rgba(196,144,74,0.08);
            --error: #c45a5a;
            --error-dim: rgba(196,90,90,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--bg-root); color: var(--text-primary); min-height: 100vh; }

        .header { background: var(--bg-card); color: var(--text-primary); padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-default); }
        .header h1 { font-size: 1.1em; font-weight: 600; color: var(--text-primary); }
        .header .info { display: flex; align-items: center; gap: 20px; font-size: 0.88em; color: var(--text-secondary); }
        .timer { font-size: 1.2em; font-weight: 600; padding: 4px 14px; background: var(--bg-hover); border-radius: var(--radius-sm); min-width: 80px; text-align: center; border: 1px solid var(--border-default); color: var(--text-primary); }
        .timer.warning { background: var(--warning-dim); border-color: var(--warning); color: var(--warning); }
        .timer.danger { background: var(--error-dim); border-color: var(--error); color: var(--error); animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.65} }

        /* Toolbar */
        .toolbar { display: flex; gap: 10px; padding: 10px 30px; background: var(--bg-card); border-bottom: 1px solid var(--border-default); align-items: center; flex-wrap: wrap; }
        .toolbar .tb-btn { padding: 7px 14px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); background: var(--bg-card); cursor: pointer; font-size: 0.85em; display: flex; align-items: center; gap: 6px; transition: background 0.2s, border-color 0.2s; color: var(--text-secondary); }
        .toolbar .tb-btn:hover:not(.disabled) { background: var(--bg-hover); border-color: var(--border-hover); color: var(--text-primary); }
        .toolbar .tb-btn.active { background: var(--accent); color: var(--bg-card); border-color: var(--accent); }
        .toolbar .tb-btn.disabled { background: var(--bg-root); color: var(--text-tertiary); cursor: not-allowed; border-color: var(--border-default); }
        .toolbar .tb-divider { width: 1px; height: 24px; background: var(--border-hover); }
        .toolbar .tb-label { font-size: 0.82em; color: var(--text-tertiary); margin-right: 5px; }

        /* Attachment bar */
        .attach-bar { display: none; padding: 8px 30px; background: var(--bg-card); border-bottom: 1px solid var(--border-default); align-items: center; gap: 12px; font-size: 0.88em; color: var(--text-secondary); }
        .attach-bar.show { display: flex; }
        .attach-bar .attach-item { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--bg-hover); border: 1px solid var(--border-default); border-radius: var(--radius-sm); cursor: pointer; transition: background 0.2s; color: var(--accent); }
        .attach-bar .attach-item:hover { background: var(--accent-dim); }
        .attach-bar .attach-path { font-size: 0.8em; color: var(--text-tertiary); }

        .main { display: flex; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; min-height: calc(100vh - 120px); transition: margin-right 0.25s ease; }
        .main.ai-popup-open { margin-right: 520px; }
        .question-area { flex: 1; background: var(--bg-card); border-radius: var(--radius-lg); padding: 30px; border: 1px solid var(--border-default); display: flex; flex-direction: column; }
        .question-header { margin-bottom: 20px; }
        .question-header .q-num { font-size: 0.85em; color: var(--text-tertiary); margin-bottom: 4px; }
        .question-header .q-type { display: inline-block; padding: 2px 10px; background: var(--accent-dim); border-radius: var(--radius-sm); font-size: 0.8em; color: var(--accent); font-weight: 500; }
        .question-header .q-score { float: right; color: var(--accent); font-weight: 600; }
        .question-content { font-size: 1em; line-height: 1.7; margin-bottom: 24px; color: var(--text-primary); }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border: 1px solid var(--border-default); border-radius: var(--radius-md); cursor: pointer; transition: border-color 0.2s, background 0.2s; background: var(--bg-card); }
        .option:hover { border-color: var(--border-hover); background: var(--bg-hover); }
        .option.selected { border-color: var(--accent); background: var(--accent-dim); }
        .option input { margin-top: 3px; accent-color: var(--accent); }
        .option label { cursor: pointer; flex: 1; font-size: 0.95em; line-height: 1.6; color: var(--text-primary); }
        .answer-textarea { width: 100%; min-height: 200px; padding: 14px; border: 1px solid var(--border-default); border-radius: var(--radius-md); font-size: 0.95em; line-height: 1.7; resize: vertical; font-family: inherit; transition: border-color 0.2s; color: var(--text-primary); background: var(--bg-input); }
        .answer-textarea:focus { outline: none; border-color: var(--accent); }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: auto; padding-top: 24px; }
        .nav-btn { padding: 10px 28px; border: none; border-radius: var(--radius-md); font-size: 0.92em; cursor: pointer; font-weight: 500; transition: all 0.2s; }
        .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .nav-prev { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-default); }
        .nav-prev:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-hover); }
        .nav-next { background: var(--accent); color: var(--bg-card); }
        .nav-next:hover:not(:disabled) { opacity: 0.85; }
        .nav-submit { background: var(--success); color: var(--bg-card); }
        .nav-submit:hover { opacity: 0.85; }
        .sidebar { width: 220px; background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px; border: 1px solid var(--border-default); align-self: flex-start; position: sticky; top: 70px; }
        .sidebar h3 { font-size: 0.9em; color: var(--text-primary); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-default); }
        .q-nav { display: flex; flex-direction: column; gap: 0; }
        .q-nav-type { font-size: 0.78em; color: var(--text-tertiary); margin: 8px 0 4px; font-weight: 500; }
        .q-nav-type:first-of-type { margin-top: 0; }
        .q-nav-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .q-nav-btn { width: 34px; height: 34px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.8em; font-weight: 500; transition: background 0.2s, border-color 0.2s; background: var(--bg-card); color: var(--text-secondary); }
        .q-nav-btn.current { background: var(--accent); color: var(--bg-card); border-color: var(--accent); }
        .q-nav-btn.answered { background: var(--success); color: var(--bg-card); border-color: var(--success); }
        .q-nav-btn:hover { background: var(--bg-hover); border-color: var(--border-hover); color: var(--text-primary); }
        .save-status { font-size: 0.76em; color: var(--text-tertiary); margin-top: 12px; text-align: center; }
        .tab-switch-warning { font-size: 0.82em; color: var(--error); margin-top: 8px; text-align: center; }

        .submitted-page .big-icon, .terminated-page .big-icon { font-size: 3.5em; margin-bottom: 16px; }
        .submitted-page h2 { font-size: 1.5em; color: var(--text-primary); margin-bottom: 8px; }
        .terminated-page h2 { font-size: 1.5em; color: var(--error); margin-bottom: 8px; }
        .submitted-page p, .terminated-page p { color: var(--text-secondary); font-size: 1em; }
        .submitted-page .score-display { font-size: 2.5em; font-weight: bold; color: var(--success); margin: 20px 0; }

        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 22px; border-radius: var(--radius-md); color: var(--bg-card); font-size: 0.9em; z-index: 9999; opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(-8px); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: var(--success); }
        .toast-warning { background: var(--warning); }
        .toast-error { background: var(--error); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: var(--bg-card); border-radius: var(--radius-lg); padding: 30px; max-width: 400px; width: 90%; text-align: center; border: 1px solid var(--border-default); }
        .modal-box h2 { margin-bottom: 14px; color: var(--text-primary); }
        .modal-box p { color: var(--text-secondary); margin-bottom: 24px; }
        .modal-btns { display: flex; gap: 12px; justify-content: center; }
        .modal-btn { padding: 9px 22px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.92em; font-weight: 500; transition: background 0.2s; }
        .modal-cancel { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-default); }
        .modal-cancel:hover { background: var(--bg-hover); }
        .modal-confirm { background: var(--success); color: var(--bg-card); }
        .modal-confirm:hover { opacity: 0.85; }

        .ai-popup { display: none; position: fixed; top: 0; right: 0; width: 500px; height: 100%; background: var(--bg-card); z-index: 2000; border-left: 1px solid var(--border-default); flex-direction: column; }
        .ai-popup.show { display: flex; }
        .ai-popup .ai-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--bg-hover); border-bottom: 1px solid var(--border-default); font-weight: 600; font-size: 0.9em; color: var(--text-primary); }
        .ai-popup .ai-header .close-btn { background: none; border: none; font-size: 1.3em; cursor: pointer; color: var(--text-tertiary); transition: color 0.2s; }
        .ai-popup .ai-header .close-btn:hover { color: var(--text-primary); }
        .ai-popup iframe { flex: 1; border: none; width: 100%; }

        .notice-banner { display: none; padding: 10px 30px; background: var(--accent-dim); border-bottom: 1px solid var(--border-default); font-size: 0.88em; color: var(--text-primary); line-height: 1.6; white-space: pre-line; }
        .notice-banner.show { display: block; }

        .stata-input-panel {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16px;
            margin: 10px 30px;
            border: 1px solid var(--border-default);
        }
        .stata-input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .stata-input-header .close-btn {
            font-size: 1.3em;
            cursor: pointer;
            color: var(--text-tertiary);
        }
        .stata-input-header .close-btn:hover { color: var(--text-primary); }
        #stataCommandInput {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            font-size: 0.88em;
            resize: vertical;
            color: var(--text-primary);
            background: var(--bg-input);
        }
        #stataCommandInput:focus { outline: none; border-color: var(--accent); }

        .ai-chat-panel {
            display: none;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16px;
            margin: 10px 30px;
            border: 1px solid var(--border-default);
        }
        .ai-chat-panel.show { display: block; }
        .ai-chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .ai-chat-header .close-btn {
            font-size: 1.3em;
            cursor: pointer;
            color: var(--text-tertiary);
            background: none;
            border: none;
        }
        .ai-chat-header .close-btn:hover { color: var(--text-primary); }
        .ai-chat-messages {
            background: var(--bg-input);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            padding: 12px;
            min-height: 200px;
            max-height: 50vh;
            overflow-y: auto;
            font-size: 0.88em;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .ai-chat-msg {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            max-width: 85%;
            word-break: break-word;
        }
        .ai-chat-msg.user {
            background: var(--accent-dim);
            margin-left: auto;
            text-align: right;
        }
        .ai-chat-msg.ai {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
        }
        .ai-chat-msg .sender {
            font-size: 0.76em;
            color: var(--text-tertiary);
            margin-bottom: 2px;
        }
        .ai-chat-msg .content {
            white-space: pre-wrap;
            font-family: var(--font-sans);
        }
        .ai-chat-msg .content code {
            background: rgba(0,0,0,0.04);
            padding: 1px 4px;
            border-radius: 3px;
            font-family: 'JetBrains Mono', Consolas, monospace;
            font-size: 0.88em;
        }
        .ai-chat-input-row {
            display: flex;
            gap: 8px;
        }
        .ai-chat-input-row textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 0.88em;
            resize: none;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-input);
            min-height: 42px;
            max-height: 120px;
        }
        .ai-chat-input-row textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .ai-chat-input-row button {
            padding: 8px 16px;
            background: var(--accent);
            color: var(--bg-card);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            white-space: nowrap;
        }
        .ai-chat-input-row button:hover:not(:disabled) {
            opacity: 0.85;
        }
        .ai-chat-input-row button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .submitted-page, .terminated-page {
            display: none;
            text-align: center;
            padding: 60px 40px;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-default);
            max-width: 500px;
            width: 90%;
            color: var(--text-primary);
        }
        .submitted-page.show, .terminated-page.show { display: block; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

        @media (max-width: 768px) {
            .ai-popup { width: 100%; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="examTitle">加载中...</h1>
        <div class="info">
            <span id="currentTime"></span>
            <span>剩余:</span>
            <span class="timer" id="timer">--:--</span>
        </div>
    </div>

    <!-- Exam Notice (hidden; only used on cover page) -->
    <div class="notice-banner" id="noticeBanner" style="display:none;"></div>

    <!-- Attachment bar -->
    <div class="attach-bar" id="attachBar">
        <span>附件：</span>
        <div id="attachItems"></div>
        <span class="attach-path" id="attachPath"></span>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" id="examToolbar">
        <span class="tb-label">AI:</span>
        <button class="tb-btn disabled" id="aiToggleBtn" onclick="toggleAI()" disabled>豆包</button>
        <button class="tb-btn disabled" id="aiChatBtn" onclick="toggleAiChat()" disabled>AI 对话</button>
    </div>

    <div class="main">
        <div class="question-area" id="questionArea">
            <div class="question-header">
                <div class="q-num" id="qNum"></div>
                <span class="q-type" id="qType"></span>
                <span class="q-score" id="qScore"></span>
            </div>
            <div class="question-content" id="qContent"></div>
            <div id="qAnswer"></div>
            <div id="stataSection"></div>
            <div id="pythonSection"></div>
            <div class="nav-buttons">
                <button class="nav-btn nav-prev" id="prevBtn" onclick="prevQuestion()">上一题</button>
                <button class="nav-btn nav-next" id="nextBtn" onclick="nextQuestion()">下一题</button>
                <button class="nav-btn nav-submit" id="submitBtn" onclick="confirmSubmit()" style="display:none;">提交试卷</button>
            </div>
            <div class="tab-switch-warning" id="tabWarning"></div>
        </div>

        <div class="submitted-page" id="submittedPage">
            <h2 style="margin-bottom:8px;">试卷已提交</h2>
            <p>你的答案已保存，考试结束。</p>
        </div>

        <div class="terminated-page" id="terminatedPage">
            <h2 style="margin-bottom:8px;">考试已被终止</h2>
            <p id="terminatedReason">你的考试已被老师终止，请联系老师。</p>
            <p style="margin-top: 20px; color: var(--text-tertiary); font-size: 0.9em;">请等待老师进一步指示。</p>
        </div>

        <div class="sidebar">
            <h3>题目导航</h3>
            <div class="q-nav" id="qNav"></div>
            <div class="save-status" id="saveStatus"></div>
        </div>
    </div>

    <!-- Submit confirm modal -->
    <div class="modal-overlay" id="submitModal">
        <div class="modal-box">
            <h2>确认提交？</h2>
            <p id="submitInfo"></p>
            <div class="modal-btns">
                <button class="modal-btn modal-cancel" onclick="closeSubmitModal()">继续考试</button>
                <button class="modal-btn modal-confirm" onclick="doSubmit()">确认提交</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- AI popup (iframe-based web AI, available to all students) -->
    <div class="ai-popup" id="aiPopup">
        <div class="ai-header">
            <span id="aiPopupTitle">豆包对话</span>
            <button class="close-btn" onclick="toggleAI()">&times;</button>
        </div>
        <iframe id="aiFrame" src="about:blank"></iframe>
    </div>

    <!-- AI Chat panel (API-based, requires student's own API key) -->
    <div class="ai-chat-panel" id="aiChatPanel">
        <div class="ai-chat-header">
            <span id="aiChatTitle">AI 对话</span>
            <button class="close-btn" onclick="toggleAiChat()">&times;</button>
        </div>
        <div class="ai-chat-messages" id="aiChatMessages">
            <div style="color:var(--text-tertiary);text-align:center;margin-top:40px;">输入问题，与 AI 对话</div>
        </div>
        <div class="ai-chat-input-row">
            <textarea id="aiChatInput" placeholder="输入你的问题..." rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAiMessage();}"></textarea>
            <button id="aiChatSendBtn" onclick="sendAiMessage()">发送</button>
        </div>
    </div>

    <script>
        const API = '/api';
        const params = new URLSearchParams(window.location.search);
        const studentId = params.get('student_id') || '';
        const studentName = params.get('name') || '';

        // v4.4: AI chat credentials from login
        const aiPlatform = params.get('ai_platform') || '';
        const aiApiKey = params.get('ai_key') || '';
        const hasAiCredentials = !!(aiPlatform && aiApiKey);

        let sessionId = null;
        let examDuration = 60;
        let questions = [];
        let currentIndex = 0;
        let answers = {};
        let examSubmitted = false;
        let examTerminated = false;
        let timerInterval = null;
        let autoSaveInterval = null;
        let attachments = [];
        let questionSettings = {}; // {qId: {enableStata, enableAi, enablePython}}
        // v4.2: Per-question Stata state
        let stataAnswers = {}; // {qId: {stata_code: '', stata_output: ''}}
        // v5.2: Per-question Python state
        let pythonAnswers = {}; // {qId: {python_code: '', python_output: ''}}
        // v4.4: AI chat history
        let aiChatHistory = [];
        // v5.0: Submit lockout
        let examStartTime = null; // ISO string from backend
        let lateSubmitLimit = 0; // minutes


        // Default download paths
        const DEFAULT_DOWNLOAD_PATH = 'C:\\Users\\Public\\Downloads';
        const FALLBACK_DOWNLOAD_PATH = 'C:\\Users\\Administrator\\Desktop';

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function loadExam() {
            // Get first available exam or use exam_id param
            const examId = params.get('exam_id');
            let targetExamId = examId;

            if (!targetExamId) {
                try {
                    const res = await fetch(`${API}/student/exams?student_id=${encodeURIComponent(studentId)}`);
                    const exams = await res.json();
                    if (exams.length === 0) {
                        showToast('暂无可用考试', 'error');
                        setTimeout(() => window.location.href = 'login.html', 2000);
                        return;
                    }
                    targetExamId = exams[0].exam_id;
                } catch (e) {
                    showToast('加载考试列表失败', 'error');
                    return;
                }
            }

            try {
                const res = await fetch(`${API}/exam/${targetExamId}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id: studentId, student_name: studentName })
                });
                const data = await res.json();
                if (!res.ok) {
                    showToast(data.error || '无法开始考试', 'error');
                    setTimeout(() => window.location.href = 'login.html', 3000);
                    return;
                }

                sessionId = data.session_id;
                document.getElementById('examTitle').textContent = data.title;
                examDuration = data.exam_duration || 60;
                questions = data.questions || [];
                answers = {};
                // v5.0: Submit lockout
                examStartTime = data.exam_start_time || '';
                lateSubmitLimit = data.exam_late_submit_limit || 0;

                // v3.0: Process question settings
                questions.forEach(q => {
                    questionSettings[q.q_id] = {
                        enableStata: !!q.enable_stata,
                        enableAi: !!q.enable_ai,
                        enablePython: !!q.enable_python,
                        hasAttachment: !!q.has_attachment
                    };
                    if (data.saved_answers && data.saved_answers[q.q_id]) {
                        const saved = data.saved_answers[q.q_id];
                        // v4.2: Try to parse JSON answer containing stata fields
                        try {
                            const parsed = JSON.parse(saved);
                            if (typeof parsed === 'object') {
                                const qid = q.q_id;
                                answers[qid] = parsed.choice || parsed.text || saved;
                                if (parsed.stata_code !== undefined) {
                                    if (!stataAnswers[qid]) stataAnswers[qid] = {};
                                    stataAnswers[qid].stata_code = parsed.stata_code;
                                    stataAnswers[qid].stata_output = parsed.stata_output || '';
                                }
                                // v5.2: Restore Python answer state
                                if (parsed.python_code !== undefined) {
                                    if (!pythonAnswers[qid]) pythonAnswers[qid] = {};
                                    pythonAnswers[qid].python_code = parsed.python_code;
                                    pythonAnswers[qid].python_output = parsed.python_output || '';
                                }
                            } else {
                                answers[q.q_id] = saved;
                            }
                        } catch(e) {
                            answers[q.q_id] = saved;
                        }
                    }
                });

                // v3.0: Attachments
                attachments = data.attachments || [];
                if (attachments.length > 0) {
                    renderAttachments();
                }

                // v3.0: Exam notice (suppressed on exam page; shown only on cover)

                // v3.0: Anti-cheat
                if (data.anti_screen_switch) {
                    setupStrictAntiCheat();
                }

                // v5.0: Bind copy/ screenshot prevention based on settings
                if (data.ban_copy) {
                    setupBanCopy();
                }
                if (data.ban_screenshot) {
                    setupBanScreenshot();
                }

                // Set examId for image URLs
                examIdForImages = targetExamId;

                // v4.2: Store data files info (suppressed on exam page)

                updateToolbar();
                renderQuestion();
                renderQuestionNav();
                startTimer();
                startAutoSave();
                updateClock();
                setInterval(updateClock, 1000);
                setInterval(updateSubmitLockout, 1000);



                // v3.0: Check termination status
                setInterval(checkTerminated, 10000);

            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        function updateToolbar() {
            const currentQ = questions[currentIndex];
            if (!currentQ) return;
            const settings = questionSettings[currentQ.q_id] || { enableAi: false };

            const aiBtn = document.getElementById('aiToggleBtn');
            const aiChatBtn = document.getElementById('aiChatBtn');

            if (settings.enableAi) {
                aiBtn.classList.remove('disabled');
                aiBtn.disabled = false;
                aiChatBtn.classList.remove('disabled');
                aiChatBtn.disabled = false;
                if (hasAiCredentials) {
                    aiChatBtn.textContent = 'AI 对话 (' + aiPlatform + ')';
                }
            } else {
                aiBtn.classList.add('disabled');
                aiBtn.disabled = true;
                aiChatBtn.classList.add('disabled');
                aiChatBtn.disabled = true;
            }
        }

        function renderAttachments() {
            const bar = document.getElementById('attachBar');
            const items = document.getElementById('attachItems');
            const path = document.getElementById('attachPath');

            if (attachments.length === 0) {
                bar.classList.remove('show');
                return;
            }

            bar.classList.add('show');
            items.innerHTML = attachments.map(a => `
                <span class="attach-item" onclick="downloadAttachment(${a.attachment_id}, '${a.original_name.replace(/'/g, "\\'")}')">
                    ${a.original_name}
                </span>
            `).join('');
            path.textContent = `下载路径: ${DEFAULT_DOWNLOAD_PATH}`;
        }

        async function downloadAttachment(attachId, filename) {
            const url = `${API}/attachment/download/${attachId}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Download failed');
                const blob = await res.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.click();
                URL.revokeObjectURL(link.href);
                showToast(`附件已下载: ${filename}`);
            } catch (e) {
                showToast('下载失败', 'error');
            }
        }

        // Helper: render content with images embedded from remark filenames
        function renderContentWithImages(content, remark) {
            let html = escapeHtml(content);
            if (remark) {
                // Parse filenames from remark (separated by ;)
                const filenames = remark.split(';').map(s => s.trim()).filter(Boolean);
                filenames.forEach(f => {
                    // Check if this looks like an image file
                    if (f.match(/\.(png|jpg|jpeg|gif|bmp|webp|svg)$/i)) {
                        const eid = examIdForImages || examIdParam;
                        const imgUrl = `${API}/exam/${eid}/attachments/file/${encodeURIComponent(f)}`;
                        const imgHtml = `<div style="margin:10px 0;"><img src="${imgUrl}" alt="${escapeHtml(f)}" style="max-width:100%;max-height:400px;border-radius:8px;border:1px solid var(--border-default);" onerror="this.style.display='none'"></div>`;
                        html += imgHtml;
                    }
                });
            }
            return html;
        }

        // Helper: check if an option value is an image filename, render as <img> or return raw text
        function renderOptionWithImage(optionText) {
            if (!optionText) return '';
            const trimmed = optionText.trim();
            if (trimmed.match(/\.(png|jpg|jpeg|gif|bmp|webp|svg)$/i)) {
                const eid = examIdForImages || examIdParam;
                const imgUrl = `${API}/exam/${eid}/attachments/file/${encodeURIComponent(trimmed)}`;
                return `<img src="${imgUrl}" alt="${escapeHtml(trimmed)}" style="max-width:150px;max-height:150px;border-radius:6px;vertical-align:middle;border:1px solid var(--border-default);" onerror="this.style.display='none'">`;
            }
            return escapeHtml(trimmed);
        }

        // Simple HTML escape
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Get examId from current context for image URLs
        let examIdForImages = null;
        const examIdParam = new URLSearchParams(window.location.search).get('exam_id') || '';

        function renderQuestion() {
            const q = questions[currentIndex];
            if (!q) return;

            // Close AI windows if current question doesn't allow AI
            const settings = questionSettings[q.q_id] || {};
            if (!settings.enableAi) {
                closeAIWindow();
                clearAiChat();
            }

            // Compute type-local question number
            const qType = q.q_type;
            let typeLocalNum = 1;
            let typeTotal = 0;
            for (let i = 0; i < questions.length; i++) {
                if (questions[i].q_type === qType) {
                    typeTotal++;
                    if (i < currentIndex) typeLocalNum++;
                }
            }
            document.getElementById('qNum').textContent = `${qType} 第${typeLocalNum}题 / 共${typeTotal}题（本类）`;
            document.getElementById('qType').textContent = q.q_type;
            document.getElementById('qScore').textContent = `${q.score} 分`;

            // v4.2: Show data file badges
            let dataFileHtml = '';
            if (q.data_file) {
                const files = q.data_file.split(';').map(f => f.trim()).filter(Boolean);
                if (files.length > 0) {
                    dataFileHtml = `<div style="margin:8px 0 12px;padding:8px 12px;background:var(--accent-dim);border-radius:6px;border:1px solid var(--border-default);font-size:0.85em;color:var(--text-primary);">Data: ${files.map(f => `<code style="background:var(--accent-dim);padding:2px 6px;border-radius:4px;margin:0 2px;color:var(--accent);">${escapeHtml(f)}</code>`).join(', ')}</div>`;
                }
            }

            document.getElementById('qContent').innerHTML = renderContentWithImages(q.content, q.remark) + dataFileHtml;

            const answerDiv = document.getElementById('qAnswer');
            if (['单选题', '判断题'].includes(q.q_type)) {
                let options = [];
                if (q.q_type === '判断题') {
                    // 判断题: show ✓/✗ toggle instead of A/B
                    options = [
                        { key: '正确', text: '正确 (✓)' },
                        { key: '错误', text: '错误 (✗)' }
                    ];
                } else {
                    if (q.option_a) options.push({ key: 'A', text: renderOptionWithImage(q.option_a) });
                    if (q.option_b) options.push({ key: 'B', text: renderOptionWithImage(q.option_b) });
                    if (q.option_c) options.push({ key: 'C', text: renderOptionWithImage(q.option_c) });
                    if (q.option_d) options.push({ key: 'D', text: renderOptionWithImage(q.option_d) });
                }
                answerDiv.innerHTML = `<div class="options">${options.map(o => `
                    <div class="option ${answers[q.q_id] === o.key ? 'selected' : ''}" onclick="selectOption('${q.q_id}', '${o.key}')">
                        <input type="radio" name="q_${q.q_id}" ${answers[q.q_id] === o.key ? 'checked' : ''}>
                        <label><b>${o.key === '正确' ? '✓' : o.key === '错误' ? '✗' : o.key}.</b> ${o.text}</label>
                    </div>
                `).join('')}</div>`;
            } else if (q.q_type === '多选题') {
                let options = [];
                if (q.option_a) options.push({ key: 'A', text: renderOptionWithImage(q.option_a) });
                if (q.option_b) options.push({ key: 'B', text: renderOptionWithImage(q.option_b) });
                if (q.option_c) options.push({ key: 'C', text: renderOptionWithImage(q.option_c) });
                if (q.option_d) options.push({ key: 'D', text: renderOptionWithImage(q.option_d) });
                const currentAns = answers[q.q_id] || '';
                answerDiv.innerHTML = `<div class="options">${options.map(o => `
                    <div class="option ${currentAns.includes(o.key) ? 'selected' : ''}" onclick="toggleMultiOption('${q.q_id}', '${o.key}')">
                        <input type="checkbox" ${currentAns.includes(o.key) ? 'checked' : ''}>
                        <label><b>${o.key}.</b> ${o.text}</label>
                    </div>
                `).join('')}</div>`;
            } else {
                answerDiv.innerHTML = `<textarea class="answer-textarea" placeholder="请输入答案..." oninput="answers[${q.q_id}]=this.value">${answers[q.q_id] || ''}</textarea>`;
            }

            // v4.2: Per-question Stata section
            const qSettings = questionSettings[q.q_id] || {};
            const stataSection = document.getElementById('stataSection');
            if (qSettings.enableStata) {
                const sa = stataAnswers[q.q_id] || {};
                stataSection.innerHTML = `
                    <div style="margin-top:16px;padding:16px;background:var(--bg-card);border-radius:8px;border:1px solid var(--border-default);">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                            <span style="font-weight:600;color:var(--text-primary);font-size:0.9em;">Stata 代码</span>
                            <span style="font-size:0.78em;color:var(--text-tertiary);">输入Stata命令，支持 use data1.dta 等数据文件</span>
                        </div>
                        <textarea id="stataCode_${q.q_id}" placeholder="输入Stata命令，每行一条&#10;例如: use data1.dta, clear&#10;summarize price" rows="5" style="width:100%;padding:10px;border:1px solid var(--border-default);border-radius:6px;font-family:'JetBrains Mono',Consolas,monospace;font-size:0.86em;resize:vertical;margin-bottom:8px;background:var(--bg-input);color:var(--text-primary);">${escapeHtml(sa.stata_code || '')}</textarea>
                        <div style="display:flex;gap:8px;margin-bottom:8px;">
                            <button onclick="executeQuestionStata(${q.q_id})" style="padding:7px 16px;border:none;border-radius:6px;background:var(--accent);color:var(--bg-card);cursor:pointer;font-size:0.86em;">Execute</button>
                        </div>
                        <div id="stataOutput_${q.q_id}" style="padding:10px;background:var(--bg-input);border-radius:6px;font-family:'JetBrains Mono',Consolas,monospace;font-size:0.82em;white-space:pre-wrap;min-height:120px;max-height:400px;overflow-y:scroll;display:${sa.stata_output ? 'block' : 'none'};margin-bottom:8px;border:1px solid var(--border-default);color:var(--text-primary);">${escapeHtml(sa.stata_output || '')}</div>
                    </div>
                `;
                stataSection.style.display = 'block';
            } else {
                stataSection.style.display = 'none';
            }

            // v5.2: Per-question Python section
            const pythonSection = document.getElementById('pythonSection');
            if (qSettings.enablePython) {
                const pa = pythonAnswers[q.q_id] || {};
                pythonSection.innerHTML = `
                    <div style="margin-top:16px;padding:16px;background:var(--bg-card);border-radius:8px;border:1px solid var(--border-default);">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                            <span style="font-weight:600;color:var(--text-primary);font-size:0.9em;">Python 代码</span>
                            <span style="font-size:0.78em;color:var(--text-tertiary);">输入Python代码并执行</span>
                        </div>
                        <textarea id="pythonCode_${q.q_id}" placeholder="输入Python代码&#10;例如: print('Hello, World!')" rows="5" style="width:100%;padding:10px;border:1px solid var(--border-default);border-radius:6px;font-family:'JetBrains Mono',Consolas,monospace;font-size:0.86em;resize:vertical;margin-bottom:8px;background:var(--bg-input);color:var(--text-primary);">${escapeHtml(pa.python_code || '')}</textarea>
                        <div style="display:flex;gap:8px;margin-bottom:8px;">
                            <button onclick="executeQuestionPython(${q.q_id})" style="padding:7px 16px;border:none;border-radius:6px;background:var(--accent);color:var(--bg-card);cursor:pointer;font-size:0.86em;">Execute</button>
                        </div>
                        <div id="pythonOutput_${q.q_id}" style="padding:10px;background:var(--bg-input);border-radius:6px;font-family:'JetBrains Mono',Consolas,monospace;font-size:0.82em;white-space:pre-wrap;min-height:120px;max-height:400px;overflow-y:scroll;display:${pa.python_output ? 'block' : 'none'};margin-bottom:8px;border:1px solid var(--border-default);color:var(--text-primary);">${escapeHtml(pa.python_output || '')}</div>
                    </div>
                `;
                pythonSection.style.display = 'block';
            } else {
                pythonSection.style.display = 'none';
            }

            // Navigation buttons
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            if (currentIndex === questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('submitBtn').style.display = 'inline-block';
                // v5.0: Update lockout state when submit button appears
                updateSubmitLockout();
            } else {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('submitBtn').style.display = 'none';
            }

            updateToolbar();
            updateQuestionNav();
        }

        function selectOption(qId, key) {
            answers[qId] = key;
            renderQuestion();
        }

        function toggleMultiOption(qId, key) {
            let current = answers[qId] || '';
            if (current.includes(key)) {
                current = current.replace(key, '');
            } else {
                current += key;
            }
            answers[qId] = current;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentIndex > 0) { currentIndex--; renderQuestion(); }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); }
        }

        function renderQuestionNav() {
            const nav = document.getElementById('qNav');
            nav.innerHTML = '';
            const types = ['单选题', '多选题', '判断题', '简答题', '综合题'];
            let qIndex = 0;
            for (const type of types) {
                const typeQuestions = questions.filter(q => q.q_type === type);
                if (typeQuestions.length === 0) continue;
                const typeLabel = document.createElement('div');
                typeLabel.className = 'q-nav-type';
                typeLabel.textContent = type;
                nav.appendChild(typeLabel);
                const group = document.createElement('div');
                group.className = 'q-nav-group';
                let typeNum = 1;
                for (const q of typeQuestions) {
                    const btn = document.createElement('button');
                    btn.className = 'q-nav-btn';
                    btn.textContent = typeNum;
                    btn.dataset.index = qIndex;
                    const idx = qIndex;
                    btn.onclick = () => goToQuestion(idx);
                    group.appendChild(btn);
                    qIndex++;
                    typeNum++;
                }
                nav.appendChild(group);
            }
            updateQuestionNav();
        }

        function updateQuestionNav() {
            const nav = document.getElementById('qNav');
            const btns = nav.querySelectorAll('.q-nav-btn');
            btns.forEach(btn => {
                const idx = parseInt(btn.dataset.index);
                const q = questions[idx];
                btn.className = `q-nav-btn ${idx === currentIndex ? 'current' : ''} ${q && answers[q.q_id] ? 'answered' : ''}`;
            });
        }

        function goToQuestion(index) {
            currentIndex = index;
            renderQuestion();
        }

        function confirmSubmit() {
            // v5.0: Check submit lockout
            if (getSubmitLockoutSeconds() > 0) {
                showToast('距离可提交还有时间，不允许提前交卷', 'error');
                return;
            }
            const answered = questions.filter(q => answers[q.q_id]).length;
            document.getElementById('submitInfo').textContent =
                `共 ${questions.length} 题，已作答 ${answered} 题。确认提交？`;
            document.getElementById('submitModal').classList.add('show');
        }

        function closeSubmitModal() {
            document.getElementById('submitModal').classList.remove('show');
        }

        function buildFinalAnswers() {
            // v4.2: Merge per-question stata state into JSON answer format
            // v5.2: Also merge per-question python state
            const finalAnswers = {};
            questions.forEach(q => {
                const qid = q.q_id;
                const baseAnswer = answers[qid] || '';
                const sa = stataAnswers[qid];
                const pa = pythonAnswers[qid];
                const hasStata = sa && (sa.stata_code || sa.stata_output);
                const hasPython = pa && (pa.python_code || pa.python_output);
                if (hasStata || hasPython) {
                    // Build JSON answer object
                    const answerData = {
                        choice: q.q_type === '简答题' || q.q_type === '综合题' ? '' : baseAnswer,
                        text: (q.q_type === '简答题' || q.q_type === '综合题') ? baseAnswer : '',
                        stata_code: sa?.stata_code || '',
                        stata_output: sa?.stata_output || '',
                        python_code: pa?.python_code || '',
                        python_output: pa?.python_output || ''
                    };
                    finalAnswers[qid] = JSON.stringify(answerData);
                } else {
                    finalAnswers[qid] = baseAnswer;
                }
            });
            return finalAnswers;
        }

        async function doSubmit() {
            closeSubmitModal();
            closeAIWindow();
            clearAiChat();  // v4.4: Clean up AI credentials and chat history
            examSubmitted = true;
            // v4.2: Save stata/python state before submit
            if (questions[currentIndex]) {
                const q = questions[currentIndex];
                saveStataState(q.q_id);
                savePythonState(q.q_id);
            }
            try {
                const finalAnswers = buildFinalAnswers();
                const res = await fetch(`${API}/exam/session/${sessionId}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answers: finalAnswers })
                });
                const data = await res.json();
                if (data.ok) {
                    showSubmittedPage();
                } else {
                    showToast(data.error || '提交失败', 'error');
                    examSubmitted = false;
                }
            } catch (e) {
                showToast('网络错误', 'error');
                examSubmitted = false;
            }
        }

        function startTimer() {
            let remaining = examDuration * 60;
            const timerEl = document.getElementById('timer');

            timerInterval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    showToast('考试时间到，自动提交试卷', 'warning');
                    doSubmit();
                    return;
                }
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                if (remaining <= 300) timerEl.className = 'timer danger';
                else if (remaining <= 600) timerEl.className = 'timer warning';
            }, 1000);
        }

        function startAutoSave() {
            autoSaveInterval = setInterval(() => {
                // v4.2: Save current question's stata/python state before auto-save
                if (questions[currentIndex]) {
                    saveStataState(questions[currentIndex].q_id);
                    savePythonState(questions[currentIndex].q_id);
                }
                saveCurrentAnswers();
                document.getElementById('saveStatus').textContent = '已自动保存 ' + new Date().toLocaleTimeString();
            }, 30000);
        }

        async function saveCurrentAnswers() {
            if (!sessionId || examSubmitted) return;
            try {
                const finalAnswers = buildFinalAnswers();
                await fetch(`${API}/exam/session/${sessionId}/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answers: finalAnswers })
                });
            } catch (e) {}
        }

        function updateClock() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
        }

        // v5.0: Check if submit is currently allowed (based on late submit limit)
        function getSubmitLockoutSeconds() {
            if (!examStartTime || !lateSubmitLimit || lateSubmitLimit <= 0) return 0;
            const startDt = new Date(examStartTime.replace(' ', 'T'));
            const deadline = new Date(startDt.getTime() + lateSubmitLimit * 60000);
            const remaining = Math.floor((deadline - new Date()) / 1000);
            return remaining > 0 ? remaining : 0;
        }

        // v5.0: Update submit button state based on lockout
        function updateSubmitLockout() {
            const btn = document.getElementById('submitBtn');
            if (!btn || btn.style.display === 'none') return;
            const lockoutSec = getSubmitLockoutSeconds();
            if (lockoutSec > 0) {
                btn.disabled = true;
                const mins = Math.floor(lockoutSec / 60);
                const secs = lockoutSec % 60;
                btn.textContent = `可提交: ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                btn.className = 'nav-btn nav-submit';
                btn.style.opacity = '0.5';
                btn.style.cursor = 'not-allowed';
            } else {
                btn.disabled = false;
                btn.textContent = '提交试卷';
                btn.className = 'nav-btn nav-submit';
                btn.style.opacity = '';
                btn.style.cursor = '';
            }
        }

        // Helper: show submitted page and hide exam UI (called from anti-cheat)
        function showSubmittedPage() {
            clearInterval(timerInterval);
            clearInterval(autoSaveInterval);
            document.getElementById('questionArea').style.display = 'none';
            document.getElementById('examToolbar').style.display = 'none';
            document.querySelector('.sidebar').style.display = 'none';
            document.querySelector('.header').style.display = 'none';
            document.getElementById('attachBar').classList.remove('show');
            document.getElementById('aiChatPanel').classList.remove('show');
            clearAiChat();  // v4.4: Clean up AI credentials and chat history
            document.getElementById('submittedPage').classList.add('show');
        }

        // Anti-cheat — Enhanced with server-side tab switch tracking
        function setupStrictAntiCheat() {
            let tabSwitchCount = 0;
            let tabSwitchWarningShown = false;

            document.addEventListener('visibilitychange', function() {
                if (document.hidden && !examSubmitted && !examTerminated) {
                    tabSwitchCount++;
                    // Save to server
                    fetch(API + '/exam/session/' + sessionId + '/tab-switch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ count: tabSwitchCount })
                    }).then(r => r.json()).then(data => {
                        if (data.terminated) {
                            examSubmitted = true;
                            showSubmittedPage();
                            showToast('考试因切屏超过3次自动提交', 'error');
                        } else {
                            alert('切屏警告 (' + tabSwitchCount + '/3)\n请勿离开考试页面，超过3次将自动交卷！');
                        }
                    }).catch(() => {
                        alert('切屏警告 (' + tabSwitchCount + '/3)');
                    });
                }
            });
        }

        // v5.0: Conditional anti-cheat - bound only when enabled in settings
        let antiCheatKeysBound = { copy: false, screenshot: false };

        function setupBanCopy() {
            if (antiCheatKeysBound.copy) return;
            antiCheatKeysBound.copy = true;

            document.addEventListener('keydown', banCopyKeydown);
            document.addEventListener('copy', banCopyEvent);
            document.addEventListener('cut', banCopyEvent);
            document.addEventListener('contextmenu', banContextMenu);
        }

        function setupBanScreenshot() {
            if (antiCheatKeysBound.screenshot) return;
            antiCheatKeysBound.screenshot = true;

            document.addEventListener('keydown', banScreenshotKeydown);
            document.addEventListener('keyup', banScreenshotKeyup);
        }

        function banCopyKeydown(e) {
            if ((e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'x' || e.key === 'a'))) {
                e.preventDefault();
                showToast('该操作已被禁止', 'warning');
                return false;
            }
        }

        function banCopyEvent(e) {
            e.preventDefault();
            showToast('复制已被禁止', 'warning');
            return false;
        }

        function banContextMenu(e) {
            e.preventDefault();
        }

        function banScreenshotKeydown(e) {
            if (e.key === 'PrintScreen') {
                e.preventDefault();
                showToast('截屏已被禁止', 'warning');
                return false;
            }
            // Block Win+Shift+S
            if (e.key === 'S' && e.shiftKey && e.metaKey) {
                e.preventDefault();
                showToast('截屏已被禁止', 'warning');
                return false;
            }
            // Block Ctrl+PrtSc
            if (e.key === 'PrintScreen' && e.ctrlKey) {
                e.preventDefault();
                showToast('截屏已被禁止', 'warning');
                return false;
            }
            // Block Ctrl+Shift+S (some tools use this)
            if (e.key === 'S' && e.shiftKey && e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                showToast('截屏已被禁止', 'warning');
                return false;
            }
        }

        function banScreenshotKeyup(e) {
            if (e.key === 'PrintScreen') {
                e.preventDefault();
                showToast('截屏已被禁止', 'warning');
                return false;
            }
            // Block Win+Shift+S (keyup)
            if (e.key === 'S' && e.shiftKey && e.metaKey) {
                e.preventDefault();
                showToast('截屏已被禁止', 'warning');
                return false;
            }
            // Block Ctrl+PrtSc (keyup)
            if (e.key === 'PrintScreen' && e.ctrlKey) {
                e.preventDefault();
                showToast('截屏已被禁止', 'warning');
                return false;
            }
            // Block Ctrl+Shift+S (keyup)
            if (e.key === 'S' && e.shiftKey && e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                showToast('截屏已被禁止', 'warning');
                return false;
            }
        }

        // F12 / dev tools are always blocked regardless of setting
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) ||
                (e.ctrlKey && e.key.toLowerCase() === 'u')) {
                e.preventDefault();
                showToast('禁止使用开发者工具', 'warning');
            }
        });

        // v4.2: Per-question Stata execution
        function saveStataState(qId) {
            if (!stataAnswers[qId]) stataAnswers[qId] = {};
            stataAnswers[qId].stata_code = document.getElementById('stataCode_' + qId)?.value || '';

        }

        async function executeQuestionStata(qId) {
            saveStataState(qId);
            const cmd = stataAnswers[qId].stata_code.trim();
            if (!cmd) { showToast('请输入Stata命令', 'warning'); return; }
            const output = document.getElementById('stataOutput_' + qId);
            output.style.display = 'block';
            output.textContent = '正在执行...';
            try {
                const res = await fetch(API + '/stata/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd, exam_id: examIdForImages || examIdParam, session_id: sessionId })
                });
                const data = await res.json();
                if (data.ok) {
                    stataAnswers[qId].stata_output = data.output || '执行完成（无输出）';
                    output.textContent = stataAnswers[qId].stata_output;
                } else {
                    output.textContent = '错误: ' + (data.error || '执行失败');
                }
            } catch(e) {
                output.textContent = '网络错误: ' + e.message;
            }
        }

        // v5.2: Per-question Python execution
        function savePythonState(qId) {
            if (!pythonAnswers[qId]) pythonAnswers[qId] = {};
            pythonAnswers[qId].python_code = document.getElementById('pythonCode_' + qId)?.value || '';
        }

        async function executeQuestionPython(qId) {
            savePythonState(qId);
            const code = pythonAnswers[qId].python_code.trim();
            if (!code) { showToast('请输入Python代码', 'warning'); return; }
            const output = document.getElementById('pythonOutput_' + qId);
            output.style.display = 'block';
            output.textContent = '正在执行...';
            try {
                const res = await fetch(API + '/python/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, exam_id: examIdForImages || examIdParam, session_id: sessionId })
                });
                const data = await res.json();
                if (data.ok) {
                    pythonAnswers[qId].python_output = data.output || '执行完成（无输出）';
                    output.textContent = pythonAnswers[qId].python_output;
                } else {
                    output.textContent = '错误: ' + (data.error || '执行失败');
                }
            } catch(e) {
                output.textContent = '网络错误: ' + e.message;
            }
        }

        // v3.0: Check termination
        async function checkTerminated() {
            if (!sessionId || examSubmitted || examTerminated) return;
            try {
                const res = await fetch(`${API}/exam/session/${sessionId}/status`);
                const data = await res.json();
                if (data.terminated || data.status === 'submitted') {
                    examTerminated = true;
                    clearInterval(timerInterval);
                    clearInterval(autoSaveInterval);
                    closeAIWindow();
                    clearAiChat();
                    document.getElementById('questionArea').style.display = 'none';
                    document.getElementById('examToolbar').style.display = 'none';
                    document.querySelector('.sidebar').style.display = 'none';
                    document.getElementById('attachBar').classList.remove('show');
                    document.getElementById('aiChatPanel').classList.remove('show');
                    if (data.terminated) {
                        document.getElementById('terminatedReason').textContent =
                            '你的考试已被老师终止，请联系老师。';
                    }
                    document.getElementById('terminatedPage').classList.add('show');
                }
            } catch (e) {}
        }

        // AI iframe popup (web-based AI, available to all students)
        let aiOpen = false;
        let aiIframePlatform = 'doubao';

        function toggleAI() {
            if (document.getElementById('aiToggleBtn').disabled) return;
            if (!aiOpen) {
                // Open Doubao directly, no platform picker
                openDoubaoWindow();
            } else {
                closeAIWindow();
            }
        }

        function openDoubaoWindow() {
            aiOpen = true;
            aiIframePlatform = 'doubao';
            const popup = document.getElementById('aiPopup');
            const btn = document.getElementById('aiToggleBtn');
            document.getElementById('aiPopupTitle').textContent = '豆包对话';
            popup.classList.add('show');
            document.querySelector('.main').classList.add('ai-popup-open');
            btn.classList.add('active');
            btn.textContent = '关闭 doubao';
            document.getElementById('aiFrame').src = 'https://www.doubao.com/chat/';
        }

        function closeAIWindow() {
            aiOpen = false;
            document.getElementById('aiPopup').classList.remove('show');
            document.querySelector('.main').classList.remove('ai-popup-open');
            const btn = document.getElementById('aiToggleBtn');
            btn.classList.remove('active');
            btn.textContent = '豆包对话';
            document.getElementById('aiFrame').src = 'about:blank';
        }

        // v4.4: AI Chat panel
        let aiChatOpen = false;

        function toggleAiChat() {
            if (document.getElementById('aiChatBtn').disabled) return;
            aiChatOpen = !aiChatOpen;
            const panel = document.getElementById('aiChatPanel');
            const btn = document.getElementById('aiChatBtn');
            if (aiChatOpen) {
                panel.classList.add('show');
                btn.classList.add('active');
                document.getElementById('aiChatTitle').textContent =
                    'AI 对话 — ' + (hasAiCredentials ? aiPlatform : '未提供 API Key');
            } else {
                closeAiChatPanel();
            }
        }

        function closeAiChatPanel() {
            aiChatOpen = false;
            document.getElementById('aiChatPanel').classList.remove('show');
            const btn = document.getElementById('aiChatBtn');
            btn.classList.remove('active');
        }

        async function sendAiMessage() {
            const input = document.getElementById('aiChatInput');
            const msg = input.value.trim();
            if (!msg) return;

            if (!hasAiCredentials) {
                // No API key: ignore silently
                input.value = '';
                showToast('未提供 API Key，AI 对话不可用', 'warning');
                return;
            }

            input.value = '';
            const sendBtn = document.getElementById('aiChatSendBtn');
            sendBtn.disabled = true;

            // Add user message to chat
            aiChatHistory.push({ role: 'user', content: msg });
            renderAiChat();

            // Show typing indicator
            const container = document.getElementById('aiChatMessages');
            container.innerHTML += '<div class="ai-chat-msg ai" id="aiTyping"><div class="content" style="color:var(--text-tertiary);">思考中...</div></div>';
            container.scrollTop = container.scrollHeight;

            try {
                const res = await fetch(`${API}/ai/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        platform: aiPlatform,
                        api_key: aiApiKey,
                        messages: aiChatHistory
                    })
                });
                const data = await res.json();

                // Remove typing indicator
                const typingEl = document.getElementById('aiTyping');
                if (typingEl) typingEl.remove();

                if (data.ok) {
                    aiChatHistory.push({ role: 'assistant', content: data.content });
                } else {
                    aiChatHistory.push({ role: 'assistant', content: '错误: ' + (data.error || '请求失败') });
                }
                renderAiChat();
            } catch (e) {
                const typingEl = document.getElementById('aiTyping');
                if (typingEl) typingEl.remove();
                aiChatHistory.push({ role: 'assistant', content: '网络错误，请重试' });
                renderAiChat();
            }

            sendBtn.disabled = false;
            document.getElementById('aiChatInput').focus();
        }

        function renderAiChat() {
            const container = document.getElementById('aiChatMessages');
            if (aiChatHistory.length === 0) {
                container.innerHTML = '<div style="color:var(--text-tertiary);text-align:center;margin-top:40px;">输入问题，与 AI 对话</div>';
                return;
            }
            container.innerHTML = aiChatHistory.map(h =>
                `<div class="ai-chat-msg ${h.role}" style="${h.role==='user'?'margin-left:auto;text-align:right':'margin-right:auto'}">
                    <div class="sender">${h.role === 'user' ? '你' : 'AI'}</div>
                    <div class="content">${escapeHtml(h.content)}</div>
                </div>`
            ).join('');
            container.scrollTop = container.scrollHeight;
        }

        function clearAiChat() {
            aiChatHistory = [];
            document.getElementById('aiChatInput').value = '';
            closeAiChatPanel();
            document.getElementById('aiChatPanel').classList.remove('show');
            document.getElementById('aiChatBtn').classList.remove('active');
            aiChatOpen = false;
        }

        window.addEventListener('beforeunload', () => {
            if (sessionId && !examSubmitted) {
                navigator.sendBeacon(`${API}/exam/session/${sessionId}/save`, JSON.stringify({ answers: buildFinalAnswers() }));
            }
        });

        loadExam();
    </script>
