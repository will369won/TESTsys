<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生登录 - AI智能考试系统</title>
    <style>
        :root {
            --bg-root: #faf9f7;
            --bg-card: #ffffff;
            --bg-hover: #f5f3f0;
            --bg-input: #ffffff;
            --border-default: #e8e5e0;
            --border-hover: #d4cfc8;
            --text-primary: #1a1816;
            --text-secondary: #6b6560;
            --text-tertiary: #9e9892;
            --accent: #1a1816;
            --accent-dim: rgba(26,24,22,0.06);
            --success: #4a8c5c;
            --success-dim: rgba(74,140,92,0.08);
            --warning: #c4904a;
            --warning-dim: rgba(196,144,74,0.08);
            --error: #c45a5a;
            --error-dim: rgba(196,90,90,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-root);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-default);
            padding: 48px 40px 40px;
            max-width: 440px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: var(--text-primary);
            font-size: 1.5em;
            margin-bottom: 4px;
            font-weight: 700;
        }
        .back-link {
            text-align: center;
            margin-bottom: 20px;
        }
        .back-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85em;
        }
        .back-link a:hover { color: var(--text-primary); }
        .login-box {
            background: var(--bg-hover);
            border-radius: var(--radius-md);
            padding: 32px 28px;
            border: 1px solid var(--border-default);
        }
        .login-box h2 {
            color: var(--text-primary);
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.05em;
            font-weight: 600;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; margin-bottom: 5px;
            color: var(--text-secondary); font-weight: 500; font-size: 0.88em;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 0.95em;
            transition: border-color 0.2s;
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--border-hover);
        }
        .form-group input::placeholder { color: var(--text-tertiary); }
        .btn {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            background: var(--bg-card);
            color: var(--text-primary);
            margin-top: 8px;
        }
        .btn:hover:not(:disabled) {
            background: var(--bg-hover);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .exam-info-card {
            display: none;
            background: var(--bg-hover);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border-default);
            text-align: center;
        }
        .exam-info-card.show { display: block; }
        .exam-info-card .title { font-weight: 600; color: var(--text-primary); font-size: 0.95em; }
        .exam-info-card .meta { font-size: 0.82em; color: var(--text-secondary); margin-top: 4px; }

        .error-message {
            color: var(--error); text-align: center; margin-top: 12px;
            font-size: 0.85em; display: none;
        }

        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 14px 24px; border-radius: var(--radius-sm); color: white;
            font-size: 0.95em; z-index: 9999;
            opacity: 0; transition: opacity 0.3s, transform 0.3s;
            transform: translateY(-8px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-error { background: var(--error); }
        .toast-success { background: var(--success); }
        .toast-warning { background: var(--warning); color: white; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }
    </style>
</head>
<body>
    <div class="container">
        <h1>学生登录</h1>
        <div class="back-link"><a href="login.html">← 返回首页</a></div>
        <div class="login-box">
            <h2>输入信息进入考试</h2>

            <!-- Exam info card -->
            <div class="exam-info-card" id="examInfoCard">
                <div class="title" id="examInfoTitle"></div>
                <div class="meta" id="examInfoMeta"></div>
            </div>

            <form id="studentLoginForm">
                <div class="form-group">
                    <label>试卷编号</label>
                    <input type="text" id="examNumber" placeholder="请输入教师提供的4位试卷编号" maxlength="4" required autofocus>
                </div>
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" id="studentId" placeholder="请输入学号" required>
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="studentName" placeholder="请输入姓名" required>
                </div>
                <!-- API Key (optional) -->
                <div class="form-group" style="margin-top:12px;">
                    <label>AI 对话（选填）</label>
                    <select id="aiPlatform" style="width:100%;padding:9px 14px;border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:0.95em;margin-bottom:6px;background:var(--bg-input);color:var(--text-primary);">
                        <option value="">不使用 AI 对话</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="qianwen">千问</option>
                    </select>
                    <input type="text" id="aiApiKey" placeholder="API Key（选填）" style="width:100%;padding:11px 14px;border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:0.95em;color:var(--text-primary);background:var(--bg-input);display:none;">
                </div>
                <button type="submit" class="btn" id="loginBtn">进入考试系统</button>
                <div class="error-message" id="studentError"></div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';
        let currentExamId = null;

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // Auto-lookup exam when exam number is entered (4 digits)
        let examLookupTimeout = null;
        document.getElementById('examNumber').addEventListener('input', function() {
            clearTimeout(examLookupTimeout);
            const num = this.value.trim();
            if (num.length === 4 && /^\d{4}$/.test(num)) {
                examLookupTimeout = setTimeout(() => lookupExam(num), 300);
            } else {
                document.getElementById('examInfoCard').classList.remove('show');
                currentExamId = null;
                document.getElementById('loginBtn').disabled = false;
            }
        });

        async function lookupExam(examNumber) {
            const infoCard = document.getElementById('examInfoCard');
            const infoTitle = document.getElementById('examInfoTitle');
            const infoMeta = document.getElementById('examInfoMeta');

            try {
                const res = await fetch(`${API}/exam/by-number/${examNumber}`);
                if (!res.ok) {
                    infoCard.classList.remove('show');
                    currentExamId = null;
                    return;
                }
                const data = await res.json();
                currentExamId = data.exam_id;

                // Show exam info
                infoTitle.textContent = `${data.title} (${data.exam_number})`;
                let metaText = `时长: ${data.exam_duration || '未设置'} 分钟`;
                if (data.exam_start_time) {
                    metaText += ` | 开考: ${data.exam_start_time}`;
                }
                infoMeta.textContent = metaText;
                infoCard.classList.add('show');
            } catch (e) {
                // Ignore lookup errors
                infoCard.classList.remove('show');
            }
        }

        // Toggle API Key input visibility
        document.getElementById('aiPlatform').addEventListener('change', function() {
            const keyInput = document.getElementById('aiApiKey');
            if (this.value) {
                keyInput.style.display = 'block';
            } else {
                keyInput.style.display = 'none';
                keyInput.value = '';
            }
        });

        // Login form submit
        document.getElementById('studentLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const examNumber = document.getElementById('examNumber').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            const studentName = document.getElementById('studentName').value.trim();
            const errorDiv = document.getElementById('studentError');
            errorDiv.style.display = 'none';

            if (!examNumber || examNumber.length !== 4) {
                errorDiv.textContent = '请输入正确的4位试卷编号';
                errorDiv.style.display = 'block';
                return;
            }

            const aiPlatform = document.getElementById('aiPlatform').value;
            const aiApiKey = document.getElementById('aiApiKey').value.trim();

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '登录中...';

            try {
                const response = await fetch(`${API}/student/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: studentId,
                        name: studentName,
                        exam_number: examNumber
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    showToast('登录成功，正在进入考试...', 'success');
                    setTimeout(() => {
                        let coverUrl = `exam-cover.html?student_id=${encodeURIComponent(studentId)}&name=${encodeURIComponent(studentName)}&exam_id=${data.exam_id}`;
                        if (aiPlatform && aiApiKey) {
                            coverUrl += `&ai_platform=${encodeURIComponent(aiPlatform)}&ai_key=${encodeURIComponent(aiApiKey)}`;
                        }
                        window.location.href = coverUrl;
                    }, 500);
                } else {
                    errorDiv.textContent = data.error || '登录失败';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = '进入考试系统';
                }
            } catch (error) {
                errorDiv.textContent = '网络错误，请检查后端是否运行';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '进入考试系统';
            }
        });
    </script>
</body>
</html>
