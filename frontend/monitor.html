<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试监视 - AI智能考试系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif; background: linear-gradient(135deg, #f0f4f8 0%, #e8ecf1 100%); min-height: 100vh; }
        .header { background: linear-gradient(135deg, #4A90D9 0%, #357ABD 100%); color: white; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 1.3em; font-weight: 600; }
        .header .nav-btns { display: flex; gap: 10px; }
        .header .nav-btns button { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: all 0.2s; backdrop-filter: blur(4px); }
        .header .nav-btns button:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card { background: rgba(255,255,255,0.80); backdrop-filter: blur(16px); border-radius: 16px; padding: 16px 24px; box-shadow: 0 2px 12px rgba(74,144,217,0.06), 0 1px 3px rgba(0,0,0,0.03); border: 1px solid rgba(255,255,255,0.7); flex: 1; min-width: 150px; text-align: center; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .num { font-size: 1.8em; font-weight: bold; }
        .stat-card .label { font-size: 0.85em; color: #64748b; margin-top: 4px; font-weight: 500; }
        .stat-total .num { color: #4A90D9; }
        .stat-progress .num { color: #52c41a; }
        .stat-terminated .num { color: #ff4d4f; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
        .student-card { background: rgba(255,255,255,0.80); backdrop-filter: blur(16px); border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(74,144,217,0.06), 0 1px 3px rgba(0,0,0,0.03); cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid transparent; position: relative; }
        .student-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(74,144,217,0.12); }
        .student-card.status-progress { border-color: rgba(82,196,26,0.4); background: rgba(255,255,255,0.78); }
        .student-card.status-terminated { border-color: rgba(255,77,79,0.4); background: rgba(255,255,255,0.78); }
        .student-card .student-id { font-size: 1.05em; font-weight: bold; color: #1e293b; margin-bottom: 6px; }
        .student-card .student-name { font-size: 0.88em; color: #64748b; margin-bottom: 8px; }
        .student-card .exam-title { font-size: 0.78em; color: #94a3b8; margin-bottom: 4px; }
        .student-card .start-time { font-size: 0.78em; color: #94a3b8; }
        .student-card .status-badge { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 12px; font-size: 0.75em; font-weight: 600; backdrop-filter: blur(4px); }
        .student-card.status-progress .status-badge { background: rgba(82,196,26,0.85); color: white; }
        .student-card.status-terminated .status-badge { background: rgba(255,77,79,0.85); color: white; }
        .empty-msg { text-align: center; color: #94a3b8; padding: 60px 20px; font-size: 1.05em; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); border-radius: 16px; padding: 30px; max-width: 400px; width: 90%; text-align: center; border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 8px 40px rgba(0,0,0,0.10); }
        .modal-box h2 { margin-bottom: 16px; color: #1e293b; }
        .modal-box p { color: #64748b; margin-bottom: 24px; }
        .modal-btns { display: flex; gap: 12px; justify-content: center; }
        .modal-btn { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95em; font-weight: 500; transition: all 0.2s; }
        .modal-btn:hover { transform: translateY(-1px); }
        .modal-cancel { background: rgba(226,232,240,0.8); color: #475569; }
        .modal-cancel:hover { background: rgba(203,213,225,0.8); }
        .modal-danger { background: #ff4d4f; color: white; }
        .modal-danger:hover { box-shadow: 0 4px 12px rgba(255,77,79,0.3); }
        .modal-success { background: #52c41a; color: white; }
        .modal-success:hover { box-shadow: 0 4px 12px rgba(82,196,26,0.3); }
        .toast { position: fixed; top: 20px; right: 20px; padding: 14px 24px; border-radius: 12px; color: white; font-size: 0.95em; z-index: 9999; opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(-8px); backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: rgba(82,196,26,0.9); }
        .toast-error { background: rgba(255,77,79,0.9); }
        .refresh-btn { background: #4A90D9; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: all 0.2s; }
        .refresh-btn:hover { background: #357ABD; transform: translateY(-1px); }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📡 考试监视面板</h1>
        <div class="nav-btns">
            <button onclick="window.location.href='teacher.html'">返回教师管理</button>
        </div>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat-card stat-total">
                <div class="num" id="totalCount">0</div>
                <div class="label">在线考试</div>
            </div>
            <div class="stat-card stat-progress">
                <div class="num" id="progressCount">0</div>
                <div class="label">考试中</div>
            </div>
            <div class="stat-card stat-terminated">
                <div class="num" id="terminatedCount">0</div>
                <div class="label">已终止</div>
            </div>
        </div>

        <div class="toolbar">
            <span style="color: #666; font-size: 0.9em;">点击学生卡片可操作</span>
            <button class="refresh-btn" onclick="loadMonitor()">🔄 刷新</button>
        </div>

        <div class="grid" id="studentGrid">
            <div class="empty-msg">加载中...</div>
        </div>
    </div>

    <!-- 操作确认弹窗 -->
    <div class="modal-overlay" id="actionModal">
        <div class="modal-box">
            <h2 id="actionTitle">确认操作</h2>
            <p id="actionMsg"></p>
            <div class="modal-btns">
                <button class="modal-btn modal-cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn modal-danger" id="actionConfirm" onclick="doAction()">确认</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = 'http://localhost:5000/api';
        let currentSessionId = null;
        let currentAction = null;

        async function checkLogin() {
            try {
                const res = await fetch(`${API}/teacher/check`);
                const data = await res.json();
                if (!data.logged_in) window.location.href = 'login.html';
            } catch (e) { window.location.href = 'login.html'; }
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function loadMonitor() {
            try {
                const res = await fetch(`${API}/teacher/monitor`);
                const students = await res.json();

                document.getElementById('totalCount').textContent = students.length;
                document.getElementById('progressCount').textContent = students.filter(s => !s.is_terminated).length;
                document.getElementById('terminatedCount').textContent = students.filter(s => s.is_terminated).length;

                const grid = document.getElementById('studentGrid');
                if (students.length === 0) {
                    grid.innerHTML = '<div class="empty-msg">暂无在线考试的学生</div>';
                    return;
                }

                grid.innerHTML = students.map(s => `
                    <div class="student-card ${s.is_terminated ? 'status-terminated' : 'status-progress'}"
                         onclick="showAction(${s.session_id}, '${s.student_id}', '${s.student_name}', ${s.is_terminated})">
                        <span class="status-badge">${s.is_terminated ? '已终止' : '考试中'}</span>
                        <div class="student-id">${s.student_id}</div>
                        <div class="student-name">${s.student_name}</div>
                        <div class="exam-title">${s.title}</div>
                        <div class="start-time">开始: ${s.start_time}</div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('studentGrid').innerHTML = '<div class="empty-msg">加载失败</div>';
            }
        }

        function showAction(sessionId, studentId, studentName, isTerminated) {
            currentSessionId = sessionId;
            currentAction = isTerminated ? 'resume' : 'terminate';

            if (isTerminated) {
                document.getElementById('actionTitle').textContent = '恢复考试？';
                document.getElementById('actionMsg').textContent = `是否同意学生 ${studentName}（${studentId}）继续考试？`;
                document.getElementById('actionConfirm').textContent = '同意继续';
                document.getElementById('actionConfirm').className = 'modal-btn modal-success';
            } else {
                document.getElementById('actionTitle').textContent = '终止考试？';
                document.getElementById('actionMsg').textContent = `是否终止学生 ${studentName}（${studentId}）的考试？`;
                document.getElementById('actionConfirm').textContent = '终止考试';
                document.getElementById('actionConfirm').className = 'modal-btn modal-danger';
            }
            document.getElementById('actionModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('actionModal').classList.remove('show');
        }

        async function doAction() {
            closeModal();
            try {
                let endpoint = currentAction === 'terminate' ? 'terminate' : 'resume';
                const res = await fetch(`${API}/teacher/session/${currentSessionId}/${endpoint}`, { method: 'POST' });
                const data = await res.json();
                if (data.ok) {
                    showToast(data.message);
                    loadMonitor();
                } else {
                    showToast(data.error || '操作失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        // 自动刷新（每5秒）
        setInterval(loadMonitor, 5000);

        checkLogin();
        loadMonitor();
    </script>
</body>
</html>
