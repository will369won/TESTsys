<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试封面 - AI智能考试系统</title>
    <style>
        :root {
            --bg-root: #faf9f7;
            --bg-card: #ffffff;
            --bg-hover: #f5f3f0;
            --bg-input: #ffffff;
            --border-default: #e8e5e0;
            --border-hover: #d4cfc8;
            --text-primary: #1a1816;
            --text-secondary: #6b6560;
            --text-tertiary: #9e9892;
            --accent: #1a1816;
            --accent-dim: rgba(26,24,22,0.06);
            --success: #4a8c5c;
            --success-dim: rgba(74,140,92,0.08);
            --warning: #c4904a;
            --warning-dim: rgba(196,144,74,0.08);
            --error: #c45a5a;
            --error-dim: rgba(196,90,90,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-root);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-default);
            padding: 48px 40px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: var(--text-primary);
            font-size: 1.4em;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .exam-title {
            font-size: 1.1em;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 24px;
        }
        .cover-field { display:flex; justify-content:space-between; padding:6px 0; font-size:0.92em; border-bottom:1px solid var(--border-default); }
        .cover-field:last-child { border-bottom:none; }
        .cover-field .label { color:var(--text-secondary); }
        .cover-field .value { font-weight:600; color:var(--text-primary); }

        .info-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 18px;
            background: var(--bg-hover);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-default);
            font-size: 0.92em;
        }
        .info-row .label { color: var(--text-secondary); }
        .info-row .value { font-weight: 600; color: var(--text-primary); }

        .current-time {
            font-size: 1.6em;
            font-weight: 700;
            color: var(--text-primary);
            margin: 20px 0;
            letter-spacing: 1px;
        }
        .time-label {
            font-size: 0.82em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .status-text {
            font-size: 0.92em;
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
        }
        .status-text.waiting { background: var(--warning-dim); color: var(--warning); border: 1px solid var(--warning); }
        .status-text.ready { background: var(--success-dim); color: var(--success); border: 1px solid var(--success); }
        .status-text.started { background: var(--accent-dim); color: var(--text-primary); border: 1px solid var(--border-default); }

        .btn {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .btn:hover:not(:disabled) {
            background: var(--bg-hover);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn.ongoing {
            background: var(--success);
            color: #fff;
            border: none;
        }
        .btn.ongoing:hover:not(:disabled) {
            background: #3d7a4e;
        }

        .student-info {
            font-size: 0.88em;
            color: var(--text-secondary);
            margin-bottom: 16px;
            padding: 10px;
            background: var(--bg-hover);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-default);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .blink { animation: blink 1.5s infinite; }
    </style>
</head>
<body>
    <div class="container">
        <div class="student-info" id="studentInfo"></div>

        <div class="cover-fields" id="coverFields" style="text-align:left;margin-bottom:16px;padding:14px;background:var(--bg-hover);border-radius:var(--radius-sm);border:1px solid var(--border-default);">
            <div class="cover-field"><span class="label">考试标题：</span><span class="value" id="cExamTitle"></span></div>
            <div class="cover-field"><span class="label">学校：</span><span class="value" id="cSchool"></span></div>
            <div class="cover-field"><span class="label">学院：</span><span class="value" id="cCollege"></span></div>
            <div class="cover-field"><span class="label">班级：</span><span class="value" id="cClass"></span></div>
            <div class="cover-field"><span class="label">年级：</span><span class="value" id="cGrade"></span></div>
            <div class="cover-field"><span class="label">专业：</span><span class="value" id="cMajor"></span></div>
        </div>

        <div class="info-cards">
            <div class="info-row">
                <span class="label">考试时长</span>
                <span class="value" id="durationDisplay">-- 分钟</span>
            </div>
            <div class="info-row">
                <span class="label">考试时间</span>
                <span class="value" id="timeRange">-- ~ --</span>
            </div>
        </div>

        <div class="time-label">当前时间</div>
        <div class="current-time" id="currentTime">--:--:--</div>

        <div id="examNoticeBox" style="text-align:left;margin-bottom:16px;padding:14px;background:var(--bg-hover);border-radius:var(--radius-sm);border:1px solid var(--border-default);display:none;">
            <div style="font-weight:600;color:var(--accent);margin-bottom:8px;">考试须知</div>
            <div id="examNoticeContent" style="font-size:0.88em;color:var(--text-secondary);line-height:1.7;white-space:pre-line;"></div>
        </div>

        <div class="status-text waiting" id="statusText">等待开考...</div>

        <button class="btn" id="startBtn" disabled onclick="startExam()">开始考试</button>
    </div>

    <script>
        const API = '/api';
        const params = new URLSearchParams(window.location.search);
        const studentId = params.get('student_id') || '';
        const studentName = params.get('name') || '';
        const examId = params.get('exam_id') || '';
        const aiPlatform = params.get('ai_platform') || '';
        const aiApiKey = params.get('ai_key') || '';

        let examInfo = null;
        let clockInterval = null;
        let countdownInterval = null;

        document.getElementById('studentInfo').textContent = `👤 ${studentName} (${studentId})`;

        async function loadExamInfo() {
            try {
                // Get exam info from student endpoint
                const res = await fetch(`${API}/exam/${examId}`);
                const data = await res.json();

                examInfo = data;

                // Populate cover info fields
                document.getElementById('cExamTitle').textContent = data.exam_title || data.title || '';
                document.getElementById('cSchool').textContent = data.school || '';
                document.getElementById('cCollege').textContent = data.college || '';
                document.getElementById('cClass').textContent = data.class_name || '';
                document.getElementById('cGrade').textContent = data.grade || '';
                document.getElementById('cMajor').textContent = data.major || '';

                // Show exam notice
                if (data.exam_notice) {
                    document.getElementById('examNoticeContent').textContent = data.exam_notice;
                    document.getElementById('examNoticeBox').style.display = 'block';
                }

                document.getElementById('durationDisplay').textContent = `${data.exam_duration || '--'} 分钟`;

                if (data.exam_start_time) {
                    // Calculate actual end time
                    const startDt = new Date(data.exam_start_time.replace(' ', 'T'));
                    const durationMin = parseInt(data.exam_duration) || 0;
                    if (durationMin > 0) {
                        const endDt = new Date(startDt.getTime() + durationMin * 60000);
                        const fmt = (d) => {
                            const pad = (n) => String(n).padStart(2, '0');
                            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
                        };
                        document.getElementById('timeRange').textContent = `${data.exam_start_time} ~ ${fmt(endDt)}`;
                    } else {
                        document.getElementById('timeRange').textContent = `${data.exam_start_time} ~ --`;
                    }
                }

                // Check if already submitted
                try {
                    const checkRes = await fetch(API + '/exam/' + examId + '/session/check?student_id=' + studentId);
                    const checkData = await checkRes.json();
                    if (checkData.submitted) {
                        document.getElementById('statusText').className = 'status-text waiting';
                        document.getElementById('statusText').textContent = '您已提交过该试卷，无法重复参加';
                        document.getElementById('startBtn').disabled = true;
                        document.getElementById('startBtn').textContent = '已提交';
                        return;
                    }
                } catch(e) {}

                updateStatus();
                if (clockInterval) clearInterval(clockInterval);
                clockInterval = setInterval(updateClock, 1000);
                updateClock(); // immediate

                if (countdownInterval) clearInterval(countdownInterval);
                countdownInterval = setInterval(updateStatus, 5000);
                updateStatus(); // immediate
            } catch (e) {
                document.getElementById('cExamTitle').textContent = '加载失败，请检查网络';
            }
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('currentTime').textContent = `${h}:${m}:${s}`;
        }

        function updateStatus() {
            const statusText = document.getElementById('statusText');
            const startBtn = document.getElementById('startBtn');

            if (!examInfo || !examInfo.exam_start_time) {
                statusText.className = 'status-text waiting';
                statusText.textContent = '考试尚未配置开考时间';
                startBtn.disabled = true;
                startBtn.textContent = ' 开始考试';
                startBtn.className = 'btn';
                return;
            }

            const now = new Date();
            const startTime = new Date(examInfo.exam_start_time.replace(' ', 'T'));
            const diff = startTime - now;

            if (diff > 0) {
                // Not yet started
                const minutes = Math.floor(diff / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                statusText.className = 'status-text waiting';
                if (minutes > 0) {
                    statusText.textContent = `距离考试开始还有 ${minutes} 分钟 ${seconds} 秒`;
                } else {
                    statusText.textContent = `距离考试开始还有 ${seconds} 秒`;
                }
                startBtn.disabled = true;
                startBtn.textContent = ' 开始考试';
                startBtn.className = 'btn';
            } else {
                // Exam has started — check late start limit
                const lateLimit = examInfo.exam_late_start_limit || 0;
                if (lateLimit > 0) {
                    const deadline = new Date(startTime.getTime() + lateLimit * 60000);
                    if (now > deadline) {
                        // Past the late start deadline
                        statusText.className = 'status-text waiting';
                        statusText.textContent = `已超过开考限时（开考后${lateLimit}分钟内允许进入），不允许参加考试`;
                        startBtn.disabled = true;
                        startBtn.textContent = '已超时';
                        startBtn.className = 'btn';
                        return;
                    }
                }
                statusText.className = 'status-text ready';
                statusText.textContent = '考试已开始，点击下方按钮进入';
                startBtn.disabled = false;
                startBtn.textContent = ' 开始考试 →';
                startBtn.className = 'btn ongoing';
            }
        }

        async function startExam() {
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.textContent = '正在进入...';

            try {
                const res = await fetch(`${API}/exam/${examId}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: studentId,
                        student_name: studentName
                    })
                });
                const data = await res.json();
                if (data.ok) {
                    // Navigate to exam page, pass AI params through
                    let url = `exam.html?student_id=${encodeURIComponent(studentId)}&name=${encodeURIComponent(studentName)}&exam_id=${examId}&session_id=${data.session_id}`;
                    if (aiPlatform && aiApiKey) {
                        url += `&ai_platform=${encodeURIComponent(aiPlatform)}&ai_key=${encodeURIComponent(aiApiKey)}`;
                    }
                    window.location.href = url;
                } else {
                    showToast(data.error || '无法进入考试', 'error');
                    btn.disabled = false;
                    btn.textContent = ' 开始考试';
                }
            } catch (e) {
                showToast('网络错误，请检查连接后重试', 'error');
                btn.disabled = false;
                btn.textContent = ' 开始考试';
            }
        }

        function showToast(msg, type) {
            // Simple alert-based toast since this is a cover page
            alert(msg);
        }

        loadExamInfo();
    </script>
</body>
</html>
