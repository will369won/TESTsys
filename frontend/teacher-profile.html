<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息 - AI智能考试系统</title>
    <style>
        :root {
            --bg-root: #faf9f7;
            --bg-card: #ffffff;
            --bg-hover: #f5f3f0;
            --bg-input: #ffffff;
            --border-default: #e8e5e0;
            --border-hover: #d4cfc8;
            --text-primary: #1a1816;
            --text-secondary: #6b6560;
            --text-tertiary: #9e9892;
            --accent: #1a1816;
            --accent-dim: rgba(26,24,22,0.06);
            --success: #4a8c5c;
            --success-dim: rgba(74,140,92,0.08);
            --warning: #c4904a;
            --warning-dim: rgba(196,144,74,0.08);
            --error: #c45a5a;
            --error-dim: rgba(196,90,90,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-root);
            min-height: 100vh;
        }

        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-default);
            color: var(--text-primary);
            padding: 16px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 1.2em; font-weight: 600; letter-spacing: -0.2px; }
        .header button {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            color: var(--text-primary);
            padding: 7px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.88em;
            transition: all 0.15s;
        }
        .header button:hover { border-color: var(--border-hover); color: var(--text-primary); }

        .container { max-width: 600px; margin: 24px auto; padding: 0 18px; }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 18px;
            border: 1px solid var(--border-default);
        }
        .card h2 {
            color: var(--text-primary);
            margin-bottom: 16px;
            font-size: 1.1em;
            font-weight: 600;
            border-bottom: 1px solid var(--border-default);
            padding-bottom: 10px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9em;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 0.95em;
            transition: border-color 0.2s;
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--border-hover);
        }
        .form-group input:disabled {
            background: var(--bg-hover);
            color: var(--text-tertiary);
        }

        .btn {
            padding: 9px 22px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.92em;
            font-weight: 500;
            transition: all 0.15s;
        }
        .btn-primary { background: var(--accent-dim); color: var(--text-primary); border: 1px solid var(--border-default); }
        .btn-success { background: var(--success-dim); color: var(--success); border: 1px solid var(--border-default); }
        .btn-warning { background: var(--error-dim); color: var(--error); border: 1px solid var(--border-default); }
        .btn:hover:not(:disabled) { opacity: 0.85; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-group { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 14px 24px; border-radius: var(--radius-sm); color: white;
            font-size: 0.95em; z-index: 9999;
            opacity: 0; transition: opacity 0.3s, transform 0.3s;
            transform: translateY(-8px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--error); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
    </style>
</head>
<body>
    <div class="header">
        <h1>个人信息管理</h1>
        <button onclick="window.location.href='teacher.html'">← 返回教师管理</button>
    </div>

    <div class="container">
        <div class="card">
            <h2>个人资料</h2>
            <div class="form-group">
                <label>教师ID</label>
                <input type="text" id="teacherIdField" disabled>
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="usernameField" placeholder="输入新的用户名">
            </div>
            <div class="form-group">
                <label>学校</label>
                <input type="text" id="schoolField" placeholder="输入学校名称">
            </div>
            <div class="form-group">
                <label>新密码（留空则不修改）</label>
                <input type="password" id="passwordField" placeholder="输入新密码">
            </div>
            <div class="btn-group">
                <button class="btn btn-warning" onclick="window.location.href='teacher.html'">取消</button>
                <button class="btn btn-success" id="saveBtn" onclick="saveProfile()">确认修改</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';

        async function checkLogin() {
            try {
                const res = await fetch(`${API}/teacher/check`);
                const data = await res.json();
                if (!data.logged_in) window.location.href = 'login.html';
            } catch (e) { window.location.href = 'login.html'; }
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function loadProfile() {
            try {
                const res = await fetch(`${API}/teacher/profile`);
                const data = await res.json();
                if (data.ok) {
                    document.getElementById('teacherIdField').value = data.teacher_id || '';
                    document.getElementById('usernameField').value = data.username || '';
                    document.getElementById('schoolField').value = data.school || '';
                } else {
                    showToast(data.error || '加载失败', 'error');
                }
            } catch (e) {
                showToast('加载失败', 'error');
            }
        }

        async function saveProfile() {
            const username = document.getElementById('usernameField').value.trim();
            const school = document.getElementById('schoolField').value.trim();
            const newPassword = document.getElementById('passwordField').value;

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = '保存中...';

            try {
                const res = await fetch(`${API}/teacher/profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        school: school,
                        new_password: newPassword
                    })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast('个人信息已更新');
                    // Reload profile to show updated values
                    setTimeout(() => loadProfile(), 1000);
                } else {
                    showToast(data.error || '保存失败', 'error');
                }
            } catch (e) {
                showToast('网络错误', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '确认修改';
            }
        }

        checkLogin();
        loadProfile();
    </script>
</body>
</html>
