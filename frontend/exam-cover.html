<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试封面 - AI智能考试系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8ecf1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(74,144,217,0.10), 0 1px 4px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.7);
            padding: 48px 40px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        .exam-icon { font-size: 3.6em; margin-bottom: 16px; }
        h1 {
            color: #1a2332;
            font-size: 1.5em;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .exam-title {
            font-size: 1.2em;
            color: #4A90D9;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .cover-field { display:flex; justify-content:space-between; padding:6px 0; font-size:0.92em; border-bottom:1px solid rgba(226,232,240,0.4); }
        .cover-field:last-child { border-bottom:none; }
        .cover-field .label { color:#64748b; }
        .cover-field .value { font-weight:600; color:#1e293b; }

        .info-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(248,250,252,0.8);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.5);
            font-size: 0.92em;
        }
        .info-row .label { color: #64748b; }
        .info-row .value { font-weight: 600; color: #1e293b; }

        .current-time {
            font-size: 1.8em;
            font-weight: 700;
            color: #1e293b;
            margin: 20px 0;
            letter-spacing: 1px;
        }
        .time-label {
            font-size: 0.82em;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .status-text {
            font-size: 0.92em;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .status-text.waiting { background: rgba(255,193,7,0.12); color: #856404; border: 1px solid rgba(255,193,7,0.3); }
        .status-text.ready { background: rgba(82,196,26,0.12); color: #389e0d; border: 1px solid rgba(82,196,26,0.3); }
        .status-text.started { background: rgba(74,144,217,0.1); color: #357ABD; border: 1px solid rgba(74,144,217,0.2); }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, #4A90D9 0%, #357ABD 100%);
            color: white;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(74,144,217,0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn:active:not(:disabled) { transform: translateY(0) scale(0.97); }
        .btn.ongoing {
            background: linear-gradient(135deg, #52c41a, #389e0d);
        }
        .btn.ongoing:hover:not(:disabled) {
            box-shadow: 0 8px 24px rgba(82,196,26,0.3);
        }

        .student-info {
            font-size: 0.88em;
            color: #94a3b8;
            margin-bottom: 16px;
            padding: 10px;
            background: rgba(248,250,252,0.6);
            border-radius: 8px;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .blink { animation: blink 1.5s infinite; }
    </style>
</head>
<body>
    <div class="container">
        <div class="exam-icon">📄</div>

        <div class="student-info" id="studentInfo"></div>

        <!-- Exam info fields -->
        <div class="cover-fields" id="coverFields" style="text-align:left;margin-bottom:16px;padding:14px;background:rgba(248,250,252,0.7);border-radius:12px;border:1px solid rgba(255,255,255,0.5);">
            <div class="cover-field"><span class="label">考试标题：</span><span class="value" id="cExamTitle"></span></div>
            <div class="cover-field"><span class="label">学校：</span><span class="value" id="cSchool"></span></div>
            <div class="cover-field"><span class="label">学院：</span><span class="value" id="cCollege"></span></div>
            <div class="cover-field"><span class="label">班级：</span><span class="value" id="cClass"></span></div>
            <div class="cover-field"><span class="label">年级：</span><span class="value" id="cGrade"></span></div>
        </div>

        <div class="info-cards">
            <div class="info-row">
                <span class="label">📝 考试时长</span>
                <span class="value" id="durationDisplay">-- 分钟</span>
            </div>
            <div class="info-row">
                <span class="label">🕐 考试时间</span>
                <span class="value" id="timeRange">-- ~ --</span>
            </div>
        </div>

        <div class="time-label">当前时间</div>
        <div class="current-time" id="currentTime">--:--:--</div>

        <!-- Exam notice -->
        <div id="examNoticeBox" style="text-align:left;margin-bottom:16px;padding:14px;background:rgba(227,242,253,0.5);border-radius:12px;border:1px solid rgba(144,202,249,0.4);display:none;">
            <div style="font-weight:600;color:#1565c0;margin-bottom:8px;">📜 考试须知</div>
            <div id="examNoticeContent" style="font-size:0.88em;color:#334155;line-height:1.7;white-space:pre-line;"></div>
        </div>

        <div class="status-text waiting" id="statusText">⏳ 等待开考...</div>

        <button class="btn" id="startBtn" disabled onclick="startExam()">📝 开始考试</button>
    </div>

    <script>
        const API = '/api';
        const params = new URLSearchParams(window.location.search);
        const studentId = params.get('student_id') || '';
        const studentName = params.get('name') || '';
        const examId = params.get('exam_id') || '';

        let examInfo = null;
        let clockInterval = null;
        let countdownInterval = null;

        document.getElementById('studentInfo').textContent = `👤 ${studentName} (${studentId})`;

        async function loadExamInfo() {
            try {
                // Get exam info from student endpoint
                const res = await fetch(`${API}/exam/${examId}`);
                const data = await res.json();

                examInfo = data;

                // Populate cover info fields
                document.getElementById('cExamTitle').textContent = data.exam_title || data.title || '';
                document.getElementById('cSchool').textContent = data.school || '';
                document.getElementById('cCollege').textContent = data.college || '';
                document.getElementById('cClass').textContent = data.class_name || '';
                document.getElementById('cGrade').textContent = data.grade || '';

                // Show exam notice
                if (data.exam_notice) {
                    document.getElementById('examNoticeContent').textContent = data.exam_notice;
                    document.getElementById('examNoticeBox').style.display = 'block';
                }

                document.getElementById('durationDisplay').textContent = `${data.exam_duration || '--'} 分钟`;

                if (data.exam_start_time) {
                    document.getElementById('timeRange').textContent = `${data.exam_start_time} ~ 开始后 ${data.exam_duration || '--'} 分钟`;
                }

                // Check if already submitted
                try {
                    const checkRes = await fetch(API + '/exam/' + examId + '/session/check?student_id=' + studentId);
                    const checkData = await checkRes.json();
                    if (checkData.submitted) {
                        document.getElementById('statusText').className = 'status-text waiting';
                        document.getElementById('statusText').textContent = '⛔ 您已提交过该试卷，无法重复参加';
                        document.getElementById('startBtn').disabled = true;
                        document.getElementById('startBtn').textContent = '已提交';
                        return;
                    }
                } catch(e) {}

                updateStatus();
                if (clockInterval) clearInterval(clockInterval);
                clockInterval = setInterval(updateClock, 1000);
                updateClock(); // immediate

                if (countdownInterval) clearInterval(countdownInterval);
                countdownInterval = setInterval(updateStatus, 5000);
                updateStatus(); // immediate
            } catch (e) {
                document.getElementById('cExamTitle').textContent = '加载失败，请检查网络';
            }
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('currentTime').textContent = `${h}:${m}:${s}`;
        }

        function updateStatus() {
            const statusText = document.getElementById('statusText');
            const startBtn = document.getElementById('startBtn');

            if (!examInfo || !examInfo.exam_start_time) {
                statusText.className = 'status-text waiting';
                statusText.textContent = '⏳ 考试尚未配置开考时间';
                startBtn.disabled = true;
                startBtn.textContent = '📝 开始考试';
                startBtn.className = 'btn';
                return;
            }

            const now = new Date();
            const startTime = new Date(examInfo.exam_start_time.replace(' ', 'T'));
            const diff = startTime - now;

            if (diff > 0) {
                // Not yet started
                const minutes = Math.floor(diff / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                statusText.className = 'status-text waiting';
                if (minutes > 0) {
                    statusText.textContent = `⏳ 距离考试开始还有 ${minutes} 分钟 ${seconds} 秒`;
                } else {
                    statusText.textContent = `⏳ 距离考试开始还有 ${seconds} 秒`;
                }
                startBtn.disabled = true;
                startBtn.textContent = '📝 开始考试';
                startBtn.className = 'btn';
            } else {
                // Exam has started (or should be starting)
                statusText.className = 'status-text ready';
                statusText.textContent = '✅ 考试已开始，点击下方按钮进入';
                startBtn.disabled = false;
                startBtn.textContent = '📝 开始考试 →';
                startBtn.className = 'btn ongoing';
            }
        }

        async function startExam() {
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.textContent = '正在进入...';

            try {
                const res = await fetch(`${API}/exam/${examId}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: studentId,
                        student_name: studentName
                    })
                });
                const data = await res.json();
                if (data.ok) {
                    // Navigate to exam page
                    window.location.href = `exam.html?student_id=${encodeURIComponent(studentId)}&name=${encodeURIComponent(studentName)}&exam_id=${examId}&session_id=${data.session_id}`;
                } else {
                    showToast(data.error || '无法进入考试', 'error');
                    btn.disabled = false;
                    btn.textContent = '📝 开始考试';
                }
            } catch (e) {
                showToast('网络错误', 'error');
                btn.disabled = false;
                btn.textContent = '📝 开始考试';
            }
        }

        function showToast(msg, type) {
            // Simple alert-based toast since this is a cover page
            alert(msg);
        }

        loadExamInfo();
    </script>
</body>
</html>
