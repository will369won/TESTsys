<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生登录 - AI智能考试系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8ecf1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(74,144,217,0.10), 0 1px 4px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.7);
            padding: 48px 40px 40px;
            max-width: 440px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #1a2332;
            font-size: 1.6em;
            margin-bottom: 4px;
            font-weight: 700;
        }
        .back-link {
            text-align: center;
            margin-bottom: 20px;
        }
        .back-link a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85em;
            transition: color 0.2s;
        }
        .back-link a:hover { color: #4A90D9; }
        .login-box {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 32px 28px;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .login-box h2 {
            color: #1e293b;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.1em;
            font-weight: 600;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; margin-bottom: 5px;
            color: #475569; font-weight: 500; font-size: 0.88em;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95em;
            transition: all 0.25s;
            background: white;
            color: #1e293b;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4A90D9;
            box-shadow: 0 0 0 3px rgba(74,144,217,0.12);
        }
        .form-group input::placeholder { color: #94a3b8; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, #4A90D9 0%, #357ABD 100%);
            color: white;
            margin-top: 8px;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(74,144,217,0.3);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }

        /* Stata status bar */
        .stata-bar {
            padding: 10px 16px;
            border-radius: 10px;
            margin-bottom: 18px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.88em;
            transition: all 0.3s;
            backdrop-filter: blur(8px);
        }
        .stata-bar.show { display: flex; }
        .stata-bar.running { background: rgba(40,167,69,0.12); color: #1e7e34; border: 1px solid rgba(40,167,69,0.25); }
        .stata-bar.not-running { background: rgba(255,193,7,0.12); color: #856404; border: 1px solid rgba(255,193,7,0.3); }
        .stata-bar.checking { background: rgba(74,144,217,0.08); color: #357ABD; border: 1px solid rgba(74,144,217,0.2); }

        /* Exam info card */
        .exam-info-card {
            display: none;
            background: rgba(248,250,252,0.8);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.5);
            text-align: center;
        }
        .exam-info-card.show { display: block; }
        .exam-info-card .title { font-weight: 600; color: #1e293b; font-size: 0.95em; }
        .exam-info-card .meta { font-size: 0.82em; color: #94a3b8; margin-top: 4px; }

        .error-message {
            color: #ff4d4f; text-align: center; margin-top: 12px;
            font-size: 0.85em; display: none;
        }

        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 14px 24px; border-radius: 12px; color: white;
            font-size: 0.95em; z-index: 9999;
            opacity: 0; transition: opacity 0.3s, transform 0.3s;
            transform: translateY(-8px);
            backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-error { background: rgba(255,77,79,0.9); }
        .toast-success { background: rgba(82,196,26,0.9); }
        .toast-warning { background: rgba(250,173,20,0.9); color: #333; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎒 学生登录</h1>
        <div class="back-link"><a href="login.html">← 返回首页</a></div>
        <div class="login-box">
            <h2>输入信息进入考试</h2>

            <!-- Stata status (shown only when exam requires it) -->
            <div class="stata-bar checking" id="stataBar">
                <span class="icon">💻</span>
                <span class="status-text" id="stataStatus">正在检测 Stata...</span>
            </div>

            <!-- Exam info card -->
            <div class="exam-info-card" id="examInfoCard">
                <div class="title" id="examInfoTitle"></div>
                <div class="meta" id="examInfoMeta"></div>
            </div>

            <form id="studentLoginForm">
                <div class="form-group">
                    <label>试卷编号</label>
                    <input type="text" id="examNumber" placeholder="请输入教师提供的4位试卷编号" maxlength="4" required autofocus>
                </div>
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" id="studentId" placeholder="请输入学号" required>
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="studentName" placeholder="请输入姓名" required>
                </div>
                <button type="submit" class="btn" id="loginBtn">进入考试系统</button>
                <div class="error-message" id="studentError"></div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = 'http://localhost:5000/api';
        let requiresStata = false;
        let stataChecked = false;
        let stataRunning = false;
        let currentExamId = null;

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // Auto-lookup exam when exam number is entered (4 digits)
        let examLookupTimeout = null;
        document.getElementById('examNumber').addEventListener('input', function() {
            clearTimeout(examLookupTimeout);
            const num = this.value.trim();
            if (num.length === 4 && /^\d{4}$/.test(num)) {
                examLookupTimeout = setTimeout(() => lookupExam(num), 300);
            } else {
                document.getElementById('examInfoCard').classList.remove('show');
                document.getElementById('stataBar').classList.remove('show');
                requiresStata = false;
                currentExamId = null;
                document.getElementById('loginBtn').disabled = false;
            }
        });

        async function lookupExam(examNumber) {
            const stataBar = document.getElementById('stataBar');
            const stataStatus = document.getElementById('stataStatus');
            const infoCard = document.getElementById('examInfoCard');
            const infoTitle = document.getElementById('examInfoTitle');
            const infoMeta = document.getElementById('examInfoMeta');

            try {
                const res = await fetch(`${API}/exam/by-number/${examNumber}`);
                if (!res.ok) {
                    infoCard.classList.remove('show');
                    stataBar.classList.remove('show');
                    currentExamId = null;
                    return;
                }
                const data = await res.json();
                currentExamId = data.exam_id;
                requiresStata = data.requires_stata;

                // Show exam info
                infoTitle.textContent = `📄 ${data.title}`;
                infoMeta.textContent = `时长: ${data.exam_duration || '未设置'} 分钟`;
                infoCard.classList.add('show');

                // Check Stata only if exam requires it
                if (requiresStata) {
                    stataBar.className = 'stata-bar checking show';
                    stataStatus.textContent = '正在检测 Stata...';
                    document.getElementById('loginBtn').disabled = true;

                    try {
                        const sres = await fetch(`${API}/stata/check`);
                        const sdata = await sres.json();
                        stataRunning = sdata.stata_running;
                        stataChecked = true;

                        if (stataRunning) {
                            stataBar.className = 'stata-bar running show';
                            stataStatus.textContent = '✅ 检测到 Stata 正在运行';
                            document.getElementById('loginBtn').disabled = false;
                        } else {
                            stataBar.className = 'stata-bar not-running show';
                            stataStatus.textContent = '⚠️ 未检测到 Stata，请先打开 Stata 后再登录';
                            document.getElementById('loginBtn').disabled = true;
                        }
                    } catch (e) {
                        stataBar.className = 'stata-bar not-running show';
                        stataStatus.textContent = '⚠️ 无法检测 Stata 状态';
                        document.getElementById('loginBtn').disabled = false;
                    }
                } else {
                    // No Stata needed
                    stataBar.classList.remove('show');
                    document.getElementById('loginBtn').disabled = false;
                }
            } catch (e) {
                // Ignore lookup errors
                infoCard.classList.remove('show');
                stataBar.classList.remove('show');
            }
        }

        // Login form submit
        document.getElementById('studentLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const examNumber = document.getElementById('examNumber').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            const studentName = document.getElementById('studentName').value.trim();
            const errorDiv = document.getElementById('studentError');
            errorDiv.style.display = 'none';

            if (!examNumber || examNumber.length !== 4) {
                errorDiv.textContent = '请输入正确的4位试卷编号';
                errorDiv.style.display = 'block';
                return;
            }

            // If Stata is required, double-check before login
            if (requiresStata && stataChecked && !stataRunning) {
                errorDiv.textContent = '请先打开 Stata 后再登录';
                errorDiv.style.display = 'block';
                showToast('请先打开 Stata', 'error');
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '登录中...';

            try {
                const response = await fetch(`${API}/student/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: studentId,
                        name: studentName,
                        exam_number: examNumber
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    showToast('登录成功，正在进入考试...', 'success');
                    setTimeout(() => {
                        window.location.href = `exam-cover.html?student_id=${encodeURIComponent(studentId)}&name=${encodeURIComponent(studentName)}&exam_id=${data.exam_id}`;
                    }, 500);
                } else {
                    errorDiv.textContent = data.error || '登录失败';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = '进入考试系统';
                }
            } catch (error) {
                errorDiv.textContent = '网络错误，请检查后端是否运行';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '进入考试系统';
            }
        });
    </script>
</body>
</html>
