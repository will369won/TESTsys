<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师管理 - AI智能考试系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8ecf1 100%);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #4A90D9 0%, #357ABD 100%);
            color: white;
            padding: 16px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 1.3em; font-weight: 600; letter-spacing: -0.2px; }
        .header .user-info { font-size: 0.88em; opacity: 0.9; margin-right: 14px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .header button {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88em;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .header button:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }

        /* Container */
        .container { max-width: 1160px; margin: 24px auto; padding: 0 18px; }

        /* Cards */
        .card {
            background: rgba(255,255,255,0.80);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 18px;
            box-shadow: 0 2px 12px rgba(74,144,217,0.06), 0 1px 3px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.7);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover { box-shadow: 0 4px 20px rgba(74,144,217,0.10); transform: translateY(-1px); }
        .card h2 {
            color: #1e293b;
            margin-bottom: 16px;
            font-size: 1.1em;
            font-weight: 600;
            border-bottom: 1.5px solid rgba(74,144,217,0.12);
            padding-bottom: 10px;
        }

        /* Profile card */
        .profile-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            background: rgba(248,250,252,0.8);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.6);
        }
        .profile-avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4A90D9, #357ABD);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: 700;
        }
        .profile-info { flex: 1; }
        .profile-info .name { font-weight: 600; color: #1e293b; }
        .profile-info .school { font-size: 0.85em; color: #94a3b8; }
        .exam-count-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .exam-count-badge.ok { background: rgba(82,196,26,0.12); color: #389e0d; }
        .exam-count-badge.full { background: rgba(255,77,79,0.12); color: #cf1322; }

        /* Buttons */
        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.88em;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary { background: linear-gradient(135deg, #4A90D9, #357ABD); color: white; }
        .btn-success { background: linear-gradient(135deg, #52c41a, #389e0d); color: white; }
        .btn-info { background: linear-gradient(135deg, #4A90D9, #357ABD); color: white; }
        .btn-settings { background: linear-gradient(135deg, #faad14, #d48806); color: white; }
        .btn-danger { background: linear-gradient(135deg, #ff4d4f, #cf1322); color: white; }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(74,144,217,0.20); }
        .btn:active:not(:disabled) { transform: translateY(0) scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

        /* File upload */
        .file-upload { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .file-upload label { font-size: 0.88em; color: #475569; font-weight: 500; }
        .file-upload input[type="file"] {
            padding: 7px 10px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.88em;
            background: white;
            color: #475569;
        }
        .file-upload input[type="file"]::file-selector-button {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            background: rgba(74,144,217,0.1);
            color: #4A90D9;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .file-upload input[type="file"]::file-selector-button:hover {
            background: rgba(74,144,217,0.2);
        }

        /* Upload warning */
        .upload-warning {
            background: rgba(255,193,7,0.12);
            border: 1px solid rgba(255,193,7,0.3);
            color: #856404;
            padding: 10px 16px;
            border-radius: 10px;
            margin-top: 12px;
            font-size: 0.88em;
            display: none;
            backdrop-filter: blur(4px);
        }
        .upload-warning.show { display: block; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid rgba(226,232,240,0.6); }
        td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        td:first-child { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        th { background: rgba(248,250,252,0.7); font-weight: 600; color: #475569; font-size: 0.84em; }
        td { font-size: 0.88em; color: #334155; }
        tr:hover td { background: rgba(248,250,252,0.5); }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.78em; font-weight: 500; }
        .badge-progress { background: rgba(255,193,7,0.12); color: #856404; }
        .badge-done { background: rgba(82,196,26,0.12); color: #389e0d; }
        .badge-pending { background: rgba(255,77,79,0.12); color: #cf1322; }

        /* Toast */
        .toast { position: fixed; top: 20px; right: 20px; padding: 14px 24px; border-radius: 12px; color: white; font-size: 0.95em; z-index: 9999; opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(-8px); backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: rgba(82,196,26,0.9); }
        .toast-error { background: rgba(255,77,79,0.9); }

        /* Detail modal */
        .detail-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); z-index: 1000; justify-content: center; align-items: center; }
        .detail-modal.show { display: flex; }
        .detail-content { background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); border-radius: 16px; padding: 28px; max-width: 900px; width: 92%; max-height: 80vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 8px 40px rgba(0,0,0,0.10); }
        .detail-content h2 { margin-bottom: 18px; color: #1e293b; }
        .q-item { background: rgba(248,250,252,0.8); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
        .q-item h4 { color: #1e293b; margin-bottom: 6px; }
        .q-item .meta { font-size: 0.84em; color: #64748b; margin-bottom: 6px; }
        .q-item .answer-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .q-item input[type="number"] { width: 75px; padding: 6px 10px; border: 1.5px solid #e2e8f0; border-radius: 6px; font-size: 0.9em; }
        .q-item input[type="number"]:focus { outline: none; border-color: #4A90D9; }
        .q-item .correct { color: #52c41a; font-weight: 500; }
        .q-item .wrong { color: #ff4d4f; font-weight: 500; }
        .close-btn { float: right; background: none; border: none; font-size: 1.5em; cursor: pointer; color: #94a3b8; transition: color 0.2s; }
        .close-btn:hover { color: #475569; }
        .score-input { display: flex; align-items: center; gap: 6px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Responsive */
        @media (max-width: 640px) {
            .header { padding: 14px 18px; }
            .container { padding: 0 10px; }
            .btn-group { flex-direction: column; }
            .file-upload { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 教师管理系统</h1>
        <div class="header-right">
            <span class="user-info" id="userInfo"></span>
            <button onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="container">
        <!-- Profile -->
        <div class="card" id="profileCard">
            <div class="profile-bar" style="cursor:pointer;" onclick="window.location.href='teacher-profile.html'" title="点击管理个人信息">
                <div class="profile-avatar" id="profileAvatar">教</div>
                <div class="profile-info">
                    <div class="name" id="profileName">加载中...</div>
                    <div class="school" id="profileSchool"></div>
                </div>
                <div class="exam-count-badge" id="examCountBadge">-- / 2 份试卷</div>
            </div>
        </div>

        <!-- Template Management -->
        <div class="card">
            <h2>📄 模板管理</h2>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="downloadExamTemplate()">下载题目模板</button>
                <button class="btn btn-info" onclick="downloadStudentTemplate()">下载学生信息模板</button>
                <button class="btn" style="background:linear-gradient(135deg,#f093fb,#f5576c);color:white;" onclick="window.location.href='monitor.html'">监视考试</button>
            </div>
            <div class="file-upload" style="margin-top: 12px;">
                <label>上传题目模板：</label>
                <input type="file" id="examFile" accept=".xlsx" onchange="onExamFileSelected()">
                <button class="btn btn-success" id="uploadExamBtn" onclick="uploadExamTemplate()" disabled>上传并生成试卷</button>
                <div id="prescanMessage" style="margin-top:6px;font-size:0.88em;color:#64748b;"></div>
            </div>
            <div class="upload-warning" id="uploadWarning">
                ⚠️ 每个用户最多上传 <strong>2 份</strong>试卷。如需上传新试卷，请先删除旧试卷。
            </div>

            <div class="file-upload" style="margin-top: 12px;">
                <label>上传学生信息：</label>
                <input type="file" id="studentFile" accept=".xlsx">
                <button class="btn btn-success" onclick="uploadStudentTemplate()">上传学生信息</button>
            </div>
        </div>

        <!-- Teacher Personal Attachment Management (always visible) -->
        <div class="card" id="teacherAttachmentCard">
            <h2>📎 附件管理</h2>
            <div class="file-upload">
                <label>上传附件到个人存储：</label>
                <input type="file" id="teacherAttachmentUpload" multiple accept="image/*,.pdf,.doc,.docx,.txt">
                <button class="btn btn-info" onclick="uploadTeacherAttachments()">上传附件</button>
                <div style="margin-top:4px;font-size:0.8em;color:#94a3b8;">文件将保存到您的个人附件存储，上传试卷模板时自动关联到试卷。</div>
                <div id="prescanImageList" style="margin-top:6px;font-size:0.85em;color:#475569;"></div>
            </div>
            <div id="teacherAttachmentList" style="margin-top:12px;font-size:0.88em;color:#64748b;">
                暂无附件
            </div>
        </div>

        <!-- Exam List -->
            <table>
                <thead>
                    <tr>
                        <th style="width:25%;white-space:nowrap;">试卷标题</th>
                        <th style="width:10%;white-space:nowrap;">试卷编号</th>
                        <th style="width:8%;white-space:nowrap;">题目数</th>
                        <th style="width:18%;white-space:nowrap;">创建时间</th>
                        <th style="width:10%;white-space:nowrap;">模板状态</th>
                        <th style="width:10%;white-space:nowrap;">考试设置</th>
                        <th style="width:19%;white-space:nowrap;">操作</th>
                    </tr>
                </thead>
                <tbody id="examList"></tbody>
            </table>
        </div>

        <!-- Results -->
        <div class="card">
            <h2>📊 成绩记录</h2>
            <table>
                <thead><tr><th>试卷</th><th>学生</th><th>学号</th><th>开始时间</th><th>状态</th><th>得分</th><th>操作</th></tr></thead>
                <tbody id="resultList"></tbody>
            </table>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="detail-modal" id="detailModal">
        <div class="detail-content">
            <button class="close-btn" onclick="closeDetail()">&times;</button>
            <h2 id="detailTitle">考试详情</h2>
            <div id="detailBody"></div>
            <div style="margin-top: 16px; text-align: right;">
                <button class="btn btn-success" onclick="saveGrades()">保存评分</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';
        let currentSessionId = null;
        let currentExamId = null;
        let profileData = null;

        async function checkLogin() {
            try {
                const res = await fetch(`${API}/teacher/check`);
                const data = await res.json();
                if (!data.logged_in) window.location.href = 'login.html';
            } catch (e) { window.location.href = 'login.html'; }
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // Load profile
        async function loadProfile() {
            try {
                const res = await fetch(`${API}/teacher/profile`);
                profileData = await res.json();

                // Update profile display
                const initial = profileData.username ? profileData.username.charAt(0) : '教';
                document.getElementById('profileAvatar').textContent = initial;
                document.getElementById('profileName').textContent = profileData.username || '教师';
                document.getElementById('profileSchool').textContent = profileData.school || '';

                // Exam count badge
                const badge = document.getElementById('examCountBadge');
                badge.textContent = `${profileData.exam_count} / ${profileData.max_exams} 份试卷`;
                badge.className = `exam-count-badge ${profileData.exam_count >= profileData.max_exams ? 'full' : 'ok'}`;

                // Show upload warning + delete section if exams exist
                if (profileData.exam_count >= profileData.max_exams) {
                    document.getElementById('uploadWarning').classList.add('show');
                }

            } catch (e) {}
        }

        function downloadExamTemplate() {
            window.open(`${API}/template/exam/download`, '_blank');
        }

        function downloadStudentTemplate() {
            window.open(`${API}/template/student/download`, '_blank');
        }

        let prescanData = null;

        async function onExamFileSelected() {
            const file = document.getElementById('examFile').files[0];
            const btn = document.getElementById('uploadExamBtn');
            const msgDiv = document.getElementById('prescanMessage');
            const imageList = document.getElementById('prescanImageList');

            if (!file) {
                btn.disabled = true;
                msgDiv.textContent = '';
                imageList.textContent = '';
                prescanData = null;
                return;
            }

            // Prescan the file
            const fd = new FormData();
            fd.append('file', file);
            try {
                const res = await fetch(`${API}/template/prescan`, { method: 'POST', body: fd });
                const data = await res.json();
                if (data.ok) {
                    prescanData = data;
                    // Always load teacher attachments so user can see what's available
                    loadTeacherAttachments();
                    if (data.needs_attachment) {
                        msgDiv.innerHTML = '📎 <strong>该试卷需要附件</strong>，请先在个人附件存储中上传所需文件，上传模板时系统将自动关联。';
                        btn.disabled = false;
                        // Show required images
                        if (data.referenced_images && data.referenced_images.length > 0) {
                            imageList.innerHTML = '需要以下附件：<br>' +
                                data.referenced_images.map(f => `<span style="display:inline-block;padding:2px 8px;margin:2px;background:rgba(250,173,20,0.1);border-radius:4px;">📄 ${f}</span>`).join('');
                        } else {
                            imageList.textContent = '该试卷某些题目标记了需要附件，请上传对应文件。';
                        }
                    } else {
                        msgDiv.innerHTML = '✅ 无需附件，可直接上传生成试卷。';
                        btn.disabled = false;
                        imageList.textContent = '';
                    }
                } else {
                    msgDiv.textContent = '⚠️ 预扫描失败: ' + (data.error || '未知错误');
                    btn.disabled = true;
                }
            } catch (e) {
                msgDiv.textContent = '⚠️ 预扫描网络错误';
                btn.disabled = true;
            }
        }

        async function checkAttachmentsReady() {
            // Now handled via teacher personal storage — always allow upload
            // Backend auto-imports from personal storage during upload
        }

        async function uploadExamTemplate() {
            if (!profileData) { await loadProfile(); }
            if (profileData && profileData.exam_count >= profileData.max_exams) {
                showToast(`每个用户最多上传 ${profileData.max_exams} 份试卷，请先删除旧试卷`, 'error');
                return;
            }

            const file = document.getElementById('examFile').files[0];
            if (!file) { showToast('请选择文件', 'error'); return; }

            const fd = new FormData();
            fd.append('file', file);
            try {
                const res = await fetch(`${API}/template/exam/upload`, { method: 'POST', body: fd });
                const data = await res.json();
                if (data.ok) {
                    showToast(`试卷 "${data.title}" 创建成功，${data.question_count} 道题目。请前往[考试设置]完成配置。`);
                    if (data.mismatches && data.mismatches.length > 0) {
                        showToast('附件匹配警告: ' + data.mismatches.join('; '), 'error');
                    }
                    if (data.attachment_warning) {
                        showToast(data.attachment_warning, 'error');
                    }
                    loadExams();
                    loadProfile();
                    // Reset prescan state
                    prescanData = null;
                    document.getElementById('uploadExamBtn').disabled = true;
                    document.getElementById('prescanMessage').textContent = '';
                    document.getElementById('examFile').value = '';
                    document.getElementById('prescanImageList').textContent = '';
                } else {
                    showToast(data.error || '上传失败', 'error');
                }
            } catch (e) { showToast('网络错误', 'error'); }
        }

        async function uploadStudentTemplate() {
            const file = document.getElementById('studentFile').files[0];
            if (!file) { showToast('请选择文件', 'error'); return; }
            const fd = new FormData();
            fd.append('file', file);
            try {
                const res = await fetch(`${API}/template/student/upload`, { method: 'POST', body: fd });
                const data = await res.json();
                if (data.ok) {
                    showToast(`成功导入 ${data.count} 名学生`);
                } else {
                    showToast(data.error || '上传失败', 'error');
                }
            } catch (e) { showToast('网络错误', 'error'); }
        }

        async function deleteSingleExam(examId, title) {
            if (!confirm('确定要删除试卷「' + title + '」吗？删除后不可恢复！')) return;
            try {
                const res = await fetch(`${API}/teacher/exam/${examId}/delete`, { method: 'DELETE' });
                const data = await res.json();
                if (data.ok) {
                    showToast(data.message || '删除成功');
                    loadExams();
                    loadProfile();
                } else {
                    showToast(data.error || '删除失败', 'error');
                }
            } catch (e) { showToast('网络错误', 'error'); }
        }

        async function loadExams() {
            try {
                const res = await fetch(`${API}/teacher/exams`);
                const exams = await res.json();
                const tbody = document.getElementById('examList');
                tbody.innerHTML = exams.map(e => {
                    const templateStatus = e.template_uploaded
                        ? '<span class="badge badge-done">✅ 已上传</span>'
                        : '<span class="badge badge-pending">❌ 未上传</span>';
                    const settingsStatus = e.settings_complete
                        ? '<span class="badge badge-done">✅ 已设置</span>'
                        : (e.template_uploaded
                            ? '<span class="badge badge-pending">⚠️ 待设置</span>'
                            : '<span class="badge badge-progress">—</span>');
                    const settingsBtn = e.template_uploaded
                        ? `<button class="btn btn-settings" style="padding:5px 10px;font-size:0.82em;" onclick="window.location.href='exam-setup.html?exam_id=${e.exam_id}'">⚙️ 考试设置</button>`
                        : '<button class="btn btn-settings" disabled style="padding:5px 10px;font-size:0.82em;">⚙️ 先上传模板</button>';
                    // v4.0: Exam number + grading button
                    const examCode = e.exam_number || '<span style="color:#94a3b8;">待设置</span>';
                    const gradingBtn = e.template_uploaded
                        ? `<button class="btn btn-info" style="padding:5px 10px;font-size:0.82em;" onclick="window.location.href='grading.html?exam_id=${e.exam_id}'">📝 开始阅卷</button>`
                        : '<button class="btn btn-info" disabled style="padding:5px 10px;font-size:0.82em;">📝 先上传模板</button>';
                    const previewBtn = e.template_uploaded
                        ? `<button class="btn" style="padding:5px 10px;font-size:0.82em;background:rgba(74,144,217,0.08);color:#4A90D9;border:1px solid rgba(74,144,217,0.3);" onclick="window.open('preview.html?exam_id=${e.exam_id}')">📄 样卷</button>`
                        : '<button class="btn" disabled style="padding:5px 10px;font-size:0.82em;">📄 先上传模板</button>';
                    const deleteBtn = `<button class="btn btn-danger" style="padding:5px 10px;font-size:0.82em;" onclick="deleteSingleExam(${e.exam_id}, '${e.title.replace(/'/g, "\\'")}')">🗑️ 删除</button>`;
                    return `<tr>
                        <td title="${e.title}">${e.title}</td>
                        <td><span style="font-weight:600;color:#4A90D9;font-size:1.1em;">${examCode}</span></td>
                        <td>${e.question_count}</td>
                        <td>${e.created_at}</td>
                        <td>${templateStatus}</td>
                        <td>${settingsStatus}</td>
                        <td>${previewBtn} ${settingsBtn} ${gradingBtn} ${deleteBtn}</td>
                    </tr>`;
                }).join('');
                if (!exams.length) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">暂无试卷</td></tr>';
                // Set currentExamId to most recent exam for attachment list
                if (exams.length > 0) {
                    currentExamId = exams[0].exam_id;
                } else {
                    currentExamId = null;
                }
                loadTeacherAttachments();
            } catch (e) {}
        }

        async function loadResults() {
            try {
                const res = await fetch(`${API}/teacher/results`);
                const results = await res.json();
                const tbody = document.getElementById('resultList');
                tbody.innerHTML = results.map(r => `
                    <tr>
                        <td>${r.title}</td>
                        <td>${r.student_name}</td>
                        <td>${r.student_id}</td>
                        <td>${r.start_time}</td>
                        <td><span class="badge ${r.status === 'submitted' ? 'badge-done' : 'badge-progress'}">${r.status === 'submitted' ? '已提交' : '考试中'}</span></td>
                        <td>${r.total_score} / --</td>
                        <td><button class="btn btn-primary" style="padding:5px 10px;font-size:0.82em;" onclick="viewDetail(${r.session_id})">查看详情</button></td>
                    </tr>
                `).join('');
                if (!results.length) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">暂无记录</td></tr>';
            } catch (e) {}
        }

        async function viewDetail(sessionId) {
            currentSessionId = sessionId;
            try {
                const res = await fetch(`${API}/teacher/session/${sessionId}`);
                const data = await res.json();
                document.getElementById('detailTitle').textContent = `${data.title} - ${data.student_name} (${data.student_id})`;
                let html = '';
                data.questions.forEach((q, i) => {
                    const isObjective = ['单选题', '多选题', '判断题'].includes(q.q_type);
                    const isCorrect = q.is_correct === 1;
                    const isWrong = q.is_correct === 0;
                    const statusClass = isCorrect ? 'correct' : (isWrong ? 'wrong' : '');
                    html += `<div class="q-item">
                        <h4>第 ${i+1} 题 【${q.q_type}】 (${q.max_score} 分)</h4>
                        <div class="meta">${q.content}</div>`;
                    if (q.option_a) html += `<div class="meta">A: ${q.option_a} &nbsp; B: ${q.option_b} &nbsp; C: ${q.option_c} &nbsp; D: ${q.option_d}</div>`;
                    if (q.correct_answer) html += `<div class="meta">正确答案: <b>${q.correct_answer}</b></div>`;
                    html += `<div class="meta">学生答案: <b class="${statusClass}">${q.answer_text || '(未作答)'}</b> &nbsp; 得分: </div>
                        <div class="score-input">
                            <input type="number" id="grade_${q.q_id}" value="${q.actual_score ?? 0}" step="0.5" min="0" max="${q.max_score}">
                            <span> / ${q.max_score} 分</span>
                        </div>
                    </div>`;
                });
                document.getElementById('detailBody').innerHTML = html;
                document.getElementById('detailModal').classList.add('show');
            } catch (e) { showToast('加载失败', 'error'); }
        }

        function closeDetail() {
            document.getElementById('detailModal').classList.remove('show');
        }

        async function saveGrades() {
            const grades = {};
            document.querySelectorAll('[id^="grade_"]').forEach(input => {
                const qId = input.id.replace('grade_', '');
                grades[qId] = parseFloat(input.value) || 0;
            });
            try {
                const res = await fetch(`${API}/teacher/session/${currentSessionId}/grade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ grades })
                });
                const data = await res.json();
                if (data.ok) {
                    showToast(`评分已保存，总分: ${data.total_score}`);
                    closeDetail();
                    loadResults();
                } else {
                    showToast('保存失败', 'error');
                }
            } catch (e) { showToast('网络错误', 'error'); }
        }

        async function logout() {
            await fetch(`${API}/teacher/logout`, { method: 'POST' });
            window.location.href = 'login.html';
        }

        // ─── Teacher Personal Attachment functions (via /api/teacher/attachments/*) ───

        async function uploadTeacherAttachments() {
            const input = document.getElementById('teacherAttachmentUpload');
            const files = input.files;
            if (!files || files.length === 0) { showToast('请选择文件', 'error'); return; }
            const formData = new FormData();
            for (let f of files) { formData.append('files', f); }
            try {
                const res = await fetch(API + '/teacher/attachments/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.ok) {
                    showToast('上传成功', 'success');
                    loadTeacherAttachments();
                } else {
                    showToast(data.error || '上传失败', 'error');
                }
            } catch(e) { showToast('上传失败', 'error'); }
            input.value = '';
        }

        async function loadTeacherAttachments() {
            const list = document.getElementById('teacherAttachmentList');
            try {
                const res = await fetch(API + '/teacher/attachments/list');
                const data = await res.json();
                if (data.attachments && data.attachments.length > 0) {
                    const displaySize = (size) => {
                        const kb = size / 1024;
                        return kb > 1024 ? (kb/1024).toFixed(1) + 'MB' : kb.toFixed(1) + 'KB';
                    };
                    list.innerHTML = data.attachments.map(a =>
                        `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;margin:4px 0;background:rgba(248,250,252,0.6);border-radius:8px;border:1px solid rgba(226,232,240,0.5);">
                            <span style="display:flex;align-items:center;gap:8px;">
                                📎 <span>${a.display_name || a.name}</span>
                                <span style="font-size:0.8em;color:#94a3b8;">${displaySize(a.size)}</span>
                            </span>
                            <span onclick="deleteTeacherAttachment('${a.name}')" style="cursor:pointer;padding:4px 8px;border-radius:4px;color:#ff4d4f;transition:background 0.2s;" onmouseover="this.style.background='rgba(255,77,79,0.08)'" onmouseout="this.style.background='transparent'">✕ 删除</span>
                        </div>`
                    ).join('');
                } else {
                    list.innerHTML = '<span style="color:#94a3b8;">暂无附件，上传文件后将在此显示</span>';
                }
            } catch(e) { list.innerHTML = '<span style="color:#94a3b8;">暂无附件</span>'; }
        }

        async function deleteTeacherAttachment(name) {
            if (!confirm('确定要删除附件「' + name + '」吗？')) return;
            try {
                const res = await fetch(API + '/teacher/attachments/' + encodeURIComponent(name), { method: 'DELETE' });
                const data = await res.json();
                if (data.ok) { showToast('附件已删除', 'success'); loadTeacherAttachments(); }
                else { showToast(data.error || '删除失败', 'error'); }
            } catch(e) { showToast('删除失败', 'error'); }
        }

        checkLogin();
        loadProfile();
        loadExams();
        loadResults();
    </script>
</body>
</html>
