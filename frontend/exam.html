<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线考试 - AI智能考试系统 v3.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', -apple-system, sans-serif; background: linear-gradient(135deg, #f0f4f8 0%, #e8ecf1 100%); min-height: 100vh;
               -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }

        .header { background: linear-gradient(135deg, #4A90D9 0%, #357ABD 100%); color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 1.2em; font-weight: 600; }
        .header .info { display: flex; align-items: center; gap: 20px; font-size: 0.92em; }
        .timer { font-size: 1.3em; font-weight: bold; padding: 6px 16px; background: rgba(255,255,255,0.2); border-radius: 10px; backdrop-filter: blur(4px); min-width: 80px; text-align: center; }
        .timer.warning { background: rgba(250,173,20,0.3); }
        .timer.danger { background: rgba(255,77,79,0.4); animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

        /* Toolbar */
        .toolbar { display: flex; gap: 10px; padding: 10px 30px; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226,232,240,0.5); align-items: center; flex-wrap: wrap; }
        .toolbar .tb-btn { padding: 8px 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 0.88em; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .toolbar .tb-btn:hover:not(.disabled) { background: rgba(74,144,217,0.06); border-color: #4A90D9; }
        .toolbar .tb-btn.active { background: #4A90D9; color: white; border-color: #4A90D9; }
        .toolbar .tb-btn.disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; border-color: #e2e8f0; }
        .toolbar .tb-divider { width: 1px; height: 24px; background: #e2e8f0; }
        .toolbar .tb-label { font-size: 0.85em; color: #94a3b8; margin-right: 5px; }

        /* Attachment bar */
        .attach-bar { display: none; padding: 8px 30px; background: rgba(255,248,225,0.9); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,224,130,0.6); align-items: center; gap: 12px; font-size: 0.9em; }
        .attach-bar.show { display: flex; }
        .attach-bar .attach-item { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: rgba(255,255,255,0.8); border: 1px solid rgba(255,224,130,0.6); border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .attach-bar .attach-item:hover { background: #fff3cd; }
        .attach-bar .attach-path { font-size: 0.8em; color: #64748b; }

        .main { display: flex; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; min-height: calc(100vh - 130px); }
        .question-area { flex: 1; background: rgba(255,255,255,0.82); backdrop-filter: blur(16px); border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(74,144,217,0.06), 0 1px 3px rgba(0,0,0,0.03); border: 1px solid rgba(255,255,255,0.7); display: flex; flex-direction: column; }
        .question-header { margin-bottom: 24px; }
        .question-header .q-num { font-size: 0.88em; color: #64748b; margin-bottom: 4px; }
        .question-header .q-type { display: inline-block; padding: 3px 10px; background: rgba(74,144,217,0.1); backdrop-filter: blur(4px); border-radius: 6px; font-size: 0.8em; color: #4A90D9; font-weight: 500; }
        .question-header .q-score { float: right; color: #4A90D9; font-weight: 600; }
        .question-content { font-size: 1.05em; line-height: 1.8; margin-bottom: 24px; color: #1e293b; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; border: 1.5px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.5); }
        .option:hover { border-color: #4A90D9; background: rgba(74,144,217,0.04); }
        .option.selected { border-color: #4A90D9; background: rgba(74,144,217,0.08); }
        .option input { margin-top: 3px; accent-color: #4A90D9; }
        .option label { cursor: pointer; flex: 1; font-size: 0.98em; line-height: 1.6; color: #334155; }
        .answer-textarea { width: 100%; min-height: 200px; padding: 16px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 0.98em; line-height: 1.6; resize: vertical; font-family: inherit; transition: border-color 0.2s; color: #1e293b; }
        .answer-textarea:focus { outline: none; border-color: #4A90D9; box-shadow: 0 0 0 3px rgba(74,144,217,0.12); }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: auto; padding-top: 24px; }
        .nav-btn { padding: 12px 30px; border: none; border-radius: 10px; font-size: 0.95em; cursor: pointer; font-weight: 500; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-prev { background: rgba(226,232,240,0.7); color: #475569; }
        .nav-prev:hover:not(:disabled) { background: rgba(203,213,225,0.8); }
        .nav-next { background: linear-gradient(135deg, #4A90D9, #357ABD); color: white; }
        .nav-next:hover:not(:disabled) { box-shadow: 0 4px 16px rgba(74,144,217,0.30); transform: translateY(-2px); }
        .nav-submit { background: linear-gradient(135deg, #52c41a, #389e0d); color: white; }
        .nav-submit:hover { box-shadow: 0 4px 16px rgba(82,196,26,0.30); transform: translateY(-2px); }
        .nav-btn:active { transform: translateY(0) scale(0.97) !important; }
        .sidebar { width: 220px; background: rgba(255,255,255,0.82); backdrop-filter: blur(16px); border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(74,144,217,0.06); border: 1px solid rgba(255,255,255,0.7); align-self: flex-start; position: sticky; top: 90px; }
        .sidebar h3 { font-size: 0.92em; color: #1e293b; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(226,232,240,0.6); }
        .q-nav { display: flex; flex-wrap: wrap; gap: 6px; }
        .q-nav-btn { width: 36px; height: 36px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 0.82em; font-weight: 500; transition: all 0.2s; background: white; color: #475569; }
        .q-nav-btn.current { background: #4A90D9; color: white; border-color: #4A90D9; }
        .q-nav-btn.answered { background: #52c41a; color: white; border-color: #52c41a; }
        .q-nav-btn:hover { transform: scale(1.08); }
        .save-status { font-size: 0.78em; color: #94a3b8; margin-top: 12px; text-align: center; }
        .tab-switch-warning { font-size: 0.85em; color: #ff4d4f; margin-top: 8px; text-align: center; }

        .submitted-page, .terminated-page { display: none; text-align: center; padding: 60px 40px; }
        .submitted-page.show, .terminated-page.show { display: block; }
        .submitted-page .big-icon, .terminated-page .big-icon { font-size: 4em; margin-bottom: 20px; }
        .submitted-page h2 { font-size: 1.6em; color: #1e293b; margin-bottom: 10px; }
        .terminated-page h2 { font-size: 1.6em; color: #ff4d4f; margin-bottom: 10px; }
        .submitted-page p, .terminated-page p { color: #64748b; font-size: 1.05em; }
        .submitted-page .score-display { font-size: 2.8em; font-weight: bold; color: #52c41a; margin: 20px 0; }

        .toast { position: fixed; top: 20px; right: 20px; padding: 14px 24px; border-radius: 12px; color: white; font-size: 0.95em; z-index: 9999; opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(-8px); backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: rgba(82,196,26,0.9); }
        .toast-warning { background: rgba(250,173,20,0.9); color: #333; }
        .toast-error { background: rgba(255,77,79,0.9); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); border-radius: 16px; padding: 30px; max-width: 400px; width: 90%; text-align: center; border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 8px 40px rgba(0,0,0,0.10); }
        .modal-box h2 { margin-bottom: 16px; color: #1e293b; }
        .modal-box p { color: #64748b; margin-bottom: 24px; }
        .modal-btns { display: flex; gap: 12px; justify-content: center; }
        .modal-btn { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95em; font-weight: 500; transition: all 0.2s; }
        .modal-btn:hover { transform: translateY(-1px); }
        .modal-cancel { background: rgba(226,232,240,0.8); color: #475569; }
        .modal-cancel:hover { background: rgba(203,213,225,0.8); }
        .modal-confirm { background: #52c41a; color: white; }
        .modal-confirm:hover { box-shadow: 0 4px 12px rgba(82,196,26,0.3); }

        .ai-popup { display: none; position: fixed; top: 0; right: 0; width: 500px; height: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); z-index: 2000; box-shadow: -5px 0 30px rgba(0,0,0,0.12); flex-direction: column; }
        .ai-popup.show { display: flex; }
        .ai-popup .ai-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(248,250,252,0.9); border-bottom: 1px solid rgba(226,232,240,0.5); }
        .ai-popup .ai-header select { padding: 6px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 0.9em; background: white; }
        .ai-popup .ai-header .close-btn { background: none; border: none; font-size: 1.5em; cursor: pointer; color: #94a3b8; transition: color 0.2s; }
        .ai-popup .ai-header .close-btn:hover { color: #475569; }
        .ai-popup iframe { flex: 1; border: none; }

        .notice-banner { display: none; padding: 12px 30px; background: rgba(227,242,253,0.9); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(144,202,249,0.5); font-size: 0.9em; color: #1565c0; line-height: 1.6; white-space: pre-line; }
        .notice-banner.show { display: block; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media (max-width: 768px) {
            .ai-popup { width: 100%; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="examTitle">加载中...</h1>
        <div class="info">
            <span id="currentTime"></span>
            <span>剩余:</span>
            <span class="timer" id="timer">--:--</span>
        </div>
    </div>

    <!-- Exam Notice -->
    <div class="notice-banner" id="noticeBanner"></div>

    <!-- Attachment bar -->
    <div class="attach-bar" id="attachBar">
        <span>📎 附件：</span>
        <div id="attachItems"></div>
        <span class="attach-path" id="attachPath"></span>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" id="examToolbar">
        <span class="tb-label">💻 Stata:</span>
        <button class="tb-btn disabled" id="stataShowBtn" onclick="stataShow()" disabled>📤 打开 Stata</button>
        <button class="tb-btn disabled" id="stataHideBtn" onclick="stataHide()" disabled>📥 收起 Stata</button>
        <div class="tb-divider"></div>
        <span class="tb-label">🤖 AI:</span>
        <button class="tb-btn disabled" id="aiToggleBtn" onclick="toggleAI()" disabled>💬 打开 AI 辅助</button>
    </div>

    <div class="main">
        <div class="question-area" id="questionArea">
            <div class="question-header">
                <div class="q-num" id="qNum"></div>
                <span class="q-type" id="qType"></span>
                <span class="q-score" id="qScore"></span>
            </div>
            <div class="question-content" id="qContent"></div>
            <div id="qAnswer"></div>
            <div class="nav-buttons">
                <button class="nav-btn nav-prev" id="prevBtn" onclick="prevQuestion()">上一题</button>
                <button class="nav-btn nav-next" id="nextBtn" onclick="nextQuestion()">下一题</button>
                <button class="nav-btn nav-submit" id="submitBtn" onclick="confirmSubmit()" style="display:none;">提交试卷</button>
            </div>
            <div class="tab-switch-warning" id="tabWarning"></div>
        </div>

        <div class="submitted-page" id="submittedPage">
            <div class="big-icon">✅</div>
            <h2>试卷已提交</h2>
            <p>你的答案已保存，考试结束。</p>
            <div class="score-display" id="submittedScore"></div>
            <p style="margin-top: 20px; color: #999; font-size: 0.9em;">请等待老师指示，不要关闭此页面。</p>
        </div>

        <div class="terminated-page" id="terminatedPage">
            <div class="big-icon">⛔</div>
            <h2>考试已被终止</h2>
            <p id="terminatedReason">你的考试已被老师终止，请联系老师。</p>
            <p style="margin-top: 20px; color: #999; font-size: 0.9em;">请等待老师进一步指示。</p>
        </div>

        <div class="sidebar">
            <h3>题目导航</h3>
            <div class="q-nav" id="qNav"></div>
            <div class="save-status" id="saveStatus"></div>
        </div>
    </div>

    <!-- Submit confirm modal -->
    <div class="modal-overlay" id="submitModal">
        <div class="modal-box">
            <h2>确认提交？</h2>
            <p id="submitInfo"></p>
            <div class="modal-btns">
                <button class="modal-btn modal-cancel" onclick="closeSubmitModal()">继续考试</button>
                <button class="modal-btn modal-confirm" onclick="doSubmit()">确认提交</button>
            </div>
        </div>
    </div>

    <!-- AI popup -->
    <div class="ai-popup" id="aiPopup">
        <div class="ai-header">
            <select id="aiSelect" onchange="changeAI()">
                <option value="https://www.doubao.com/chat/">🟢 豆包</option>
                <option value="https://chat.deepseek.com/">🔵 DeepSeek</option>
                <option value="https://www.qianwen.com/">🟣 千问</option>
            </select>
            <button class="close-btn" onclick="toggleAI()">&times;</button>
        </div>
        <iframe id="aiFrame" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = 'http://localhost:5000/api';
        const params = new URLSearchParams(window.location.search);
        const studentId = params.get('student_id') || '';
        const studentName = params.get('name') || '';

        let sessionId = null;
        let examDuration = 60;
        let questions = [];
        let currentIndex = 0;
        let answers = {};
        let examSubmitted = false;
        let examTerminated = false;
        let timerInterval = null;
        let autoSaveInterval = null;
        let attachments = [];
        let questionSettings = {}; // {qId: {enableStata, enableAi}}

        // Default download paths
        const DEFAULT_DOWNLOAD_PATH = 'C:\\Users\\Public\\Downloads';
        const FALLBACK_DOWNLOAD_PATH = 'C:\\Users\\Administrator\\Desktop';

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function loadExam() {
            // Get first available exam or use exam_id param
            const examId = params.get('exam_id');
            let targetExamId = examId;

            if (!targetExamId) {
                try {
                    const res = await fetch(`${API}/student/exams?student_id=${encodeURIComponent(studentId)}`);
                    const exams = await res.json();
                    if (exams.length === 0) {
                        showToast('暂无可用考试', 'error');
                        setTimeout(() => window.location.href = 'login.html', 2000);
                        return;
                    }
                    targetExamId = exams[0].exam_id;
                } catch (e) {
                    showToast('加载考试列表失败', 'error');
                    return;
                }
            }

            try {
                const res = await fetch(`${API}/exam/${targetExamId}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id: studentId, student_name: studentName })
                });
                const data = await res.json();
                if (!res.ok) {
                    showToast(data.error || '无法开始考试', 'error');
                    setTimeout(() => window.location.href = 'login.html', 3000);
                    return;
                }

                sessionId = data.session_id;
                document.getElementById('examTitle').textContent = data.title;
                examDuration = data.exam_duration || 60;
                questions = data.questions || [];
                answers = {};

                // v3.0: Process question settings
                questions.forEach(q => {
                    questionSettings[q.q_id] = {
                        enableStata: !!q.enable_stata,
                        enableAi: !!q.enable_ai,
                        hasAttachment: !!q.has_attachment
                    };
                    if (data.saved_answers && data.saved_answers[q.q_id]) {
                        answers[q.q_id] = data.saved_answers[q.q_id];
                    }
                });

                // v3.0: Attachments
                attachments = data.attachments || [];
                if (attachments.length > 0) {
                    renderAttachments();
                }

                // v3.0: Exam notice
                if (data.exam_notice) {
                    document.getElementById('noticeBanner').textContent = data.exam_notice;
                    document.getElementById('noticeBanner').classList.add('show');
                }

                // v3.0: Anti-cheat
                if (data.anti_screen_switch) {
                    setupStrictAntiCheat();
                }

                updateToolbar();
                renderQuestion();
                renderQuestionNav();
                startTimer();
                startAutoSave();
                updateClock();
                setInterval(updateClock, 1000);

                // v3.0: Check Stata status periodically
                setInterval(checkStataDuringExam, 15000);

                // v3.0: Check termination status
                setInterval(checkTerminated, 10000);

            } catch (e) {
                showToast('网络错误', 'error');
            }
        }

        function updateToolbar() {
            const currentQ = questions[currentIndex];
            if (!currentQ) return;
            const settings = questionSettings[currentQ.q_id] || { enableStata: false, enableAi: false };

            const stataBtns = [document.getElementById('stataShowBtn'), document.getElementById('stataHideBtn')];
            const aiBtn = document.getElementById('aiToggleBtn');

            stataBtns.forEach(btn => {
                if (settings.enableStata) {
                    btn.classList.remove('disabled');
                    btn.disabled = false;
                } else {
                    btn.classList.add('disabled');
                    btn.disabled = true;
                }
            });

            if (settings.enableAi) {
                aiBtn.classList.remove('disabled');
                aiBtn.disabled = false;
            } else {
                aiBtn.classList.add('disabled');
                aiBtn.disabled = true;
            }
        }

        function renderAttachments() {
            const bar = document.getElementById('attachBar');
            const items = document.getElementById('attachItems');
            const path = document.getElementById('attachPath');

            if (attachments.length === 0) {
                bar.classList.remove('show');
                return;
            }

            bar.classList.add('show');
            items.innerHTML = attachments.map(a => `
                <span class="attach-item" onclick="downloadAttachment(${a.attachment_id}, '${a.original_name.replace(/'/g, "\\'")}')">
                    📎 ${a.original_name}
                </span>
            `).join('');
            path.textContent = `下载路径: ${DEFAULT_DOWNLOAD_PATH}`;
        }

        async function downloadAttachment(attachId, filename) {
            const url = `${API}/attachment/download/${attachId}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Download failed');
                const blob = await res.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.click();
                URL.revokeObjectURL(link.href);
                showToast(`附件已下载: ${filename}`);
            } catch (e) {
                showToast('下载失败', 'error');
            }
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            if (!q) return;

            document.getElementById('qNum').textContent = `第 ${currentIndex + 1} / ${questions.length} 题`;
            document.getElementById('qType').textContent = q.q_type;
            document.getElementById('qScore').textContent = `${q.score} 分`;
            document.getElementById('qContent').textContent = q.content;

            const answerDiv = document.getElementById('qAnswer');
            if (['单选题', '判断题'].includes(q.q_type)) {
                let options = [];
                if (q.option_a) options.push({ key: 'A', text: q.option_a });
                if (q.option_b) options.push({ key: 'B', text: q.option_b });
                if (q.option_c) options.push({ key: 'C', text: q.option_c });
                if (q.option_d) options.push({ key: 'D', text: q.option_d });
                answerDiv.innerHTML = `<div class="options">${options.map(o => `
                    <div class="option ${answers[q.q_id] === o.key ? 'selected' : ''}" onclick="selectOption('${q.q_id}', '${o.key}')">
                        <input type="radio" name="q_${q.q_id}" ${answers[q.q_id] === o.key ? 'checked' : ''}>
                        <label><b>${o.key}.</b> ${o.text}</label>
                    </div>
                `).join('')}</div>`;
            } else if (q.q_type === '多选题') {
                let options = [];
                if (q.option_a) options.push({ key: 'A', text: q.option_a });
                if (q.option_b) options.push({ key: 'B', text: q.option_b });
                if (q.option_c) options.push({ key: 'C', text: q.option_c });
                if (q.option_d) options.push({ key: 'D', text: q.option_d });
                const currentAns = answers[q.q_id] || '';
                answerDiv.innerHTML = `<div class="options">${options.map(o => `
                    <div class="option ${currentAns.includes(o.key) ? 'selected' : ''}" onclick="toggleMultiOption('${q.q_id}', '${o.key}')">
                        <input type="checkbox" ${currentAns.includes(o.key) ? 'checked' : ''}>
                        <label><b>${o.key}.</b> ${o.text}</label>
                    </div>
                `).join('')}</div>`;
            } else {
                answerDiv.innerHTML = `<textarea class="answer-textarea" placeholder="请输入答案..." oninput="answers[${q.q_id}]=this.value">${answers[q.q_id] || ''}</textarea>`;
            }

            // Navigation buttons
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            if (currentIndex === questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('submitBtn').style.display = 'inline-block';
            } else {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('submitBtn').style.display = 'none';
            }

            updateToolbar();
            updateQuestionNav();
        }

        function selectOption(qId, key) {
            answers[qId] = key;
            renderQuestion();
        }

        function toggleMultiOption(qId, key) {
            let current = answers[qId] || '';
            if (current.includes(key)) {
                current = current.replace(key, '');
            } else {
                current += key;
            }
            answers[qId] = current;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentIndex > 0) { currentIndex--; renderQuestion(); }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); }
        }

        function renderQuestionNav() {
            const nav = document.getElementById('qNav');
            nav.innerHTML = questions.map((q, i) =>
                `<button class="q-nav-btn ${i === currentIndex ? 'current' : ''} ${answers[q.q_id] ? 'answered' : ''}" onclick="goToQuestion(${i})">${i + 1}</button>`
            ).join('');
        }

        function updateQuestionNav() {
            const nav = document.getElementById('qNav');
            const btns = nav.querySelectorAll('.q-nav-btn');
            btns.forEach((btn, i) => {
                btn.className = `q-nav-btn ${i === currentIndex ? 'current' : ''} ${answers[questions[i].q_id] ? 'answered' : ''}`;
            });
        }

        function goToQuestion(index) {
            currentIndex = index;
            renderQuestion();
        }

        function confirmSubmit() {
            const answered = questions.filter(q => answers[q.q_id]).length;
            document.getElementById('submitInfo').textContent =
                `共 ${questions.length} 题，已作答 ${answered} 题。确认提交？`;
            document.getElementById('submitModal').classList.add('show');
        }

        function closeSubmitModal() {
            document.getElementById('submitModal').classList.remove('show');
        }

        async function doSubmit() {
            closeSubmitModal();
            examSubmitted = true;
            try {
                const res = await fetch(`${API}/exam/session/${sessionId}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answers })
                });
                const data = await res.json();
                if (data.ok) {
                    clearInterval(timerInterval);
                    clearInterval(autoSaveInterval);
                    document.getElementById('questionArea').style.display = 'none';
                    document.getElementById('examToolbar').style.display = 'none';
                    document.querySelector('.sidebar').style.display = 'none';
                    document.getElementById('submittedPage').classList.add('show');
                    document.getElementById('submittedScore').textContent = `${data.total_score} 分`;
                } else {
                    showToast(data.error || '提交失败', 'error');
                    examSubmitted = false;
                }
            } catch (e) {
                showToast('网络错误', 'error');
                examSubmitted = false;
            }
        }

        function startTimer() {
            let remaining = examDuration * 60;
            const timerEl = document.getElementById('timer');

            timerInterval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    showToast('考试时间到，自动提交试卷', 'warning');
                    doSubmit();
                    return;
                }
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                if (remaining <= 300) timerEl.className = 'timer danger';
                else if (remaining <= 600) timerEl.className = 'timer warning';
            }, 1000);
        }

        function startAutoSave() {
            autoSaveInterval = setInterval(() => {
                saveCurrentAnswers();
                document.getElementById('saveStatus').textContent = '已自动保存 ' + new Date().toLocaleTimeString();
            }, 30000);
        }

        async function saveCurrentAnswers() {
            if (!sessionId || examSubmitted) return;
            try {
                await fetch(`${API}/exam/session/${sessionId}/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answers })
                });
            } catch (e) {}
        }

        function updateClock() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
        }

        // Anti-cheat
        function setupStrictAntiCheat() {
            let switchCount = 0;
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && !examSubmitted) {
                    switchCount++;
                    document.getElementById('tabWarning').textContent =
                        `⚠️ 检测到切屏行为！(${switchCount}次) 多次切屏可能导致考试终止`;
                }
            });
        }

        // Prevent shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) ||
                (e.ctrlKey && e.key.toLowerCase() === 'u')) {
                e.preventDefault();
                showToast('⚠️ 禁止使用开发者工具', 'warning');
            }
            if (e.key === 'PrintScreen') {
                e.preventDefault();
                showToast('⚠️ 禁止截屏', 'warning');
            }
        });

        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // Stata controls
        async function stataShow() {
            try {
                const res = await fetch(`${API}/stata/show`, { method: 'POST' });
                const data = await res.json();
                showToast(data.message || 'Stata 窗口已打开', data.ok ? 'success' : 'error');
            } catch (e) { showToast('无法控制 Stata', 'error'); }
        }
        async function stataHide() {
            try {
                const res = await fetch(`${API}/stata/hide`, { method: 'POST' });
                const data = await res.json();
                showToast(data.message || 'Stata 窗口已隐藏', data.ok ? 'success' : 'error');
            } catch (e) { showToast('无法控制 Stata', 'error'); }
        }

        async function checkStataDuringExam() {
            if (examSubmitted || examTerminated) return;
            try {
                const res = await fetch(`${API}/stata/check`);
                const data = await res.json();
                if (!data.stata_running) {
                    showToast('⚠️ 检测到 Stata 已关闭！请重新打开，然后联系老师恢复考试', 'error');
                }
            } catch (e) {}
        }

        // v3.0: Check termination
        async function checkTerminated() {
            if (!sessionId || examSubmitted || examTerminated) return;
            try {
                const res = await fetch(`${API}/exam/session/${sessionId}/status`);
                const data = await res.json();
                if (data.terminated || data.status === 'submitted') {
                    examTerminated = true;
                    clearInterval(timerInterval);
                    clearInterval(autoSaveInterval);
                    document.getElementById('questionArea').style.display = 'none';
                    document.getElementById('examToolbar').style.display = 'none';
                    document.querySelector('.sidebar').style.display = 'none';
                    if (data.terminated) {
                        document.getElementById('terminatedReason').textContent =
                            '你的考试已被老师终止，请联系老师。';
                    }
                    document.getElementById('terminatedPage').classList.add('show');
                }
            } catch (e) {}
        }

        // AI popup
        let aiOpen = false;
        function toggleAI() {
            if (document.getElementById('aiToggleBtn').disabled) return;
            aiOpen = !aiOpen;
            const popup = document.getElementById('aiPopup');
            const btn = document.getElementById('aiToggleBtn');
            if (aiOpen) {
                popup.classList.add('show');
                btn.classList.add('active');
                btn.textContent = '💬 关闭 AI 辅助';
                changeAI();
            } else {
                popup.classList.remove('show');
                btn.classList.remove('active');
                btn.textContent = '💬 打开 AI 辅助';
                document.getElementById('aiFrame').src = 'about:blank';
            }
        }
        function changeAI() {
            document.getElementById('aiFrame').src = document.getElementById('aiSelect').value;
        }

        window.addEventListener('beforeunload', () => {
            if (sessionId && !examSubmitted) {
                navigator.sendBeacon(`${API}/exam/session/${sessionId}/save`, JSON.stringify({ answers }));
            }
        });

        loadExam();
    </script>
</body>
</html>
