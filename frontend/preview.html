<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>样卷预览 - AI智能考试系统</title>
    <style>
        :root {
            --bg-root: #faf9f7;
            --bg-card: #ffffff;
            --bg-hover: #f5f3f0;
            --bg-input: #ffffff;
            --border-default: #e8e5e0;
            --border-hover: #d4cfc8;
            --text-primary: #1a1816;
            --text-secondary: #6b6560;
            --text-tertiary: #9e9892;
            --accent: #1a1816;
            --accent-dim: rgba(26,24,22,0.06);
            --success: #4a8c5c;
            --success-dim: rgba(74,140,92,0.08);
            --warning: #c4904a;
            --warning-dim: rgba(196,144,74,0.08);
            --error: #c45a5a;
            --error-dim: rgba(196,90,90,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--bg-root); min-height: 100vh; }
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-default);
            color: var(--text-primary); padding: 12px 30px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .header h1 { font-size: 1.2em; font-weight: 600; }
        .header .info { font-size: 0.88em; color: var(--text-secondary); }

        .main { display: flex; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .question-area { flex: 1; background: var(--bg-card); border-radius: var(--radius-md); padding: 30px; border: 1px solid var(--border-default); display: flex; flex-direction: column; }
        .question-header { margin-bottom: 24px; }
        .q-num { font-size: 0.88em; color: var(--text-secondary); margin-bottom: 4px; }
        .q-type { display: inline-block; padding: 3px 10px; background: var(--accent-dim); border-radius: var(--radius-sm); font-size: 0.8em; color: var(--accent); font-weight: 500; }
        .q-score { float: right; color: var(--accent); font-weight: 600; }
        .question-content { font-size: 1.05em; line-height: 1.8; margin-bottom: 24px; color: var(--text-primary); }
        .question-content img { max-width: 100%; border-radius: var(--radius-sm); margin-top: 12px; }

        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); background: var(--bg-card); }
        .option .letter { font-weight: 600; color: var(--accent); min-width: 24px; }
        .option .text { color: var(--text-primary); font-size: 0.98em; line-height: 1.6; }
        .option .text img { max-width: 200px; max-height: 200px; border-radius: var(--radius-sm); display: block; margin-top: 4px; }
        .option .text code { font-size: 0.88em; color: var(--text-secondary); }

        .sidebar { width: 200px; background: var(--bg-card); border-radius: var(--radius-md); padding: 20px; border: 1px solid var(--border-default); align-self: flex-start; position: sticky; top: 80px; }
        .sidebar h3 { font-size: 0.92em; color: var(--text-primary); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-default); }
        .q-nav-type { font-size: 0.8em; color: var(--text-secondary); margin: 8px 0 4px; font-weight: 500; }
        .q-nav-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .q-nav-btn { width: 36px; height: 36px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.82em; font-weight: 500; transition: all 0.15s; background: var(--bg-card); color: var(--text-primary); }
        .q-nav-btn.current { background: var(--accent); color: var(--bg-card); border-color: var(--accent); }
        .q-nav-btn:hover { background: var(--bg-hover); border-color: var(--border-hover); }

        .back-btn {
            width: 100%; padding: 10px; margin-top: 16px;
            border: 1px solid var(--border-default); border-radius: var(--radius-sm);
            background: var(--bg-card); cursor: pointer;
            font-size: 0.88em; color: var(--text-primary); transition: all 0.15s;
        }
        .back-btn:hover { background: var(--bg-hover); border-color: var(--border-hover); color: var(--accent); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }

        @media (max-width: 640px) { .main { flex-direction: column; } .sidebar { width: 100%; position: static; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>样卷预览</h1>
        <div class="info" id="examTitle">加载中...</div>
    </div>

    <div class="main">
        <div class="question-area" id="questionArea">
            <div id="questionContent"></div>
            <div id="navButtons" style="margin-top:24px;display:flex;justify-content:space-between;">
                <button class="back-btn" onclick="prevQuestion()" disabled>上一题</button>
                <button class="back-btn" style="width:auto;border-color:var(--accent);color:var(--accent);border:1px solid var(--accent);background:transparent;" onclick="window.close()">关闭预览</button>
                <button class="back-btn" onclick="nextQuestion()">下一题</button>
            </div>
        </div>
        <div class="sidebar" id="sidebar">
            <h3>题目导航</h3>
            <div id="questionNav"></div>
            <button class="back-btn" onclick="window.location.href='teacher.html'">返回教师管理</button>
        </div>
    </div>

    <script>
        const API = '/api';
        const params = new URLSearchParams(window.location.search);
        const examId = params.get('exam_id');

        let questions = [];
        let currentIdx = 0;
        let attachments = [];

        function escapeHtml(text) {
            if (!text) return '';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function isImageFile(name) {
            if (!name) return false;
            const ext = name.split('.').pop().toLowerCase();
            return ['png','jpg','jpeg','gif','bmp','webp','svg'].includes(ext);
        }

        function renderContentWithImages(content, remark) {
            let html = escapeHtml(content);
            if (remark) {
                const files = remark.split(';').map(f => f.trim()).filter(Boolean);
                files.forEach(f => {
                    if (isImageFile(f)) {
                        html += `<div style="margin-top:12px;"><img src="${API}/exam/${examId}/attachments/file/${encodeURIComponent(f)}" alt="${escapeHtml(f)}" style="max-width:100%;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.06);" onerror="this.style.display='none'"></div>`;
                    }
                });
            }
            return html;
        }

        function renderOptionWithImage(text) {
            if (!text) return '';
            if (isImageFile(text.trim())) {
                return `<img src="${API}/exam/${examId}/attachments/file/${encodeURIComponent(text.trim())}" alt="${escapeHtml(text.trim())}" style="max-width:160px;max-height:160px;border-radius:6px;display:block;" onerror="this.style.display='none'"><code style="font-size:0.82em;color:var(--text-tertiary);margin-top:4px;">${escapeHtml(text)}</code>`;
            }
            return escapeHtml(text);
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            if (!q) return;

            const area = document.getElementById('questionContent');
            // Compute type-local question number
            const qType = q.q_type;
            let typeLocalNum = 1;
            let typeTotal = 0;
            for (let i = 0; i < questions.length; i++) {
                if (questions[i].q_type === qType) {
                    typeTotal++;
                    if (i < currentIdx) typeLocalNum++;
                }
            }
            const header = `<div class="question-header">
                <div class="q-num">${qType} 第${typeLocalNum}题 / 共${typeTotal}题（本类）</div>
                <span class="q-type">${escapeHtml(q.q_type)}</span>
                <span class="q-score">${q.score} 分</span>
            </div>`;

            // v4.2: Show data file badges in preview
            let dataFileHtml = '';
            if (q.data_file) {
                const files = q.data_file.split(';').map(f => f.trim()).filter(Boolean);
                if (files.length > 0) {
                    dataFileHtml = `<div style="margin:8px 0 12px;padding:8px 12px;background:var(--accent-dim);border-radius:8px;border:1px solid var(--border-default);font-size:0.85em;color:var(--text-secondary);">数据文件: ${files.map(f => `<code style="background:var(--accent-dim);padding:2px 6px;border-radius:4px;margin:0 2px;color:var(--accent);">${escapeHtml(f)}</code>`).join(', ')}</div>`;
                }
            }

            const content = `<div class="question-content">${renderContentWithImages(q.content, q.remark)}${dataFileHtml}</div>`;

            let optionsHtml = '';
            const optionLabels = ['A', 'B', 'C', 'D'];
            const optionFields = [q.option_a, q.option_b, q.option_c, q.option_d];
            if (['单选题', '多选题', '判断题'].includes(q.q_type)) {
                optionsHtml = '<div class="options">';
                optionFields.forEach((opt, i) => {
                    if (!opt && i < 2 && q.q_type === '判断题') return;
                    if (!opt) return;
                    optionsHtml += `<div class="option">
                        <span class="letter">${optionLabels[i]}.</span>
                        <div class="text">${renderOptionWithImage(opt)}</div>
                    </div>`;
                });
                optionsHtml += '</div>';
            } else {
                optionsHtml = '<div style="padding:16px;background:var(--bg-hover);border-radius:var(--radius-md);color:var(--text-tertiary);border:1px solid var(--border-default);">(此题为简答/综合题，学生在此作答)</div>';
            }

            area.innerHTML = header + content + optionsHtml;

            // Update nav highlights
            document.querySelectorAll('.q-nav-btn').forEach((btn, i) => {
                btn.classList.toggle('current', i === currentIdx);
            });
            document.getElementById('navButtons').children[0].disabled = currentIdx === 0;
            document.getElementById('navButtons').children[2].disabled = currentIdx === questions.length - 1;
        }

        function prevQuestion() {
            if (currentIdx > 0) { currentIdx--; renderQuestion(); }
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) { currentIdx++; renderQuestion(); }
        }

        async function loadPreview() {
            try {
                const res = await fetch(`${API}/exam/${examId}/preview`);
                const data = await res.json();
                if (!data.questions || data.questions.length === 0) {
                    document.getElementById('questionContent').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-tertiary);">暂无题目数据</div>';
                    return;
                }

                questions = data.questions;
                document.getElementById('examTitle').textContent = (data.exam && data.exam.title) || '样卷';

                // Build nav
                const qNav = document.getElementById('questionNav');
                const types = {};
                let globalIdx = 0;
                questions.forEach((q, i) => {
                    if (!types[q.q_type]) types[q.q_type] = [];
                    types[q.q_type].push({ global: i, local: types[q.q_type].length + 1 });
                });
                Object.keys(types).forEach(type => {
                    qNav.innerHTML += `<div class="q-nav-type">${type}</div><div class="q-nav-group">`;
                    types[type].forEach(item => {
                        qNav.innerHTML += `<button class="q-nav-btn" onclick="currentIdx=${item.global};renderQuestion()">${item.local}</button>`;
                    });
                    qNav.innerHTML += `</div>`;
                });

                renderQuestion();
            } catch (e) {
                document.getElementById('questionContent').innerHTML = '<div style="text-align:center;padding:40px;color:var(--error);">加载失败：' + e.message + '</div>';
            }
        }

        loadPreview();
    </script>
</body>
</html>
